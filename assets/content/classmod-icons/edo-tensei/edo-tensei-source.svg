<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Edo Tensei Summoning Coffin</title>
  <desc id="desc">A pale wooden reincarnation coffin looming overhead from a low frog-eye perspective.</desc>
  <defs>
    <radialGradient id="aura" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#65575f" stop-opacity=".8"/>
      <stop offset=".56" stop-color="#2c2830" stop-opacity=".78"/>
      <stop offset="1" stop-color="#100e13" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="underlight" cx="50%" cy="100%" r="72%">
      <stop offset="0" stop-color="#5d2935" stop-opacity=".5"/>
      <stop offset=".48" stop-color="#22181f" stop-opacity=".24"/>
      <stop offset="1" stop-color="#100e13" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frontWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#beb4ab"/>
      <stop offset=".42" stop-color="#978b86"/>
      <stop offset=".78" stop-color="#766d70"/>
      <stop offset="1" stop-color="#514b53"/>
    </linearGradient>
    <linearGradient id="sideWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#756b6b"/>
      <stop offset=".55" stop-color="#504950"/>
      <stop offset="1" stop-color="#29262d"/>
    </linearGradient>
    <linearGradient id="topWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d1c7bd"/>
      <stop offset="1" stop-color="#938985"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0ead7"/>
      <stop offset="1" stop-color="#c9bea5"/>
    </linearGradient>
    <filter id="shadow" x="-35%" y="-20%" width="180%" height="175%">
      <feDropShadow dx="8" dy="18" stdDeviation="16" flood-color="#060508" flood-opacity=".96"/>
    </filter>
    <filter id="sealShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#171218" flood-opacity=".68"/>
    </filter>
    <clipPath id="frontClip">
      <path d="M168 59l168-2 57 400H99z"/>
    </clipPath>
    <clipPath id="sideClip">
      <path d="M336 57l29 17 57 351-29 32z"/>
    </clipPath>
  </defs>

  <circle cx="256" cy="246" r="243" fill="url(#aura)"/>
  <circle cx="256" cy="280" r="230" fill="url(#underlight)"/>
  <path d="M121 468c22-58 47-118 52-212 4-73-7-147-5-197l168-2c7 59 7 130 16 198 13 93 36 155 58 213z"
    fill="#09080c" opacity=".34"/>

  <ellipse cx="260" cy="462" rx="196" ry="32" fill="#08070a" opacity=".9"/>
  <ellipse cx="260" cy="455" rx="145" ry="18" fill="#552430" opacity=".34"/>

  <g filter="url(#shadow)">
    <path d="M336 57l29 17 57 351-29 32z"
      fill="url(#sideWood)" stroke="#19171c" stroke-width="11" stroke-linejoin="round"/>
    <path d="M168 59l168-2 57 400H99z"
      fill="url(#frontWood)" stroke="#19171c" stroke-width="12" stroke-linejoin="round"/>
    <path d="M168 59l24-22 149-1 24 38-29-17z"
      fill="url(#topWood)" stroke="#19171c" stroke-width="10" stroke-linejoin="round"/>

    <g clip-path="url(#frontClip)" fill="none" stroke-linecap="round">
      <path d="M190 87c2 74-13 162-29 223-10 38-22 84-28 123M226 83c-5 88-4 170-12 242-4 38-7 75-8 119M273 81c5 92 10 175 19 251 5 39 10 77 11 116M313 83c11 80 27 162 38 227 8 45 15 87 19 126"
        stroke="#5c565d" stroke-width="7" opacity=".62"/>
      <path d="M182 102c13 21 0 41 8 61M216 113c-9 25 3 47-4 70M284 105c12 25 1 45 12 68M320 112c-3 24 14 45 11 68M148 261c15 25-2 48 9 75M207 276c-13 30 3 58-8 88M303 267c14 29-1 55 12 85M358 264c-4 29 16 54 12 83"
        stroke="#d1c7be" stroke-width="4" opacity=".48"/>
      <path d="M172 198c17 12 7 28 19 42M239 242c-8 21 8 39 1 61M328 210c14 17 3 34 15 50M123 370c17 15 4 36 17 55M259 368c-10 23 7 47-2 73M362 355c17 20 3 42 17 62"
        stroke="#4c474e" stroke-width="5" opacity=".54"/>
    </g>

    <g clip-path="url(#sideClip)" fill="none" stroke-linecap="round">
      <path d="M350 88c6 75 26 184 43 317M362 104c-1 52 17 115 18 164"
        stroke="#9d9290" stroke-width="5" opacity=".38"/>
      <path d="M347 156l27 17M362 312l38 23" stroke="#252229" stroke-width="5" opacity=".55"/>
    </g>

    <path d="M211 145l77-1 14 91-99 3z"
      fill="url(#paper)" stroke="#716969" stroke-width="7" stroke-linejoin="round" filter="url(#sealShadow)"/>
    <g fill="none" stroke="#151317" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <path d="M226 164l13 8M220 181l31-1-23 21 2 27M230 202l-11 12M233 201l13 10"/>
      <path d="M253 177l31-1 2 28c1 13-3 20-15 23M265 177c-1 19-7 36-18 50"/>
    </g>

    <path d="M174 72l157-2M111 442l267-1" fill="none" stroke="#ddd3ca"
      stroke-width="6" stroke-linecap="round" opacity=".55"/>
    <path d="M113 451l266-1" fill="none" stroke="#252129" stroke-width="8" stroke-linecap="round" opacity=".72"/>
  </g>
</svg>
