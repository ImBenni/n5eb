<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Standard Rinnegan</title>
  <desc id="description">A lavender eye with a black pupil and six evenly spaced concentric rings.</desc>
  <defs>
    <radialGradient id="iris" cx="43%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#eee7ff"/>
      <stop offset="52%" stop-color="#c6b0eb"/>
      <stop offset="100%" stop-color="#8d6bb8"/>
    </radialGradient>
    <radialGradient id="pupil" cx="38%" cy="34%" r="68%">
      <stop offset="0%" stop-color="#34243f"/>
      <stop offset="100%" stop-color="#100b16"/>
    </radialGradient>
    <clipPath id="eye-clip">
      <circle cx="256" cy="256" r="238"/>
    </clipPath>
  </defs>
  <circle cx="256" cy="256" r="238" fill="url(#iris)" stroke="#17101e" stroke-width="14"/>
  <g clip-path="url(#eye-clip)" fill="none" stroke="#24172e" stroke-width="12">
    <circle cx="256" cy="256" r="48"/>
    <circle cx="256" cy="256" r="84"/>
    <circle cx="256" cy="256" r="120"/>
    <circle cx="256" cy="256" r="156"/>
    <circle cx="256" cy="256" r="192"/>
    <circle cx="256" cy="256" r="228"/>
  </g>
  <circle cx="256" cy="256" r="25" fill="url(#pupil)"/>
  <ellipse cx="247" cy="246" rx="7" ry="5" fill="#ffffff" opacity="0.22"/>
</svg>
