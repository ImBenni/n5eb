system:
  description:
    value: >-
      <p>As a Bonus action, you can combine the Orbs into a Yang Weapon. This weapon has the statistics of one simple,
      martial or exotic melee weapon of your choice, it has a bonus to weapon attack and damage rolls equal to half the
      amount of Orbs spend to create it (rounded up), and gains 1 rank of reach for each Orb spend after the first. You
      are always proficient with this weapon.</p><p>The weapon last until your Yang Seal activation ends or until you
      dismiss the weapon as a bonus action. Orbs spend on the weapon are not recovered until you dismiss the weapon.</p>
