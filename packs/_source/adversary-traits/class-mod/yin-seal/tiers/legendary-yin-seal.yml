    value: >-
      <p>unique to it as follows; LESSER YIN SEAL Tier Bonus: +2</p><ul><li>Gain 2 Yin Seal Traits. These traits count
      as both an Affiliation Trait and Role Trait.</li><li>Gain 2 Yin Arts</li><li>+2 Bonus to AC and all saving
      throws.</li><li>+10 Damage Reduction.</li><li>+20 Movement Speed.</li><li>+6 Stat points.</li><li>All jutsu this
      adversary cast increase the number of damage, healing, temporary hit point or damage reduction dice by +2. GREATER
      YIN SEAL Tier Bonus: +4</li><li>Gain 4 Yin Seal Traits. These traits count as both an Affiliation Trait and Role
      Trait.</li><li>Gain 4 Yin Arts</li><li>+3 Bonus to AC and all saving throws.</li><li>+15 Damage
      Reduction.</li><li>+30 Movement Speed.</li><li>+8 Stat points.</li><li>All jutsu this adversary cast increase the
      number of damage, healing, temporary hit point or damage reduction dice by +3. LEGENDARY YIN SEAL Tier Bonus:
      +8</li><li>Gain 6 Yin Seal Traits. These traits count as both an Affiliation Trait and Role Trait.</li><li>Gain 6
      Yin Arts</li><li>+3 Bonus to AC and all saving throws.</li><li>+25 Damage Reduction.</li><li>+30 Movement
      Speed.</li><li>+10 Stat points.</li><li>All jutsu this adversary cast increase the number of damage, healing,
      temporary hit point or damage reduction dice by +4.</li></ul>
