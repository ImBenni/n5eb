system:
  description:
    value: >-
      <p>Your Cursed Seal begins to hum often, beckoning you to use it. Telling you that you aren't enough on your own.
      Telling you that your strength alone can be greater. All you need to do is let it in. You cannot release the power
      sealed within your Cursed Seal without first accepting the Corruption that comes with it.</p><p>By willingly
      accepting 1 rank of Corruption, you release a portion of the latent power with this Cursed seal. This allows you
      to enter a special state called Cursed Seal Release often described as activating your Cursed Seal. So long as you
      have at least 10 Cursed Chakra you can, as a Bonus action, activate your Cursed Seal, entering your Cursed Seal
      Release state. This state is often referred to in different Stages.</p><p>You begin with access to Stage 1. The
      specific benefits of your Cursed Seal can be found under your Cursed Seal Type later in this class mod.
      Universally, all Cursed Seal users gain the following benefits and have the following restrictions from their
      cursed seal based on the Stage they are in.</p>
    chat: ''
