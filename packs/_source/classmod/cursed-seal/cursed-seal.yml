folder: QrlbIsONYyGes5Oa
name: Cursed Seal
type: classmod
img: systems/n5eb/assets/content/classmod-icons/cursed-seal/cursemark-second-state.webp
system:
  description:
    value: >-
      <h2>Cursed Seal</h2><p>Gaining the Cursed seal is a controversial event. From a bygone era of dark ninjutsu and
      experimentation, this relic of history has survived this long as a testament to the twisted nature of the people
      who study and employ them.</p><p>Characters who are afflicted with a curse seal are usually targets of dark
      shinobi, twisted scientists or corrupt figures who wish to use them in a plot to convert them over to their side.
      In some cases, they are guided to a certain decisions and forced to make it against their better judgement. Cursed
      seals are powerful Fuinjutsu that cannot be removed by normal means.</p><p>Those with these marks are generally
      under the command, dominion or even patronage of a powerful figure, similar to that of Orochimaru. Players who
      find themselves sporting a cursed seal are not looked at with eyes of envy or even joy. A cursed seal can lead to
      banishment, torture, and in some cases death by association.</p><p>This isn't a marking that most villages would
      allow to freely roam around without close supervision or excessive amounts of trust. The Cursed seal is a tool
      that can be used for plot relevance from the side of the DM and mechanical benefit of the Player.</p><p>When
      granted to the player, the Curse Seal immediately takes hold and grants the creator of it a direct line of
      influence over them and granting them power to overcome almost insurmountable trials they may be facing at that
      particular moment in time. This is a powerful Class Mod and should not be handed out freely without careful
      consideration into enemy choice.</p><h3>Gaining a Cursed Seal</h3><p>The Curse Seal cannot be learned or found, it
      cannot be self-imposed and is always given to the player by hostile or less than friendly means. In most cases
      when the Curse seal is applied to the player it is in a conflict of some sort with the Cursed seals current master
      or creator.</p><p>The Curse seal is a powerful asset and is generally handed out only at points when the Villain
      both wants to influence a particular player, the characters are entering a point in time where they are getting
      slight bumps in their power &amp; the DM wants to include a level of Risk and reward in regards to how a character
      goes about getting stronger at a cost.</p><p>Generally, there is not a save associated with receiving a Cursed
      seal and should not be. The only case in which a saving throw should be made should be to resist passing out after
      it initially takes hold. The application of a Curse seal should always take place during a point in time when its
      most makes sense to introduce such variable power ups in the game.</p><p>Once you gain the Cursed Seal, it's
      influence tears its way into your mind and its influence spreads throughout your body, slightly corroding
      it.</p><h3>Leveling Up the Cursed Seal</h3><p>Leveling up a Curse Seal is an arduous task, unlike normal ninja
      classes that require the player to gain XP to reach their next level, the curse seal requires a sacrifice of some
      sort on the player's behalf.</p><p>This must come willingly and cannot be forced by a 3rd party. A creature cannot
      charm another creature into willingly advancing to the next level. By permanently gaining a rank of Corruption you
      permanently increase your Cursed Chakra pool.</p><p>Each Level of the Cursed Seal requires more ranks of
      Corruption, relying on the player to offer up more and more of their body and stamina to the Curse seal to receive
      more and more of its benefits. Corruption cannot be removed, by any means. When the Curse seal is advanced in
      level, the player who did so, gains access to the new levels features.</p><p>The Cursed Seal can only be advanced
      via player action and is not automatic in any way. Some Corruption effects, and even Cursed seal Features will
      reference your Cursed Seal patron DC. You can calculate this DC using the following; Cursed Seal Patron DC: 5 +
      Current Rank of Corruption.</p>
    chat: ''
