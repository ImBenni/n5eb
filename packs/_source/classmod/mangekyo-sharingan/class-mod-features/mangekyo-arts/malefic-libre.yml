folder: lAKW2wIWtDO9Aor8
name: Malefic Libre
type: spell
_id: hYCIeLfGI6bLtO49
img: systems/n5eb/assets/content/eyes/mangekyo-sharingan.webp
system:
  description:
    value: >-
      <p>Alternative Cost: 8 Light</p><p>You use your Sharingan to drill deep into the subconsciousness of a creature
      whom you can see and is looking at you. By making eye contact with a creature while your Mangekyō Sharingan is
      active you are able to inject a powerful illusion deep into the minds of your target.</p><p>All creatures of your
      choice within range feels a pulse of illusory Malefic chakra course through them as this chakra causes misfiring
      neurons within their brains. All select creatures must make a Wisdom saving throw. If the target creature does not
      have Chakra sight or blindness, they make their saving throw by rolling 2d10, in place of a d20. Rolling a 1 with
      either of the aforementioned dice counts as a natural 1.</p><p>Chimeric Synergy: If you have the Chimeric Type
      class mod feature you can choose between Wisdom, Intelligence or Charisma saving throw upon
      casting.</p><p>Critical Success: Affected creature is able to resist this Art's effects and maintain their sense
      of self.</p><p>Success: Affected creature is able to resist only some of this Art's effects and maintain only some
      of their sense of self. They suffer the effects of Failure, but the DC is only 8. At the end of their next turn,
      this effect then ends on them.</p><p>Failure: Affected creatures mind is effectively overwritten with unreliable
      brain signals. For the duration when the affected creature would attempt to take any action or even move, they
      must make a DC 13 Wisdom ability check. On a failure, they become stunned until the end of that turn. They remake
      this saving throw at the end of each of their turns.</p><p>Critical Failure: Same effect as failure but the DC
      becomes 23.</p>
    chat: ''
