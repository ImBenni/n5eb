system:
  description:
    value: >-
      <p>Sage Art Type: Passive </p><p>Your body has consumed enough Senjutsu chakra for it to leak into your normal
      Jutsu passively. </p><p>Once per turn, on your turn, you can activate or deactivate this passive. At the beginning
      of each turn you have this passive active; you spend the listed Sage Chakra Cost. This cost is spent even if you
      decide to end the passive at the beginning of your turn. You gain the following Benefits;</p><p>• Sage Chakra
      Cost: 6 Sage Chakra. </p><p>• Reduced Sage Chakra Cost: 4 Sage Chakra. </p><p>• Increase your Sage Art DC by +1.
      This increases to +2 at 3rd level in this class mod and +3 at 5th level. </p><p>• Jutsu and Senjutsu you cast that
      deals damage, heals, grants Damage reduction or temporary hit points, increases the number of dice rolled by +1.
      This increases to +2 at 3rd level in this class mod and +3 at 5th level. </p><p>• When you clash with a creature
      using a Jutsu or Art, you gain a +1d6 bonus to the check.</p>
