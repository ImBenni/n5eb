system:
  description:
    value: >-
      <p>Reduced Cost: 5 Sage Chakra</p><p> You use Sage Chakra to conjure a Summoning circle in the sky above a target
      you can see within range. You conjure 3 red torii that fall down from the summoning circle slamming down around
      the intended target. The target creature must succeed on a Strength saving throw. On a failed save, they are
      forced to the ground by the weight of your chakra, being knocked prone and restrained for the duration, and taking
      14d8 chakra damage. On a successful save the target is only knocked prone and takes half the listed damage with no
      further effects.</p><p>At the beginning of a creatures turn who failed their Strength save, they remake their
      save. On a failure, they take 7d8 chakra damage and increase the cost of jutsu cast by three (3) times its
      original cost and the cost of Arts cast by +5 its original cost, until the beginning of their next turn. On a
      success, no further effects this round.</p><p>Regardless, a creature whom originally failed their first Strength
      saving throw as a result of this Senjutsu can spend its action to make remake their saving throw, ending this
      Senjutsu on a success.</p><p>Sage Affinity Synergy: If you have the Carnivoran Senjutsu class mod feature, when
      you cast this Senjutsu, you may utilize the techniques that your tribe has entrusted you with. If you do, you drop
      an additional 2 more torii gates on top of your target increase the chakra damage dealt by 3d8, the cost of the
      targets jutsu cast by five (5) times its original cost, the cost of Arts by +10 its original cost and imposing a
      1d4 penalty on the targets saves against this Senjutsu.</p>
