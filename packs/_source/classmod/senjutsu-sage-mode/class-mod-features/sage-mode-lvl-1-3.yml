name: Sage Mode [Lvl 1 & 3]
type: feat
img: systems/n5eb/assets/content/classmod-icons/senjutsu/sage-mode.webp
system:
  description:
    value: >-
      <p>Sage mode exceeds the absolute peak of most shinobi's careers in terms of their power. You can enter Sage mode
      as a Bonus action, so long as you have at least 1 Sage Chakra. You automatically exit sage mode when you reach 0
      Sage Chakra or would spend more Sage Chakra than you have remaining. You can exit sage mode willingly as a Bonus
      action on your turn, doing this disperses all remaining Sage Chakra within you. Jutsu you use and maintain while
      in Sage Mode, must use Sage chakra. Using Sage Chakra while in Sage mode does the following;</p><p>• Jutsu you
      cast while in Sage Mode now cost an amount equal to their Rank, regardless of circumstance.</p><p> o D-Rank: 3
      Sage Chakra, C-Rank: 5 Sage Chakra, B-Rank: 7 Sage Chakra, A-Rank: 11 Sage Chakra, S-Rank: 15 Sage Chakra. </p><p>
      o Jutsu you cast while in Sage Mode, with the combination keyword, have a +5 Sage Chakra cost increase. While they
      do split their chakra cost evenly with all non-Sage Chakra users, you must still spend the listed Sage Chakra Cost
      + 5. This cannot be reduced by any effects, outside of this Class Mod.</p><p> o Jutsu you cast in Sage Mode, that
      deals damage, heals, grants Damage reduction or temporary hit points, increases the number of dice rolled by +2,
      once per casting. </p><p>• You gain a +3 bonus to all Saving throws, Ability Checks &amp; Skill checks (excluding
      checks and saves made in relation to this Class Mod).</p><p>Beginning at 3rd level in this class mod you have
      reached a pinnacle of control and technique not seen in generations. You gain the following benefits;</p><p>• You
      can now use Advanced Sage Art: Abilities, at their reduced cost. </p><p>• You can now cast Advanced Sage Art:
      Techniques, at their reduced cost. </p><p>• You can now gain the benefit of Advanced Sage Art: Passives, at their
      reduced Sage Chakra cost, per turn.</p>
