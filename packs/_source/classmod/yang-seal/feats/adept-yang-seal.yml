system:
  description:
    value: >-
      <p><strong>Category:</strong> Class Mod Prerequisite: Level 10+, 2 Bonds or spend 25 Downtime Your Yang seal grows
      in strength, as it is charged by the power of your bonds. This makes you recognized as an, Adept Yang. You gain
      the following benefits:</p><ul><li>Once per Full-Rest, you can spend a Full -Turn Action to enter Adept Yang. When
      you do, your seal glows a Yellow light. You can remain in this state for no more than 10 minutes.</li><li>While in
      Adept Yang you gain 5 Yang Charges and your Adept Yang benefits. You can spend these charges to cast a Yang
      Art.</li><li>You gain 1 additional Truth-Seeking Orb.</li><li>You gain a Sage Cloak of your choice, which affects
      allied creatures within 15ft of you. You can spend a Yang Charge to activate this cloak until the start of your
      next turn.</li></ul>
