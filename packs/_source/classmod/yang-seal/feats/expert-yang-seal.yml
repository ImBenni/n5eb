system:
  description:
    value: >-
      <p><strong>Category:</strong> Class Mod Prerequisite: Level 13+, 4 Bond or spend 25 Downtime Your Yang seal has
      become more powerful, as the hopes of those that you protect generate more Yang chakra. This grants an explosive
      transformation and new power called, Expert Yang. You gain the following benefits:</p><ul><li>Once per Full-Rest,
      you can spend a Full -Turn Action to enter Expert Yang. When you do, your whole body is covered by a yellow -white
      aura that surrounds you, resembling a jacket or coat. You can remain in this state for no more than 10
      minutes.</li><li>While in Expert Yang you gain 7 Yang Charges and your Expert Yang benefits. You can spend these
      charges to cast a Yang Art or activate a Sage Cloak.</li><li>You gain 1 additional Yang Arts That cost 6 Yang
      Chakra or less.</li><li>You gain one additional Sage Cloak</li><li>You gain 1 additional Truth-Seeking
      Orb.</li></ul>
