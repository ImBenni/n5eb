system:
  description:
    value: >-
      <p><strong>Category:</strong> Class Mod Prerequisite: Level 8+, granted Yang seal. You have been marked by the
      power of Yang release, combining your fate with that of other creatures. This mark has yet to grow in strength to
      its full potential, making some experts call it an Imperfect binding. You gain the following
      benefits:</p><ul><li>Once per Full-Rest, you can spend a Full -Turn Action to activate Imperfect Yang. When you
      do, your Yang seal starts to shine a white light granting you this variants bonuses. You can remain in this state
      for no more than 10 minutes.</li><li>While in Imperfect Yang you gain 3 Yang Charges and the Imperfect benefits of
      having your Yang Seal active. You can spend these charges to cast a Yang Art.</li><li>You gain 2 Yang Arts. That
      cost 6 Yang Chakra or less.</li><li>You gain 1 Truth-Seeking Orb.</li></ul>
