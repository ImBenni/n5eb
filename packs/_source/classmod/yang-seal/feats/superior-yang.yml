system:
  description:
    value: >-
      <p><strong>Category:</strong> Class Mod Prerequisite: Level 15+, 6 Bonds or spend 25 Downtime. Your Yang seal has
      totally bonded with your body granting you the peak of its power and a new stage called, Superior Yang. You gain
      the following benefits:</p><ul><li>Once per Full-Rest, you can spend a Full -Turn Action to enter Superior Yang.
      When you do, are completely covered by the Yellow -white aura, which resembles a large cloak made of flames. You
      can remain in this state for no more than 10 minutes.</li><li>While in Superior Yang you gain 9 Yang Charges. You
      can spend these charges to cast Yang Arts or activate Sage Cloaks</li><li>You gain 2 additional Truth-Seeking
      Orbs.</li><li>You gain 1 additional Yang Arts That cost 7 Yang Chakra or less.</li></ul>
