system:
  description:
    value: >-
      <p>Finally, you begin to understand the meaning of the Yin, that is, to become a light of Hope and understanding
      that will lead the world. Starting at 3rd level, while your Yang Seal is active, you regain 3 Yang Chakra for each
      allied creature within 30ft of you, that is not a clone or construct. At 5th level, accepting this philosophy let
      you master you Yang Release Chakra.</p><p>Your Yang Seal can remain active for 1 hour, and Yang Chakra Mode can
      remain active 10 minutes. Also at 5th level, when an allied creature, other than yourself, would be reduced to 0
      hit points, you can spend 10 Yang chakra to reduce it to 1 hit point instead. YANG ARTS YANG NINJUTSU</p>
