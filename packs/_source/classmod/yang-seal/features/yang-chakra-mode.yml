system:
  description:
    value: >-
      <p>Starting at 3rd level, your control over the Yang Chakra coursing through you becomes greater, allowing you to
      cover yourself in it, enhancing your abilities. Your Yang Seal can remain active for 10 minutes, as your body
      adapts to the Yang Chakra it creates. In addition, while your Yang Seal is active, you can spend an action and
      reduce your current and maximum Chakra dice by 2 to activate Yang Chakra Mode.</p><p>While Yang Chakra Mode is
      active, you gain the following:</p><ul><li>You emit bright light within your Sage Cloak radius, and din light
      twice that distance. Darkness created by jutsu or other non -class mod effects is dispelled inside this
      area.</li><li>You gain a +4 bonus, instead of +2, to your AC, saving throws, ability checks and skill
      checks.</li><li>You gain 3 additional Truth -Seeking Orbs.</li><li>Your speed increases by 20ft, instead of
      10ft.</li><li>You gain a flight speed equal to your walking speed. Yang Chakra Mode last for 1 minute, until you
      fall unconscious, or until you deactivate it as a bonus action, whichever happens first. Ending your Yang Seal
      activation also ends Yang Chakra Mode.</li></ul>
