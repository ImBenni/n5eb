system:
  description:
    value: >-
      <p>• Creatures within range gain temporary hit points equal to twice your character level, start of each of your
      turns. They also gain 10 damage reduction for the duration of these temporary hit points.</p><ul><li>Creatures
      that have temporary hit points granted by this cloak become immune to the charmed and demoralized conditions, and
      have advantage on saving throws against genjutsu.</li><li>Creatures that have temporary hit points granted by this
      cloak automatically succeed saving throws against being moved against their will, and are immune to the prone
      condition.</li></ul>
