  description:
    value: >-
      <dl class="n5eb-classmod-summary"><dt>Yang Art Type:</dt><dd>Truth-Seeking</dd><dt>Classification:</dt><dd>Yang
      Art</dd><dt>Casting Time:</dt><dd>1 Action</dd><dt>Range:</dt><dd>60 feet
      line</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>M, W (Truth-Seeking
      Orb)</dd><dt>Cost:</dt><dd>5 Yang Chakra</dd><dt>Keywords:</dt><dd>Bukijutsu, Truth
      -Seeking</dd></dl><h3>Description:</h3><p>You cover yourself with your Truth-Seeking Orb and smash through
      creatures in front of you. Choose one point within 60ft of you. You move at match speed towards that point,
      phasing through all creatures in between without provoking attacks of opportunity.</p><p>All creatures within 5ft
      of the spaces you passed through must make an strength saving throw , taking 14d10 bludgeoning damage, gaining a
      rank of lacerated and dazed on a failed save, half as much damage on a success. Truth-Seeking: You can spend
      additional Truth-Seeking Orbs as part of casting this jutsu.</p><p>For each additional Orb, increase this jutsu's
      damage by +1d10, and for each 2 additional Orbs increase the ranks of lacerated by +1.</p>
