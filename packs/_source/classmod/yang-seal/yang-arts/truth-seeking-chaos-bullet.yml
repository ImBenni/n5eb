system:
  description:
    value: >-
      <dl class="n5eb-classmod-summary"><dt>Yang Art Type:</dt><dd>Truth-Seeking</dd><dt>Classification:</dt><dd>Yang
      Art</dd><dt>Casting Time:</dt><dd>1 Action</dd><dt>Range:</dt><dd>60 feet
      cone</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>M, W (Truth-Seeking
      Orb)</dd><dt>Cost:</dt><dd>6 Yang Chakra</dd><dt>Keywords:</dt><dd>Bukijutsu, Truth
      -Seeking</dd></dl><h3>Description:</h3><p>You move your Truth -Seeking Orbs in front of you, as they morph into
      dozens of droplets of blueish-white energy. Afterwards, these droplets move at hypersonic speed towards your
      target. All creatures in a 60ft cone in front of you must make a Dexterity saving throw. This saving throw cannot
      be made at advantage.</p><p>A creature takes 15d8 force damage and becomes confused on a failed save, and takes
      half as much damage on a success. Also on a failed save, the next time a creature confused by this art would cast
      a jutsu or art, you can redirect the jutsu or art to affect another creature within range. Truth-Seeking: You can
      spend additional Truth-Seeking Orbs as part of casting this jutsu.</p><p>For each additional Orb, increase this
      jutsu's damage by +1d8 and the cone size by 5ft.</p>
