    value: >-
      <dl class="n5eb-classmod-summary"><dt>Yang Art Type:</dt><dd>Truth-Seeking</dd><dt>Classification:</dt><dd>Yang
      Art</dd><dt>Casting Time:</dt><dd>1 Action</dd><dt>Range:</dt><dd>30
      feet</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>M, W (Truth-Seeking
      Orb)</dd><dt>Cost:</dt><dd>5 Yang Chakra</dd><dt>Keywords:</dt><dd>Bukijutsu, Truth
      -Seeking</dd></dl><h3>Description:</h3><p>You combine various Truth -Seeking Orbs into a single one, before
      kicking it towards a target. Make a ranged Yang attack against a creature within range, dealing 18d12 bludgeoning
      damage on a hit. This attack scores a critical hit on a roll of 19 -20, and on a critical hit ignores damage
      reduction, resistance and immunity. Truth-Seeking: You can spend additional Truth-Seeking Orbs as part of casting
      this jutsu.</p><p>For each additional Orb, increase this jutsu's damage by +1d12, for each 2 additional Orbs,
      increase the critical threat range by +1, to a maximum of 15 -20.</p>
