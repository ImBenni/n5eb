system:
  description:
    value: >-
      <dl class="n5eb-classmod-summary"><dt>Yang Art Type:</dt><dd>Truth-Seeking</dd><dt>Classification:</dt><dd>Yang
      Art</dd><dt>Casting Time:</dt><dd>1 Action</dd><dt>Range:</dt><dd>60 feet (10 feet radius
      sphere)</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>M, W (Truth-Seeking
      Orb)</dd><dt>Cost:</dt><dd>5 Yang Chakra</dd><dt>Keywords:</dt><dd>Bukijutsu, Truth
      -Seeking</dd></dl><h3>Description:</h3><p>You throw a Truth -Seeking Orb forward, where it floats in place before
      exploding on a blinding light. Choose one point you can see within range, the Truth-Seeking Orb moves to that
      point before exploding. All creatures in a 10ft radius centered on the Orb must make a wisdom saving throw, taking
      17d8 force damage and becoming blinded for 1 minute on a faile d save.</p><p>A creature that fails its saving
      throw by 5 or more takes this art's maximum damage and becomes permanently blinded. This blindness cannot be
      healed by jutsu of A-rank or less. Truth-Seeking: You can spend additional Truth-Seeking Orbs as part of casting
      this jutsu. For each additional Orb you spend, increase the art's damage by +1d8. If you spend 3 or more
      additional Orbs, affected creatures become dazed on a fail.</p><p>If you use 6 or more additional Orbs, the target
      becomes stunned on a failed save.</p>
