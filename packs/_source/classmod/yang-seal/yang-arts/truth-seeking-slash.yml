system:
  description:
    value: >-
      <dl class="n5eb-classmod-summary"><dt>Yang Art Type:</dt><dd>Truth-Seeking</dd><dt>Classification:</dt><dd>Yang
      Art</dd><dt>Casting Time:</dt><dd>1
      Action</dd><dt>Range:</dt><dd>Special</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>M, W (Yang
      Weapon)</dd><dt>Cost:</dt><dd>6 Yang Chakra</dd><dt>Keywords:</dt><dd>Bukijutsu, Truth -Seeking,
      Clash</dd></dl><h3>Description:</h3><p>Using the power of your Truth -Seeking Orbs, you expand the size and power
      of your weapon before releasing a shockwave of Yang Chakra from its edge. All creatures in a cone originating from
      you must make a dexterity saving throw. The size of this cone is equal to your weapon's reach.</p><p>A creature
      takes 13d10 Slashing damage +1d10 Slashing damage for each Orb part of the Yang Weapon on a failed save, and half
      as much damage on a success. This Slash has the power to cut the world. Structures and construct with less than
      100 hit points are instantly destroyed and do not intercept this art's damage. When this happens, creatures behind
      these structures take maximum damage.</p><p><strong>Truth-Seeking:</strong> You can spend additional Truth-Seeking
      Orbs as part of casting this jutsu. For each additional Orb you spend, increase the damage of this art by +1d10
      and the reach by +5ft.</p>
