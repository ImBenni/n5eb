system:
  description:
    value: >-
      <dl class="n5eb-classmod-summary"><dt>Yang Art Type:</dt><dd>Truth-Seeking</dd><dt>Classification:</dt><dd>Yang
      Art</dd><dt>Casting Time:</dt><dd>1 Action</dd><dt>Range:</dt><dd>10 feet</dd><dt>Duration:</dt><dd>1 minute
      (Concentration)</dd><dt>Components:</dt><dd>M, W (Truth-Seeking Orb)</dd><dt>Cost:</dt><dd>5 Yang
      Chakra</dd><dt>Keywords:</dt><dd>Bukijutsu, Truth -Seeking</dd></dl><h3>Description:</h3><p>Turning a
      Truth-Seeking Orb into a thrusting weapon, you attempt to impale a target and leave it out of the fight. Make a
      Melee Yang Attack against a creature within range, dealing 18d8 piercing damage and forcing it to make a strength
      saving throw, having the Truth -Seeking Orb impaled on a failed save. A creature who is impaled this way becomes
      unable to Mold Chakra, and has its speed halved for the duration.</p><p>A creature can spend a full turn action to
      repeat their saving throw, ending this art on a success. While a creature is impaled by this art, you know the
      creature's exact location, and cannot recover the Truth-Seeking Orbs spend on this art until the art ends.
      Truth-Seeking: You can spend additional Truth-Seeking Orbs as part of casting this jutsu.</p><p>For each
      additional Orb you spend, increase the art's damage by 2d8 piercing damage. If you spend 3 or more additional
      Orbs, the target has its speed reduced to 0 for the duration. If you spend 6 or more additional Orbs, you make
      this attack at advantage, and the target makes its save at disadvantage.</p>
