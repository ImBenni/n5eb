  description:
    value: >-
      <dl class="n5eb-classmod-summary"><dt>Yang Art Type:</dt><dd>Yang Ninjutsu</dd><dt>Classification:</dt><dd>Yang
      Art</dd><dt>Casting Time:</dt><dd>Reaction, when you or another creature within range would take
      damage</dd><dt>Range:</dt><dd>30ft</dd><dt>Duration:</dt><dd>1 Round</dd><dt>Components:</dt><dd>CM,
      HS</dd><dt>Cost:</dt><dd>5 Yang Chakra</dd><dt>Keywords:</dt><dd>Ninjutsu, Yang
      Release</dd></dl><h3>Description:</h3><p>You make handsigns, before you form colossal chakra hands, that stop
      whatever attacks is coming towards you. When you cast this art, hostile creatures inside this art's range are
      harmlessly pushed to the closest free space outside its range. And until this art ends, creatures other than your
      allies cannot enter this range.</p><p>You gain +5 AC and all allied creatures other than yourself within range
      gain total cover from against damage and hostile effects originating outside of this art's range. This art last
      until the start of your next turn, or until you are reduced to 0 hit points, whichever happens first. Yang Power:
      Allied creatures, other than yourself, within 30ft of you can spend their reaction to enhance this art.</p><p>Each
      creature that spends its reaction this way grants you 10 DR against the triggering damage, and half as much DR
      against all other damage until the s tart of your next turn.</p>
