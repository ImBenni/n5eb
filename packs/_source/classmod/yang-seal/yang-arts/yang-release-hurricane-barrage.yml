  description:
    value: >-
      <dl class="n5eb-classmod-summary"><dt>Yang Art Type:</dt><dd>Yang Ninjutsu</dd><dt>Classification:</dt><dd>Yang
      Art</dd><dt>Casting Time:</dt><dd>1
      Action</dd><dt>Range:</dt><dd>60ft</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>6
      Yang Chakra</dd><dt>Keywords:</dt><dd>Ninjutsu, Yang Release, Clash</dd></dl><h3>Description:</h3><p>You put your
      hands together, as you collect Yang release chakra in between them, to create an spherical barrier. When you cast
      this art, you can launch this sphere towards one creature within range, make a ranged Yang attack, dealing 21d10
      force damage on a hit, and forcing the target to make a strength saving throw, on a failed save, it becomes dazed,
      is knocked pro ne, and thrown 30ft away from you.</p><p><strong>Yang Power:</strong> Allied creatures, other than
      yourself, within 30ft of you can spend their reaction to enhance this art. For each creature that spends its
      reaction this way, increase this art damage by +3d10 and the knockback by 30ft.</p><p>In addition, if you have
      access to any nature release, when you can this art, you can choose one nature release that you have, changing
      this attack's damage type and granting it additional effects: Earth Release: The barrier takes a dark color, as it
      starts to absorb its surroundings like a black hole. The damage type of this attack becomes earth.</p><p>Creatures
      within 30ft of the target, other than yourself, must make a strength saving throw, on a failed save, a creatu re
      takes half as much damage as the original target, and is pulled towards the original target until it reaches the
      free space nearest to it. Fire Release: The chakra barrier spins and becomes so compressed that superheated Yang
      chakra starts emanating from it.</p><p>The attack's damage type changes to fire, its critical threat range
      increases by +1, and on a critical hit the target gains 5 ranks of burned. Lightning Release: The barrier is
      filled with lightning release chakra, which turns its inner side into a storm. The attack's damage type changes to
      lightning, and on a failed save the target is statically charged.</p><p>Until the start of your next turn, each
      time the target woul d take damage, it takes an additional 2d10 lightning damage. Water Release: The barrier takes
      a lighter color, as it is filled with water release chakra resembling an ocean, which explodes on impact. The
      damage type of the attack becomes cold, and the target as disadvantage on its strength saving throw.</p><p>On a
      failed save, the range the target is pushed is doubled, and it becomes stunned, instead of dazed. Wind Release:
      You fill the barrier with multiple smaller chakra spheres, which disperse on the affected area. This attack's
      damage type changes to wind and it deals half as much damage on a miss.</p><p>Creatures, other than yourself,
      within 5ft of the target must make a dexterity saving throw, taking half as much damage on a failed save.</p>
