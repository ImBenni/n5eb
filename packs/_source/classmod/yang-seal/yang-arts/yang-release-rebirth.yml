    value: >-
      <dl class="n5eb-classmod-summary"><dt>Yang Art Type:</dt><dd>Yang Ninjutsu</dd><dt>Classification:</dt><dd>Yang
      Art</dd><dt>Casting Time:</dt><dd>1
      Action</dd><dt>Range:</dt><dd>Touch</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>7
      Yang Chakra</dd><dt>Keywords:</dt><dd>Ninjutsu, Yang Release, Medical</dd></dl><h3>Description:</h3><p>You course
      Yang release chakra through a corpse, attempting to bring it back to life. If a creature within range has been
      dead no longer than 10 minutes, you can make an Intelligence or Charisma ability check at advantage vs DC 15. The
      target returns to life with 1 Hit Point. Missing body parts are returned. Internal organs are healed and
      regenerated.</p><p>This Art neutralizes any poisons, cures all normal and unnatural diseases affecting the
      creature when it died. This Art neutralizes al l special poisons, seals, and curses and the like. This Art does
      not remove ranks of exhaustion a creature has accumulated prior to death. Yang Power: Allied creatures, other than
      yourself, within 30ft of you can spend their reaction to enhance this art.</p><p>Each creature that spends its
      reaction this way grants you a +1 bonus to the Ability Check.</p>
