      creature. One creature within range recovers 18d8 lost hit points, ends one condition on itself, other than
      exhaustion, and loses all failed death saving throws. Alternatively, an affected creature loses one rank of
      exhaustion and all failed death saving throws it h as.</p><p><strong>Yang Power:</strong> Allied creatures, other
      than yourself, within 30ft of you can spend their reaction to enhance this art. Each creature that spends its
      reaction this way increases the healing by 3d8.</p>
