      Yang Chakra</dd><dt>Keywords:</dt><dd>Ninjutsu, Yang Release, Fuinjutsu</dd></dl><h3>Description:</h3><p>All
      creatures of your choice within range are marked with the Seal of Courage, making them fight for what's right.
      Affected creatures gain immunity to the dazed, charmed and demoralized conditions, and gain damage reduction equal
      to your proficiency bonus. Yang Power: Allied creatures, other than yourself, within 30ft of you can spend their
      reaction to enhance this art.</p><p>Each creature that spends its reaction this way increases the damage reduction
      by +2.</p>
