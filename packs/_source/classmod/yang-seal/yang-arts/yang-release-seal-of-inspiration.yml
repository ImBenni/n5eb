      Yang Chakra</dd><dt>Keywords:</dt><dd>Ninjutsu, Yang Release, Fuinjutsu</dd></dl><h3>Description:</h3><p>All
      creatures of your choice within range are marked with the Seal of Inspiration, making you harder to take down in
      battle. For the duration, all affected creatures gain a +1d4 bonus to saving throws, and skill checks. Yang Power:
      Allied creatures, other than yourself, within 30ft of you can spend their reaction to enhance this art.</p><p>Each
      creature that spends its reaction this way increases the bonus die size by 1 step (d4&gt;d6&gt;d8&gt;d10&gt;d12).
      TRUTH BUKIJUTSU</p>
