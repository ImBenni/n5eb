name: Yang Seal
type: classmod
_id: 6b361e4097c21319
img: systems/n5eb/assets/content/classmod-icons/yang-seal/six-paths-chakra-rebirth.webp
system:
  description:
    value: >-
      <p>When you gain this class mod, the power of the original Yang release is sealed within you. This power is
      represented by a light -coloured, sun-like seal that appears on the back of your right hand. As a Bonus action,
      you activate your Yang Seal, releasing a bright light where your Seal is. Activating your Yang Seal while a
      powerful ability it actively drains your Chakra.</p><p>Each time you activate your Yang Seal, you spend 2 Chakra
      Die and reduce your Ma ximum Chakra Die by 2. If you do not have enough Chakra Die to activate your Yang Seal, you
      simply cannot activate it. Your Yang Seal can remain active for no longer than 1 minute per activation. Your
      maximum Hit die pool is restored when you complete a Fu ll-Rest. While your Yang Seal is active, you gain the
      following:</p><ul><li>+2 Bonus to AC, Saving Throws, ability checks and skill checks.</li><li>Your speed increases
      by 10ft.</li><li>You gain access to your Yang Chakra and become able to cast Yang Arts.</li><li>You gain access to
      your Truth-Seeking Orbs.</li></ul><p>Also, at 1st level of this class mod, your Yang Seal has begun to alter your
      chakra network, generating Yang Chakra, the manifestation of combining your chakra, with the power of Nature
      chakra coursing through the Seal. You begin with a pool of 20 Yang Cha kra that you gain access to while your Yang
      seal is active, as a result of the Yang Power class mod feature.</p><p>Your Maximum Yang Chakra increases as you
      form new bonds, each bond increasing your Yang Chakra Maximum by +10. Spent Yang Chakra recovers when you spend
      Chakra Die to regain normal chakra. You regain Yang Chakra equal to twice the result of normal chakra regained.
      You recover all Light Chakra on a Full -Rest.</p><p>When your Yang Seal is active, you cannot spend Normal Chakra
      and must spend Yang chakra Yan g Chakra its place. When your Yang Seal is active, you cannot spend Normal Chakra
      and must spend Yang Chakra Yang Chakra its place. Jutsu you cast that that use Yang Chakra have the following
      modifiers applied to them;</p><ul><li>Ninjutsu, Genjutsu, Taijutsu and Bukijutsu you cast using Yang Chakra that
      another creature attempts to end or dispel, forced that creature to attempt their ability check, with a -2
      penalty.</li><li>Ninjutsu, Genjutsu, Taijutsu and Bukijutsu you cast using Yang Chakra now cost an amount equal to
      their rank, regardless of circumstance.</li><li><strong>D-Rank:</strong> 3 Yang
      Chakra,</li><li><strong>C-Rank:</strong> 7 Yang Chakra,</li><li><strong>B-Rank:</strong> 11 Yang
      Chakra,</li><li><strong>A-Rank:</strong> 15 Yang Chakra,</li><li><strong>S-Rank:</strong> 20 Yang
      Chakra.</li><li>Jutsu you cast with Yang Chakra, with the combination keyword, have a +5 Yang Chakra cost
      increase. While they do split their chakra cost evenly with all non-Yang Chakra users, + 5. This cannot be reduced
      by any effects, outside of this Class Mod. Also at 1st level, you gain access to a highly malleable spheres of
      Nature Chakra, known as Truth-Seeking Orbs. When you activate your Yang Seal, you gain a number of Orbs equal to
      your Class Mod level +1. Spend Orbs return to you and can be used again at the start of each of your turns. You
      can use the Orbs to do the following Truth-Seeking Action:</li><li><strong>Yang Assault:</strong> As an action,
      you can turn your orbs into a series of black spikes that are launched towards a target. Make one ranged Yang
      attack for each spend orb against a creature within 60ft of you. These attacks can be directed against the same
      creature or different creatures. On a hit, a target takes 3d10 force damage.</li><li><strong>Yang Weapon:</strong>
      As a Bonus action, you can combine the Orbs into a Yang Weapon. This weapon has the statistics of one simple,
      martial or exotic melee weapon of your choice, it has a bonus to weapon attack and damage rolls equal to half the
      amount of Orbs spend to create it (rounded up), and gains 1 rank of reach for each Orb spend a fter the first. You
      are always proficient with this weapon. The weapon last until your Yang Seal activation ends or until you dismiss
      the weapon as a bonus action. Orbs spend on the weapon are not recovered until you dismiss the
      weapon.</li><li><strong>Yang Barrier:</strong> As a Reaction, you can turn the Orbs into a Black Wall of Chakra.
      You gain damage reduction equal to 10 times the amount of Orbs spend against all damage. Allied creatures within
      10ft of you also benefit from this damage reduction for the duration, or unti l they get further away from you. If
      this would reduce the damage to 0, you also take no other effects. This damage reduction cannot be ignored or
      pierced beyond half.</li><li><strong>Yang Casting:</strong> When you would cast a Ninjutsu, Taijutsu or Bukijutsu,
      you can spend any number of orbs to increases the Jutsu's damage dice by +1, once per casting, and reduce the
      Jutsu's Yang Chakra cost by an amount equal to the amount of Orbs Spend (minimum 1). If the jutsu is a combination
      jutsu, you can spend a orb to let a creature within 30 feet of you take part in the casting, without making a
      skill check, regardless of what nature release it has.</li></ul>
    chat: ''
