system:
  description:
    value: >-
      <p><strong>Category:</strong> Class Mod Prerequisite: Level 10+, 2 Subsumed Wills or spend 25 Downtime Your Yin
      seal grows in strength, as it is charged by the power of your victories. This makes you recognized as an, Adept
      Yin. You gain the following benefits:</p><ul><li>Once per Full-Rest, you can spend a Full -Turn Action to enter
      Adept Yin. When you do, your seal glows with a dark light. You can remain in this state for no more than 10
      minutes.</li><li>While in Adept Yin you gain 5 Yin Charges and your Adept Yin benefits. You can spend these
      charges to cast a Yin Art.</li><li>You gain 1 additional Yin Art</li><li>You gain a Yin Ability of your
      choice.</li></ul>
