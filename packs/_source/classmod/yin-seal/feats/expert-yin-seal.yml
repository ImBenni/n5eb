system:
  description:
    value: >-
      <p><strong>Category:</strong> Class Mod Prerequisite: Level 13+, 4 Bond or spend 25 Downtime Your Yin seal has
      become more powerful, as it gains more power from your vanquished foes. This power is so great that your killing
      intent becomes visible, and you reach the rank of Expert Yin. You gain the following benefits:</p><ul><li>Once per
      Full-Rest, you can spend a Full -Turn Action to enter Expert Yin. When you do, your body your whole body is
      covered by a dark aura. You can remain in this state for no more than 10 minutes.</li><li>While in Expert Yin you
      gain 7 Yin Charges and your Expert Yin benefits. You can spend these charges to cast a Yin Art.</li><li>You gain 1
      additional Yin Art</li><li>You gain an additional Yin Ability.</li><li>Hostile creatures within 30ft of you lose a
      Tenacity die whenever they take an action or elite action. Creatures with no Tenacity die left gain a -2 penalty
      on saving throws and skill checks against your Yin Arts.</li></ul>
