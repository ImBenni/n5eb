system:
  description:
    value: >-
      <p><strong>Category:</strong> Class Mod Prerequisite: Level 8+, granted Yin seal. You have been marked by the
      power of Yin release, giving you the will of a Conqueror. This mark has yet to grow in strength to its full
      potential, making some experts call it an Imperfect binding. You gain the following benefits:</p><ul><li>Once per
      Full-Rest, you can spend a Full -Turn Action to activate Imperfect Yin. When you do, your Yin seal starts to emit
      a faint, purple light, granting you this variants bonuses. You can remain in this state for no more than 10
      minutes.</li><li>While in Imperfect Yin you gain 3 Yin Charges and the Imperfect benefits of having your Yin Seal
      active. You can spend these charges to cast a Yin Art.</li><li>You gain 2 Yin Arts of your choice.</li><li>You
      enter a Moon Phase as part of activating this Seal, without spending Yin Charges . Whenever you activate any Yin
      Seal variant, you can enter the same Moon Phase or another one.</li></ul>
