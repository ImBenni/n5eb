system:
  description:
    value: >-
      <p><strong>Category:</strong> Class Mod Prerequisite: Level 15+, 6 Bonds or spend 25 Downtime. Your Yin seal has
      totally bonded with your body granting you the peak of its power and a new stage called, Superior Yin. You gain
      the following benefits:</p><ul><li>Once per Full-Rest, you can spend a Full -Turn Action to enter Superior Yin.
      When you do, your body turns into a pitch black color, as it becomes shrouded by a shadowy aura, except for your
      glowing eyes, that pierce through the dark. You can remain in this state for no more than 10
      minutes.</li><li>While in Superior Yin you gain 9 Yin Charges. You can spend these charges to cast Yin Arts or
      activate Sage Cloaks</li><li>You gain 1 additional Yin Art</li><li>Once per turn, you can use a Yin Ability as a
      free action, ignoring its listed casting time.</li></ul>
