system:
  description:
    value: >-
      <p>You have been burdened with this power, which will lash out indiscriminately even at your allies at every
      opportunity. When you cast a Yin Art targeting a hostile creature, while you have a conscious ally within 30ft,
      make a constitution ability check, with the DC being 5 + the number of Wills that you have Subsumed. On a failure,
      the Seal takes control of you, and redirect the art to also affect an ally.</p><p>Starting at 3rd level, you have
      a hard time coordinating with your allies while locking into a target. While your Yin Seal is active, you cannot
      benefit from bonuses to damage, AC, Saving Throws, Attack Rolls, Skills checks, and ability checks granted by o
      ther creatures. Finally at 5th level, your power cannot be used with others in tow.</p><p>You cannot benefit from
      an Active Yin Seal while an allied creature is within 30 feet of you. The Seal remains active, but you cannot
      benefit from this class mod's features, other than this one, or cast Yin Arts until all allies leave this
      range.</p>
