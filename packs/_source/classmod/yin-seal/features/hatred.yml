system:
  description:
    value: >-
      <p>Starting at 3rd level, you become accustomed to have Yin release chakra coursing through you, creating an aura
      of killing intent around you, that unnerves enemies that try to fight against you. Your Yin Seal can remain active
      for up 10 minutes.</p><p>In addition, while your Yin Seal is active, hostile creatures are put on edge and make
      more hastily decision, they lose one tenacity die each time they would take an action or elite action. Hostile
      creatures that have no tenacity dice instead reducing thei r saving throws and skill checks by -2 while they can
      sense (see, hear, smell, or feel) you.</p>
