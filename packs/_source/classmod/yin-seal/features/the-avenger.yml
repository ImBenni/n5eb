system:
  description:
    value: >-
      <p>You start to understand the meaning of the Yin, that is, to take everyone's Hatred and stand tall as the last
      man. Starting at 3rd level, you have no allied creature within 30ft of you at the start of your turn, you regain 1
      spend Yin charge. At 5th level, accepting this philosophy let you master you Yin Release Chakra. Your Yin Seal can
      remain active for 1 hour.</p><p>Also at 5th level, you become stronger the more lonesome you are. When an allied
      creature would be reduced to 0 hit points, or you reduce a hostile creature to 0 hit points, you gain 1 Yin
      Charge. YIN ARTS</p>
