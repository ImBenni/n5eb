system:
  description:
    value: >-
      <p>Also, at 1st level of this class mod, your Seal grants you special techniques, known as Yin Arts. Yin Arts are
      extremely powerful abilities that do not spend the user's upfront chakra, instead they spend the stored chakra in
      the user's Yin Seal, represented by Yin Charges. You begin with 2 Yin Charges as shown in the Yin Charges column
      in the Yin Seal class mod table, per Full -Rest.</p><p>Your Yin Charge maximum increases by +2 each time you
      Subsume a creature. When you take a short rest, you regain spend Charges equal to your Yin Seal Class mod level.
      When you take a long rest, you regain spend charges equal to half your current level's maximum charges. Finally,
      you gain 2 Yin Arts of your choice, from the listed Yin arts at the end of this class mod.</p><p>Each level
      afterwards, you gain one additional Yin Art. Yin arts are abilities that function similar to a jutsu when used
      with a casting time, effect and du ration. Yin Arts that require concentration don't spend Yin Charges to maintain
      concentration. Regardless these all use your Yang attack bonus or save DC. To calculate your Yang Art, Save DC and
      Attack bonus, do the following;</p><p>Yin Save DC = 10 + half your character Level + your Proficiency bonus; Yin
      Attack Bonus = Half your character Level + your Yang Seal class mod level + Your Proficiency bonus;</p>
    chat: ''
  source:
    custom: Class Mod Compendium
    book: Naruto 5e
    page: '119'
    license: ''
    rules: n5eb
  uses:
    max: 2 + 4 * (@classmods.yin-seal.levels - 1)
    recovery:
