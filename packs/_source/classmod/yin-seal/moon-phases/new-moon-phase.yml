system:
  description:
    value: >-
      <p>You enter a defensive stance, prioritizing your own defense and Taijutsu moves.</p><ul><li>Increase the dice of
      damage, healing, temporary hit points, and damage reduction of Taijutsu you cast by your class mod level, twice
      per turn.</li><li>When you cast a Taijutsu, you gain Damage Reduction equal to the jutsu's rank, against all
      damage, until the start of your next turn (D=1, C=2, B=3, A=4, S=5, Yin=6). This Damage Reduction stacks for each
      Taijutsu you cast.</li><li>When you cast a Taijutsu, you gain temporary hit points equal to your [unarmed damage]
      times the amount of attacks made by the taijutsu, or the number of creatures affected, whichever is
      higher.</li></ul>
