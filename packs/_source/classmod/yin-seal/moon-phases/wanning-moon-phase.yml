system:
  description:
    value: >-
      <p>You enter an adaptive stance, hiding in the shadows until the moment an enermy overextend itself, before
      assaulting it with Genjutsu.</p><ul><li>Increase the dice of damage, healing, temporary hit points, and damage
      reduction of Genjutsu you cast by your class mod level, twice per turn.</li><li>Hostile creatures under the effect
      of a Genjutsu you cast, make attack rolls and saving throws at disadvantage.</li><li>Ability checks and Skill
      checks made against you or contested by you, gain a penalty equal to your Yin Seal Class Mod level.</li></ul>
