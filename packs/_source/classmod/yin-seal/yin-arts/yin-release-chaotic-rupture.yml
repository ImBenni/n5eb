      <dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Yin Art</dd><dt>Casting Time:</dt><dd>1
      Action</dd><dt>Range:</dt><dd>120 feet line</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>CM, M, W
      (Melee Slashing)</dd><dt>Cost:</dt><dd>1 Yin Charge</dd><dt>Keywords:</dt><dd>Bukijutsu, Yin Release,
      clash</dd></dl><h3>Description:</h3><p>You release Yin Chakra through your weapon, causing it to manifest a purple
      edge as it becomes extremely heavy, you then smash the ground with this edge, releasing a shockwave. All creatures
      in a 120ft long, 5ft wide line must make a dexterity saving throw, taking 11d10 Bludgeoning damage on a failed
      save, half as much damage on a success.</p><p>Creatures that are prone, dazed, incapacitated or stunned make their
      saving throw at disadv antage and take maximum damage on a failed save.</p>
