    value: >-
      <dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Yin Art</dd><dt>Casting
      Time:</dt><dd>Action</dd><dt>Range:</dt><dd>Self (10 feet Radius Sphere)</dd><dt>Duration:</dt><dd>1 Minute
      (Concentration)</dd><dt>Components:</dt><dd>CM, HS</dd><dt>Cost:</dt><dd>1 Yin
      Charge</dd><dt>Keywords:</dt><dd>Ninjutsu, Yin Release, Fuinjutsu</dd></dl><h3>Description:</h3><p>You begin to
      overwhelm the target with Yin Chakra completely coating them until they vanish from this plane into one where only
      you can see them and they can only see you. Target creature must succeed a Charisma Saving throw to resist being
      pushed onto another layer of reality. This layer allows them to interact and see all non -creatures they could see
      and interact with prior.</p><p>For the duration, they can no longer see, hear, or interact in any way with any
      other creature except you. You can still see them cl early. Creatures other than them cannot see or interact with
      the target creature for the duration.</p>
