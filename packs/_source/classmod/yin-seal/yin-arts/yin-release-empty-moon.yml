  description:
    value: >-
      <dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Yin Art</dd><dt>Casting Time:</dt><dd>1
      Action</dd><dt>Range:</dt><dd>self</dd><dt>Duration:</dt><dd>1 minute
      (Concentration)</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>1 Yin
      Charge</dd><dt>Keywords:</dt><dd>Ninijutsu, Yin Release</dd></dl><h3>Description:</h3><p>You turn your Yin Chakra
      inwards. Causing it to enhance your fighting ability at the cost of your Lifespan. For the duration, you gain the
      following:</p><ul><li>+1d4 bonus to attack rolls</li><li>+2 to your jutsu save DC</li><li>+2 Yin save
      DC</li><li>Yin Arts you cast increase their damage by +1 die for each level you have in this class mod, once per
      casting.</li><li>You lose one Hit Die at the start of each of your turns. If you have no Hit Die at the start of
      your turns, your drop to 0 hit points and make death saving throws at disadvantage until your next long rest. This
      Art's concentration cannot be broken, willingly or unwillingly, by normal means. To end concentration on this art,
      you must spend a bonus action to do so, or be reduced to 0 hit points.</li></ul>
