  description:
    value: >-
      <dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Yin Art</dd><dt>Casting Time:</dt><dd>1
      Action</dd><dt>Range:</dt><dd>5 feet</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>CM,
      M</dd><dt>Cost:</dt><dd>1 Yin Charge</dd><dt>Keywords:</dt><dd>Taijutsu, Yin
      Release</dd></dl><h3>Description:</h3><p>You release Yin Chakra through your body, allowing you to attack at such
      speed that you leave afterglows that resemble clones on your path. Make a Melee Yin Attack against a creature
      within range, dealing 6d6 bludgeoning damage on a hit. This attack cannot be reacted to. Make a second Melee Yin
      Attack against the same target, dealing 8d8 bludgeoning damage on a hit.</p><p>If the target was hit by the
      previous attack, it cannot react to this one. Finally, make a third Melee Yin Attack against the same target,
      dealing 10d10 bludgeoning damage on a hit. A creature hit with both previous attacks cannot react to this one.</p>
