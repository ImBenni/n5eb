      Charge</dd><dt>Keywords:</dt><dd>Genjutsu, Yin Release, Visual, Actile</dd></dl><h3>Description:</h3><p>You
      overwhelm the target with Yin Chakra, forcing it to see your face wherever it looks until it can no longer think
      of anything else. One creature within range must make a wisdom saving throw: Success: The target takes half as
      much damage as a failure . Failure: The target takes 12d10 psychic damage and end concentration on all jutsu it is
      concentrating on.</p><p>You can choose to not deal damage and end concentration on all arts it currently is
      concentrating on. Critical Failure: Same as a failure, but the target also becomes unable to cast jutsu and arts
      that require concentration for the next minute.</p>
