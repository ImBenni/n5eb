system:
  description:
    value: >-
      <dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Yin Art</dd><dt>Casting Time:</dt><dd>1
      Action</dd><dt>Range:</dt><dd>60 feet (20 feet radius)</dd><dt>Duration:</dt><dd>1 Minute
      (Concentration)</dd><dt>Components:</dt><dd>HS, CM</dd><dt>Cost:</dt><dd>1 Yin
      Charge</dd><dt>Keywords:</dt><dd>Ninjutsu, Yin Release</dd></dl><h3>Description:</h3><p>You make handsigns as a
      cloud of Yin Release Chakra is formed on a place within range. This cloud then starts raining black flames that
      cause rot and destroy creatures where they fall. All creatures within 20ft of the chosen space must make a
      constitution saving throw, taking 8d12 Necrotic damage and being knocked prone on a failed save, or taking half as
      much damage on a success.</p><p>Each time a creature starts their turn inside this area, or move into this area
      for the first time on a turn, it repeats this saving throw, taking 8d12 Necrotic damage and being knocked prone on
      a failed save, half as much damage on a success.</p>
