    value: >-
      <dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Yin Art</dd><dt>Casting Time:</dt><dd>Reaction, when
      taking damage</dd><dt>Range:</dt><dd>Self</dd><dt>Duration:</dt><dd>1
      Round</dd><dt>Components:</dt><dd>M</dd><dt>Cost:</dt><dd>1 Yin Charge</dd><dt>Keywords:</dt><dd>Taijutsu, Yin
      Release</dd></dl><h3>Description:</h3><p>You quickly asses your situation, analyzing the coordinates and movements
      of your enemies before using Yin release chakra to enhance your movement and make a counterattack that will keep
      them at bay. Until the start of your next turn, you gain a +5 bonus to AC, as well as to Strength, Dexterity and
      Constitution saving throws and skill checks, until the start of your next turn.</p><p>If you would succeed the
      triggering saving saving throw or cause the trigger ing attack to miss, you take no damage or effects, and you can
      cast 1 Yin Art, with a casting time of an action, as part of the same action, ignoring its listed casting
      time.</p>
