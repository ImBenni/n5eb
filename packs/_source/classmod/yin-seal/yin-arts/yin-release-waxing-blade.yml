system:
  description:
    value: >-
      <dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Yin Art</dd><dt>Casting Time:</dt><dd>1
      Action</dd><dt>Range:</dt><dd>5 feet</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>CM, M, W (Melee
      Slashing)</dd><dt>Cost:</dt><dd>1 Yin Charge</dd><dt>Keywords:</dt><dd>Bukijutsu, Yin
      Release</dd></dl><h3>Description:</h3><p>You release Yin Chakra through your weapon, causing it to grow a glowing
      black edge, before striking at your opponent with a lightning -fast attack. Make a melee Yin attack against a
      creature within range, dealing 15d10 Slashing damage on a hit. Also, on a hit the target must make a constitution
      saving throw, gaining 3d4 ranks of lacerated on a failure.</p><p>YIN SEAL – EXTRAS The following are a list of
      Feats designed with a lower power-level in mind. These feats are a part of the overall Class Mod category of
      feats. These feats are intended to give the user the feel of the Yin Seal without oppressively shifting the
      balance of a normal level 1 -20 play through. Here are the following rules and requirements in regards to even
      gaining these Class Mod feats.</p><ul><li>Each Class Mod feat after the first requires you to subsume a certain
      number of creatures or spend 25 downtime to gain the next feat.</li><li>A character can only access the first feat
      if a monster, sage creature or similar creature implants them a Yin Seal.</li><li>All Yin Arts, and Yin Abilities
      you gain from a Class Mod feat can be used in any Yin Seal variant you have access to. (Imperfect, Adept,
      etc.)</li><li>All Yin Seal variants have a unique set of bonuses and effects, which can be found on the Yin Seal
      Variants table at the end of these feats.</li><li>You can exit any Yin Seal variant as a Bonus
      action.</li><li>Regardless of the Yin Seal variant you access, they all share the same Full -Rest recharge
      limitation.</li><li>Yin Charges are a special resource intended to allow you to cast Yin Arts.</li><li>Each Yin
      Seal variant has its own Yin Charge pool and limitations on what you can spend your charges on.</li><li>If a Yin
      Art requires concentration, you do not need to spend Chakra or Yin Charges to maintain concentration.</li><li>Yin
      Arts cast with these Yin Charges rolls half their dice values for damage, healing and damage
      reduction.</li><li>The bonus to damage, healing and damage reduction granted by Moon Phases is determined by your
      current Yin Seal variant.</li></ul>
