name: Yin Seal
type: classmod
_id: 3e90c49d770454a9
img: systems/n5eb/assets/content/classmod-icons/yin-seal/infinite-tsukuyomi.webp
system:
  description:
    value: >-
      <p>When you gain this class mod, the power of the original Yin release is sealed within you. This power is
      represented by a dark -coloured, crescent moon -like seal that appears on the back of your left hand. As a Bonus
      action, you activate your Yin Seal, releasing a bright light where your Seal is. Activating your Yin Seal while a
      powerful ability it actively drains your Chakra.</p><p>Each time you activate your Yin Seal, you spend 2 Chakra
      Die and reduce your Maxim um Chakra Die by 2. If you do not have enough Chakra Die to activate your Yin Seal, you
      simply cannot activate it. Your Yin Seal can remain active for no longer than 1 minute per activation. Your
      maximum Hit die pool is restored when you complete a Full-Rest. While your Yang Seal is active, you gain the
      following:</p><ul><li>+2 Bonus to AC, Saving Throws, ability checks, and skill checks.</li><li>Your Speed
      increases by 10ft.</li><li>You gain access to your Yin Charges and become able to cast Yin Arts.</li><li>You enter
      a Moon Phase of your choice.</li></ul><p>Also, at 1st level of this class mod, your Seal grants you special
      techniques, known as Yin Arts. Yin Arts are extremely powerful abilities that do not spend the user's upfront
      chakra, instead they spend the stored chakra in the user's Yin Seal, represented by Yin Charges. You begin with 2
      Yin Charges as shown in the Yin Charges column in the Yin Seal class mod table, per Full -Rest.</p><p>Your Yin
      Charge maximum increases by +2 each time you Subsume a creature. When you take a short rest, you regain spend
      Charges equal to your Yin Seal Class mod level. When you take a long rest, you regain spend charges equal to half
      your current level's maximum charges. Finally, you gain 2 Yin Arts of your choice, from the listed Yin arts at the
      end of this class mod.</p><p>Each level afterwards, you gain one additional Yin Art. Yin arts are abilities that
      function similar to a jutsu when used with a casting time, effect and du ration. Yin Arts that require
      concentration don't spend Yin Charges to maintain concentration. Regardless these all use your Yang attack bonus
      or save DC. To calculate your Yang Art, Save DC and Attack bonus, do the following;</p><p>Yin Save DC = 10 + half
      your character Level + your Proficiency bonus; Yin Attack Bonus = Half your character Level + your Yang Seal class
      mod level + Your Proficiency bonus; You have been burdened with this power, which will lash out indiscriminately
      even at your allies at every opportunity.</p><p>When you cast a Yin Art targeting a hostile creature, while you
      have a conscious ally within 30ft, make a constitution ability check, with the DC being 5 + the number of Wills
      that you have Subsumed. On a failure, the Seal takes control of you, and redirect the art to also affect an ally.
      Starting at 3rd level, you have a hard time coordinating with your allies while locking into a target.</p><p>While
      your Yin Seal is active, you cannot benefit from bonuses to damage, AC, Saving Throws, Attack Rolls, Skills
      checks, and ability checks granted by o ther creatures. Finally at 5th level, your power cannot be used with
      others in tow. You cannot benefit from an Active Yin Seal while an allied creature is within 30 feet of
      you.</p><p>The Seal remains active, but you cannot benefit from this class mod's features, other than this one, or
      cast Yin Arts until all allies leave this range.</p>
