system:
  description:
    value: >-
      <h3>THINGS TECHNIQUE</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Yin-Yang
      Art</dd><dt>Casting Time:</dt><dd>1 Action</dd><dt>Range:</dt><dd>10
      miles</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>CM,
      HS</dd><dt>Cost:</dt><dd>Special</dd><dt>Keywords:</dt><dd>Ninjutsu, Medical, Yin -Yang
      Release</dd></dl><h3>Description:</h3><p>The ultimate healing technique. By imitating the power used by the Sage
      of Six paths, one can create life where there is nothing, or restore to life that which cannot be healed. Choose
      any number of creatures that have died in the last 24 hours. These creatures are restored to live, recovering any
      missing limps, ending all conditions, healing all poisons and diseases, and having their full hit points
      restored.</p><p>This can even bring back to life creature that had their soul destroyed or that had their bodies
      completely disintegrated. After casting this Art, both casters spend all their Yang Chakra and Yin Charges, and
      once their Seal Release ends, they cannot use these Class Mods ever again.</p>
