system:
  description:
    value: >-
      <h3>GUARDIAN OF THE LAND</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Yin-Yang
      Art</dd><dt>Casting Time:</dt><dd>1 Action</dd><dt>Range:</dt><dd>Self</dd><dt>Duration:</dt><dd>1
      minute</dd><dt>Components:</dt><dd>CM, HS, CS</dd><dt>Cost:</dt><dd>10 Yang Chakra, 1 Yin
      Charge</dd><dt>Keywords:</dt><dd>Ninjutsu, Yin-Yang Release, Fuinjutsu,
      Construct</dd></dl><h3>Description:</h3><p><strong>An enhanced version of Yang Release:</strong> Guardian of the
      Land , The Yang release wielders summons a luminous Pseudo -Tailed Beast made of Yang Chakra, which is then
      covered in dark and twisted Yin Chakra. The perfect union of the Savior and the Avenger turning this being into
      the ultimate warrior. The Majestic Attire has the same statistics as a Guardian of the Land , but it loses its
      Yang of Many trait.</p><p>At the start of each of their turns, the Yang Seal wielder must spend 10 Yang Chakra to
      maintain concentration, while the Yin Seal wielder must spend 1 Yin Charge at the start of each of its turns.
      Finally, the Guardian of the Land gains the following: Yin-Yang of Two. The Guardian of the Land takes the Turns
      of both casters, using their actions, bonus actions, and reactions. Perfectly Balanced.</p><p>The Guardian of the
      Land is threated as having 6 people inside of it, for the purpose of Calculating Hit Points, Speed, AC, Attacks,
      and damage rolls. Majestic Drive. The Guardian of the Land can use the Yin Abilities of its caster, spending its
      Yin Charges. once per round, you can use one Yin Ability, as a free action.</p><p>Majestic Blades When you deal
      Slashing damage with your Guardian Fist Attacks, you ignore resistance, Immunity, and Damage Reduction. Creatures
      that take damage from your Guardian Fist cannot regain hit points until the start of your next turn.</p>
