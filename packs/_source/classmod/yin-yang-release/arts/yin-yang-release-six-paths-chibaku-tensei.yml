system:
  description:
    value: >-
      <dl class="n5eb-classmod-summary"><dt>TENSEI Classification:</dt><dd>Yin-Yang Art</dd><dt>Casting Time:</dt><dd>1
      Action</dd><dt>Range:</dt><dd>Touch</dd><dt>Duration:</dt><dd>Until Dispelled</dd><dt>Components:</dt><dd>CM, HS,
      CS</dd><dt>Cost:</dt><dd>10 Yang Chakra, 1 Yin Charge</dd><dt>Keywords:</dt><dd>Ninjutsu, Yin-Yang Release,
      Fuinjutsu</dd></dl><h3>Description:</h3><p>The final sealing technique. Both casters must be able to touch the
      target, or this art fails. By placing their palms on the target, it is then made into a center of attraction,
      causing the surrounding earth to be forcefully pulled onto their body and fo rmed into a sealing stone the size of
      a moon.</p><p>Each caster makes a Melee Yin -Yang Attack against the target, on a hit, it must make a charisma
      saving throw, rolling 2d20, taking the lowest result. The creature cannot benefit from advantage or disadvantage
      against this saving throw. On a failed save, a creature becomes permanently restrained, incapacitated and loses
      all its chakra. This art ignores immunity to its conditions.</p><p>Before it starts to float and form a 10 -miles
      radius moon around it. Only one creature can be sealed this way at a time. If any of the caster uses this art
      again, the creature that was previously sealed is released.</p>
