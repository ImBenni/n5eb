system:
  description:
    value: >-
      <p>When you reach the 5th level in this class mod, you master the power of Yang, allowing you to reach your
      friends no matter who they are, even those that seem irredeemable. You must know at least one Yin Seal user, with
      whom you have bonded, to gain this fe ature.</p><p>The Yin user becomes your Soulmate, you always know when your
      Soulmate activates its Yin Seal Release, and can sense its general direction while it is active. In addition, your
      Soulmate can benefit from your Yang Cloak and The Savior features, even outside their normal range, as long as you
      are in the same plane.</p>
