system:
  description:
    value: >-
      <p>When you reach the 5th level in this class mod, you master the power of Yin, allowing you to understand that
      unrivalled power cannot last, unless iron sharpens iron. You must know at least one Yang Seal user, with whom you
      have bonded, to gain this feature . The Yin user becomes your Soulmate, you always know when your Soulmate
      activates its Yang Seal Release, and can sense its general direction while it is active.</p><p>In addition, you
      can be within 30ft of your Soulmate, and gain any bonuses it grants, without activating your Alone feature, or
      losing the Ying Charge recharge from your The Avenger feature.</p>
