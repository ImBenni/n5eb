system:
  description:
    value: >-
      <p>YIN SEAL) Finally, while both you and your Soulmate are working together, you become able to access the most
      Overwhelming techniques, known as Yin-Yang Arts. Ying-Yang arts are extremely powerful abilities that require the
      presence of both a Yin Seal and a Yang Seal to be cast. You gain 3 Yin-Yang Arts, from the listed Yin -Yang arts
      at the end of this class mod section.</p><p>These all use your Yin -Yang attack bonus or save DC. To calculate
      your Yin -Yang Art, Save DC and Attack bonus, do the following; Yin-Yang Save DC = 6 + the Casters' Yang Seal and
      Yin Seal class mod levels + their Proficiency bonuses; Yin-Yang Attack Bonus = The Casters' Yang Seal and Yin Seal
      class mod levels + their Proficiency bonuses;</p><p>When you cast a Yin -Yang Art, one other creature, who wields
      the Seal opposite to yours, must spend their reaction to take part on the Art's casting. If there is no creature
      with the opposite seal helping with the casting of this art, it fails. Yin -Yang Arts cot both Yang Chakra and Yin
      Charges, each caster must spend their respective resource to cast the art, otherwise it fails.</p><p>Once you
      successfully cast a Yin -Yang Art, you cannot cast it again until you take a full rest. YIN-YANG ARTS</p>
