    img: systems/n5eb/assets/content/classmod-icons/tenseigan/tenseigan.webp
    system:
      description:
        value: |-
          <h2>Ultimate Divine Providence</h2><p><strong>Critical Defense.</strong> Critical hits against
              Providence count as normal hits unless its summoner is already Bloodied.</p><p><strong>Immutable Form.</strong>
              Providence is immune to any Jutsu or effect that would alter its form.</p><p><strong>Too Big to Fail.</strong> It
              uses its summoner’s proficiency bonus plus its Constitution modifier for every saving throw.</p>
