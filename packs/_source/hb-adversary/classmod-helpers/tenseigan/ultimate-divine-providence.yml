items:
  - name: Providence Heads
    type: feat
    _id: eaaa5fb44cdeef2c
    img: systems/n5eb/assets/content/classmod-icons/tenseigan/tenseigan.webp
    system:
      description:
        value: |-
          <h2>One of Many</h2><p>Providence has seven heads and uses them for all of its attacks. For every 50
              Hit Points it loses, one head is destroyed, reducing the attacks or damage it can deal according to its remaining
              heads. Spend one use of this tracker for each destroyed head.</p>
