    _id: 3ba3178983a35055
    img: systems/n5eb/assets/content/classmod-icons/tenseigan/tenseigan.webp
    system:
      description:
        value: |-
          <p>As an action, Providence attempts to restrain a target and eat its Chakra. Make a grapple attempt.
              On a success, the target makes a Constitution saving throw against the summoner’s Celestial Art Save DC. On a
              failure, it loses 6d8 Chakra at the start of each of the summoner’s turns while it remains grappled. Providence
              cannot use one head to attack while grappling a creature.</p>
