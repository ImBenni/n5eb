  details:
    biography:
      value: |-
        <h2>Ultimate Divine Providence</h2><p><strong>Gargantuan Construct.</strong>
          Armor Class 17 + the summoner’s Tenseigan level; Hit Points 350 (26d12 + 180); Speed 0 feet.</p>
          <table><thead><tr><th>STR</th><th>DEX</th><th>CON</th><th>INT</th><th>WIS</th><th>CHA</th></tr></thead><tbody>
          <tr><td>28 (+9)</td><td>24 (+7)</td><td>28 (+9)</td><td>1 (−5)</td><td>10 (+0)</td><td>1 (−5)</td></tr></tbody></table>
          <p><strong>Condition Immunities:</strong> all. <strong>Senses:</strong> Chakra Sight 120 feet, Tremorsense 120 feet,
          passive Perception 30.</p><p>Set this Actor’s CR to the summoner’s Tenseigan class-mod level. This drives the AC and
          Subjugate save formulas. Apply the summoner’s proficiency bonus to all saves as required by Too Big to Fail.</p>
