  description:
    value: >-
      <h3>Dark Art Type: Dark Ninjutsu</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Dark
      Art</dd><dt>Casting Time:</dt><dd>1 Action</dd><dt>Range:</dt><dd>Self (65-foot
      cube)</dd><dt>Duration:</dt><dd>Concentration, up to 1
      minute</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>15 Dark Chakra</dd><dt>Keywords:</dt><dd>Ninjutsu,
      Dark Release, Barrier, Concentration, Area</dd></dl><h3>Description:</h3><p>Create a fixed 65-foot cube that no
      creature can escape for the duration. You know each creature's location, current Hit Points, current Chakra, and
      highest ability score. When one of your damaging Dark Arts damages a creature inside, it makes a Wisdom saving
      throw. On a failed save, its maximum Hit Points are reduced by the damage dealt while it remains in the
      Domain.</p>
