    value: >-
      <h3>Dark Art Type: Dark Taijutsu</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Dark
      Art</dd><dt>Casting Time:</dt><dd>1 Action</dd><dt>Range:</dt><dd>Self (15-foot
      cone)</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>25 Dark
      Chakra</dd><dt>Keywords:</dt><dd>Taijutsu, Dark Release, Force, Necrotic,
      Area</dd></dl><h3>Description:</h3><p>Make one melee Dark Art attack against every creature in a 15-foot cone. On
      a hit, a target takes 5d12 force damage plus 5d12 necrotic damage and spends 1d4 Chakra Dice. You recover Hit
      Points equal to the results of the spent dice. If a target has no Chakra Dice remaining, double the damage dealt
      to it.</p>
