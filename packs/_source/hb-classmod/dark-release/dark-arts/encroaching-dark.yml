    value: >-
      <h3>Dark Art Type: Dark Ninjutsu</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Dark
      Art</dd><dt>Casting Time:</dt><dd>1 Reaction</dd><dt>Range:</dt><dd>Self (40-foot
      sphere)</dd><dt>Duration:</dt><dd>1 round</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>20 Dark
      Chakra</dd><dt>Keywords:</dt><dd>Ninjutsu, Dark Release, Reaction, Area</dd></dl><h3>Description:</h3><p>When you
      take damage, creatures in a 40-foot sphere centered on you make a Constitution saving throw. Divide the triggering
      damage evenly among the creatures that fail. If every creature succeeds, you take the damage normally. The draft's
      prose mentions a 35-foot sphere while its range line says 40 feet; this Activity uses the 40-foot listed range and
      leaves the discrepancy visible for GM adjudication.</p>
