system:
  description:
    value: |2-

        <h2>Dark Release</h2>
        <p>Dark Release embodies power, strength, and authority pursued at any cost. It commonly belongs to antagonists,
        avengers, and characters willing to consume the spirits of people connected to their lives.</p>
        <h3>Unlocking Dark Release</h3>
        <p>Dark Release is obtained through a unique narrative or mechanical event approved by the GM. The draft presents
        multiple example unlock paths; the event itself does not alter the mechanics below.</p>
        <h3>Leveling the Class Mod</h3>
        <p>You must meet the character-level requirement and have consumed the required number of qualifying spirits.</p>
        <table>
          <thead><tr><th>Class-Mod Level</th><th>Minimum Character Level</th><th>Consumed Spirits</th><th>Dark Arts Known</th></tr></thead>
          <tbody>
            <tr><td>1</td><td>4</td><td>—</td><td>2</td></tr>
            <tr><td>2</td><td>—</td><td>2</td><td>3</td></tr>
            <tr><td>3</td><td>12</td><td>4</td><td>4</td></tr>
            <tr><td>4</td><td>—</td><td>6</td><td>5</td></tr>
            <tr><td>5</td><td>—</td><td>10</td><td>6</td></tr>
          </tbody>
        </table>
        <h3>Dark Art Formulas</h3>
        <p><strong>Dark Art Save DC:</strong> 8 + your Dark Release class-mod level + your proficiency bonus.</p>
        <p><strong>Dark Art Attack Bonus:</strong> twice your proficiency bonus + your Dark Release class-mod level.</p>
