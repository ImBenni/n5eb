system:
  description:
    value: >-
      <p>At 4th level, whenever you cast a Dark Art, chosen creatures within 30 feet have their maximum Hit Points
      reduced by half the Dark Chakra spent for 1 minute. You also gain +1 to your next roll for every 5 Dark Chakra
      spent. The maximum-Hit-Point reduction has no stated use limit; the roll bonus can be gained at most twice per
      Long Rest.</p>
