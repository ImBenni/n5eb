system:
  description:
    value: >-
      <p>At 2nd level, you can sense creatures within 120 feet that are at or below 25% of their Hit Point or Chakra
      maximum. As an action, spend 20 Dark Chakra and choose one such creature; it makes a Wisdom saving throw. If its
      Hit Points meet the threshold and it fails, choose Strength, Dexterity, Intelligence, or Wisdom. Reduce that score
      by 1d4 and increase your corresponding score by the same amount for 1 minute.</p><p>Only one score can be affected
      at a time, and a target can be affected at most twice per Long Rest. If its Chakra meets the threshold and it
      fails, steal one known Jutsu, Art, or Feature for 1 minute. The target cannot use it, you can use it without
      prerequisites, and you retain its drawbacks. You can have at most two stolen techniques.</p>
