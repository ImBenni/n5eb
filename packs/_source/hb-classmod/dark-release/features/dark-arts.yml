system:
  description:
    value: >-
      <p>At 1st level, choose two Dark Arts. Choose one additional Dark Art at each class-mod level from 2nd through
      5th. The Dark Art advancement on the Dark Release Item enforces these counts. Your Dark Art Save DC equals 8 +
      your Dark Release level + your proficiency bonus. Your Dark Art Attack Bonus equals twice your proficiency bonus +
      your Dark Release level.</p>
