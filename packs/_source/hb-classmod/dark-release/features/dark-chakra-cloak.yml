system:
  description:
    value: >-
      <p>At 3rd level, while your Dark Seal is active, you can use a bonus action and spend 20 Dark Chakra to form a
      cloak for the rest of the activation. Misguided Dark: every creature within 60 feet increases its Jutsu costs by
      2, while your costs are reduced by 2. Unrealized Despair: creatures within 60 feet regain 0 Hit Points; you gain
      Dark Chakra equal to half the healing prevented.</p>
