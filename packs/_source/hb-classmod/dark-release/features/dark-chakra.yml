system:
  description:
    value: >-
      <p>You can access Dark Chakra only while your Dark Seal is active. Your base maximum is 10 + twice your current
      proficiency bonus + 10 for each Dark Release level after the first, and each consumed spirit increases the maximum
      by another 10. Record spirit-based increases on the owned tracker because Foundry cannot safely infer a narrative
      spirit roster.</p><p>While the Seal is active, you must spend Dark Chakra instead of normal Chakra. Jutsu cast
      with Dark Chakra gain a bonus to attack and damage rolls equal to your proficiency bonus. If a Jutsu has no attack
      roll, its save DC increases by 1 per Dark Release level. If it has neither an attack nor a save, reduce its cost
      by 1 per Dark Release level, to a minimum of 1.</p><p>As an action against a creature within 5 feet, you may spend
      variable Dark Chakra to consume health; on a failed Constitution save, each point makes the target lose 1 Hit
      Point and restores 1 to you, while on a success every 2 points make it lose 2 and restore 1. Spend 5 Dark Chakra
      to attempt to transfer one condition to a creature within 5 feet; it resists with a Constitution save.</p><p>Spend
      10 Dark Chakra to gain advantage on all checks and saves until your next turn; creatures within 5 feet cannot gain
      advantage during that time. The draft does not specify a general recovery rule for spent Dark Chakra, so this
      tracker does not invent one.</p>
