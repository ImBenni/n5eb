system:
  description:
    value: >-
      <p>At 3rd level, use this feature instead of the base Dark Seal use tracker. You can activate your Dark Seal twice
      per Short Rest. When it activates, you may exclude creatures from its life-energy consumption within 120 feet. You
      also sense power levels within 120 feet as lower when at least 2 levels below you, equal when within 1 level, or
      higher when at least 2 levels above you.</p><p>The Seal still lasts no longer than 1 minute and retains its
      10-minute reactivation restriction.</p>
