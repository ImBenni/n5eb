system:
  description:
    value: >-
      <p>A dormant mark appears on your body. As a bonus action, activate it for up to 1 minute. When the Seal
      deactivates, every class-mod effect ends. On activation, every creature other than you within 60 feet makes a
      Constitution saving throw. Choose Hit Points or Chakra for each failed target; that current total is reduced by
      2d6 + your character level.</p><p>If you chose Hit Points, you gain temporary Hit Points equal to the reduction
      for the activation. If you chose Chakra, you gain bonus Dark Chakra equal to the reduction. You can activate the
      Seal twice per Long Rest and cannot reactivate it for 10 minutes after an activation ends. Spirit Consumption: a
      qualifying target must be at 0 Hit Points but not dead.</p><p>You may Sever the Bond of a person important to you
      or someone important to such a person, or Devour a Foe of equal or higher level that is an Elite or Solo
      adversary. Its spirit becomes irretrievable. Each consumed spirit permanently seals one of your Hit Dice and one
      Chakra Die and increases your maximum Dark Chakra by 10.</p><p>Spirit consumption, irretrievable souls, and
      permanent die changes require explicit GM confirmation and must be recorded reversibly.</p>
