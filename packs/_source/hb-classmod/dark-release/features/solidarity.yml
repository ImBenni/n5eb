system:
  description:
    value: >-
      <p>At 5th level while your Dark Chakra Cloak is active, as an action force every creature within 120 feet to make
      a Constitution saving throw. On a failed save, a creature loses Chakra equal to twice your Dark Release
      level.</p><p>If at least one creature fails, regain Dark Chakra equal to twice your Dark Release level, increase
      your Dark Art Save DC by 2, and gain temporary Hit Points equal to twice your Dark Release level for the duration.
      You can use this feature once per Long Rest.</p>
