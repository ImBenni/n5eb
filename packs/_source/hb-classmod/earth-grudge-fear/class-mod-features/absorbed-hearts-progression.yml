system:
  description:
    value: >-
      <p>This lifetime counter records the 60 qualifying hearts required for Earth Grudge Fear advancement. Spending one
      use records one absorbed heart; destroyed hearts do not reduce this lifetime total. Class-mod level 2 requires 10
      absorbed hearts, level 3 requires 20 hearts and character level 12, level 4 requires 40 hearts, and level 5
      requires 60 hearts and character level 16.</p><p>Class-mod level 1 requires character level 4.</p>
