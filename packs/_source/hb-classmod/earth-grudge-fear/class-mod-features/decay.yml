system:
  description:
    value: >-
      <p>Decay measures the deterioration of your absorbed hearts. The tracker shows how much capacity remains before a
      heart must be destroyed: spending uses here incurs Decay. Each full week of downtime incurs 2 Decay for every
      currently absorbed heart. Dying and Threaded Arts can incur additional Decay.</p><p>When the tracker reaches 100,
      choose one absorbed heart to destroy with GM confirmation, reset the tracker, and immediately re-apply any excess
      Decay. Destroying the last heart reversibly disables access to the class mod until another qualifying heart is
      absorbed.</p>
