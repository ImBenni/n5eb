system:
  description:
    value: >-
      <p>At class-mod level 3, your body is accustomed to the threads binding your hearts. Earth Grudge Fear is always
      active without activation, and you cannot die from old age while you have at least one absorbed heart. Use the
      activity to apply the persistent class-mod state. Old-age immunity and loss of access when no heart remains are
      recorded reversibly and require GM confirmation.</p>
