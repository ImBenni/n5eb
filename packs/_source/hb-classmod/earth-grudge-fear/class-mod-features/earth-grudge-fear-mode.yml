system:
  description:
    value: >-
      <h2>Earth Grudge Fear Mode</h2><p>As a bonus action, spend 10 Chakra to activate Earth Grudge Fear for up to 10
      minutes or until your Chakra reaches 0. You may dismiss and resume it without paying Chakra again, but every
      activation consumes at least 1 minute of the ten-minute duration even if it lasts fewer than ten rounds. Once the
      duration expires or your Chakra reaches 0, it cannot be activated again until a Full Rest.</p><h3>Active
      Benefits</h3><ul><li>Gain the temporary HP and Chakra supplied by your absorbed hearts.</li><li>Gain access to
      your Threaded Arts.</li><li>Your reach with melee attacks and with Jutsu or Arts whose range is Touch (5 feet)
      increases by 10 feet.</li></ul><h3>Refuse Death</h3><p>If you would die while the mode is active, you may instead
      incur 100 Decay and regain half your maximum Hit Points.</p>
