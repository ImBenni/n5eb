system:
  description:
    value: >-
      <p>At class-mod level 4, each newly absorbed heart also grants a second Jutsu with the same keywords as the first
      and at least one rank lower. When casting a Heart Jutsu, incur 5 Decay to turn it into a Threaded Art using your
      Threaded Art DC and Attack Bonus. It deals necrotic damage and increases its damage die by the number of currently
      absorbed hearts.</p><p>The source does not define whether this means die size or dice count, so confirm the
      interpretation with the GM before resolving damage.</p>
