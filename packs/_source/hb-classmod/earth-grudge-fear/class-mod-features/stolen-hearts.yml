system:
  description:
    value: >-
      <p>This owned tracker represents your five available heart slots. Spending one use fills a slot; refund a use only
      when that heart is ejected, destroyed, or otherwise no longer absorbed. A qualifying heart comes from a defeated
      creature of at least your level that can mold Chakra and is an Elite or Solo adversary.</p><p>Each heart grants
      one Ninjutsu of the victim's highest known rank; if it uses an elemental release, choose the highest-rank Jutsu of
      that release. You cannot hold two hearts for the same elemental release. While Earth Grudge Fear is active, a D-,
      C-, B-, A-, or S-rank heart grants respectively 25, 50, 75, 100, or 150 temporary Hit Points and temporary Chakra,
      recovering on a Full Rest.</p><p>At class-mod level 3 these values instead increase maximum Hit Points and maximum
      Chakra. Keep the heart's name, release, stolen Jutsu, and rank on the owned Item.</p>
