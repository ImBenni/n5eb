system:
  description:
    value: >-
      <p>At class-mod level 2, as an action eject any number of hearts to create one Thread Monster per heart and incur
      4 Decay per monster. All monsters act as part of your turn when commanded with one bonus action or reaction; each
      takes one Action and movement and has no bonus action. A monster's HP and temporary Chakra each equal four times
      your Threaded Art Save DC, and its AC equals that DC.</p><p>It uses your saves, attacks, and save DC, can cast its
      heart's Jutsu using its own Chakra, and has a designed natural weapon dealing 3d6 + your class-mod level necrotic
      damage with 15-foot reach. You cannot use that heart's Jutsu while its monster is summoned. Unsummon an adjacent
      monster as an action. A dead monster incurs 10 Decay, drops its heart, and cannot be summoned again until after a
      rest.</p><p>An unrecovered heart is permanently lost only with GM confirmation.</p>
