system:
  description:
    value: >-
      <p>At class-mod level 2 you learn three Threaded Arts. Learn one more at levels 3 and 4, and two more at level 5.
      Your Threaded Art Save DC equals 10 + your Earth Grudge Fear level + your proficiency bonus + half your Ninjutsu,
      Taijutsu, or Genjutsu modifier. Choose the applicable modifier with the GM when the Art is used because the source
      does not specify a universal discipline.</p><p>Your Threaded Art Attack Bonus equals twice your proficiency bonus
      + your Earth Grudge Fear level.</p>
