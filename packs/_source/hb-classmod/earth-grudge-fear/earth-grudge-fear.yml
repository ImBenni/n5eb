system:
  description:
    value: |2-

        <h2>Earth Grudge Fear</h2>
        <p>Earth Grudge Fear is a Kinjutsu class mod built around black threads, stolen hearts, accumulated Decay, and
        techniques unique to the user. Gaining it is a lengthy GM-led quest: learn the Kinjutsu, obtain a still-beating heart
        from a former user, or reconstruct its ancient script and required sacrifices.</p>
        <h3>Advancement</h3>
        <p>Absorbed Hearts in this table is a lifetime total. Destroyed hearts do not remove class-mod levels.</p>
        <table><thead><tr><th>Class-Mod Level</th><th>Minimum Character Level</th><th>Absorbed Hearts</th>
        <th>Threaded Arts Known</th><th>Features</th></tr></thead><tbody>
        <tr><td>1</td><td>4</td><td>0</td><td>—</td><td>Decay, Stolen Hearts, EGF Mode</td></tr>
        <tr><td>2</td><td>—</td><td>10</td><td>3</td><td>Threads of Life and Death, Thread Monsters</td></tr>
        <tr><td>3</td><td>12</td><td>20</td><td>4</td><td>EGF Mode (2)</td></tr>
        <tr><td>4</td><td>—</td><td>40</td><td>5</td><td>Heart to Heart</td></tr>
        <tr><td>5</td><td>16</td><td>60</td><td>7</td><td>Mastered Earth Grudge Fear</td></tr>
        </tbody></table>
        <h3>Threaded Art Formulas</h3>
        <p><strong>Save DC:</strong> 10 + your Earth Grudge Fear level + your proficiency bonus + half your chosen Ninjutsu,
        Taijutsu, or Genjutsu modifier.</p>
        <p><strong>Attack Bonus:</strong> twice your proficiency bonus + your Earth Grudge Fear level.</p>
