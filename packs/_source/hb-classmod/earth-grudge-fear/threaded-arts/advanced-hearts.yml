  description:
    value: >-
      <h3>Threaded Art Type: Passive</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Threaded
      Art</dd><dt>Casting Time:</dt><dd>1
      Reaction</dd><dt>Range:</dt><dd>Special</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>M</dd><dt>Cost:</dt><dd>4
      Decay to clash</dd><dt>Keywords:</dt><dd>Threaded Art</dd></dl><h3>Description:</h3><p>When absorbing a heart, you
      may take its highest-known Taijutsu, Bukijutsu, Genjutsu, or Hijutsu instead of Ninjutsu. Class or clan features
      benefiting a nature release apply to Jutsu learned from hearts. When targeted by Ninjutsu or Taijutsu, use a
      reaction and incur 4 Decay to clash with a Heart Jutsu. Roll d20 + twice your proficiency bonus + your class-mod
      level, with advantage if the opposing Jutsu lacks Clash.</p><p>This does not increase your maximum absorbed
      hearts.</p>
