  description:
    value: >-
      <h3>Threaded Art Type: Technique</h3><dl
      class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Kinjutsu</dd><dt>Casting Time:</dt><dd>1
      Action</dd><dt>Range:</dt><dd>Self (90-foot-radius
      sphere)</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>M</dd><dt>Cost:</dt><dd>6
      Decay</dd><dt>Keywords:</dt><dd>Threaded Art</dd></dl><h3>Description:</h3><p>Make one Threaded Art Attack roll
      without disadvantage and compare it with the AC of each chosen creature. Each hit target is restrained and takes
      6d8 necrotic damage. At the end of each restrained target's turn it may make Athletics against your Threaded Art
      DC; while still bound at the end of its turn it takes 4d8 necrotic damage.</p>
