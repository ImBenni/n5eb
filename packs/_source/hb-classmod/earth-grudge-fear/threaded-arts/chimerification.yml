      HS</dd><dt>Cost:</dt><dd>10 Decay + upkeep</dd><dt>Keywords:</dt><dd>Threaded
      Art</dd></dl><h3>Description:</h3><p>Requires summoned Thread Monsters. Combine them into one Threaded Chimera,
