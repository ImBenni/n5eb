    value: >-
      <h3>Threaded Art Type: Technique</h3><dl
      class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Kinjutsu</dd><dt>Casting Time:</dt><dd>1
      Action</dd><dt>Range:</dt><dd>90 feet</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>CM,
      HS</dd><dt>Cost:</dt><dd>5 Decay + 3 per additional attack</dd><dt>Keywords:</dt><dd>Threaded
      Art</dd></dl><h3>Description:</h3><p>Make a Threaded Art Attack against one creature within range. On a hit deal
      12d10 necrotic damage. As part of the same Action, repeat against a different creature once for each absorbed
      heart; each additional attack incurs 3 Decay and may use that heart's nature-release damage type.</p>
