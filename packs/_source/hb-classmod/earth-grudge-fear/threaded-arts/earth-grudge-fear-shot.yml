system:
  description:
    value: >-
      <h3>Threaded Art Type: Technique</h3><dl
      class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Kinjutsu</dd><dt>Casting Time:</dt><dd>1
      Action</dd><dt>Range:</dt><dd>120-foot line, 25 feet
      wide</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>CM, HS</dd><dt>Cost:</dt><dd>10–50
      Decay</dd><dt>Keywords:</dt><dd>Threaded Art</dd></dl><h3>Description:</h3><p>Requires that no Thread Monsters are
      summoned. Creatures in the line make a Constitution save, taking full damage on a failure or half on a success. At
      10, 20, 30, 40, or 50 Decay deal respectively 20d10, 30d10, 40d10, 50d10, or 60d10 using one, two, three, four, or
      five absorbed nature releases. Water deals cold; a non-elemental heart can deal necrotic.</p>
