    value: >-
      <h3>Threaded Art Type: Passive</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Threaded
      Art</dd><dt>Casting Time:</dt><dd>Passive or 1 Bonus Action</dd><dt>Range:</dt><dd>Self or 120
      feet</dd><dt>Duration:</dt><dd>Permanent or Instant</dd><dt>Components:</dt><dd>M</dd><dt>Cost:</dt><dd>3 Decay
      for blast</dd><dt>Keywords:</dt><dd>Threaded Art, Movement</dd></dl><h3>Description:</h3><p>Gain a flying speed
      equal to twice your movement speed. As a bonus action, incur 3 Decay and choose a 30-foot-radius sphere within 120
      feet. Creatures in it make a Dexterity save, taking 8d8 necrotic damage on a failure or half as much on a
      success.</p>
