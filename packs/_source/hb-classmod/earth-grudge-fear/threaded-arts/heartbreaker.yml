  description:
    value: >-
      <h3>Threaded Art Type: Passive</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Threaded
      Art</dd><dt>Casting Time:</dt><dd>1 Long
      Rest</dd><dt>Range:</dt><dd>Touch</dd><dt>Duration:</dt><dd>Permanent</dd><dt>Components:</dt><dd>M</dd><dt>Cost:</dt><dd>GM-determined
      Decay</dd><dt>Keywords:</dt><dd>Threaded Art</dd></dl><h3>Description:</h3><p>Requires a heart from a class-mod
      user. Over a Long Rest, absorb the heart and steal one feature or Art chosen by the GM. You may replace up to your
      maximum hearts with hearts from different class mods; these hearts cannot create Thread Monsters or a Chimera.
      Passive abilities activate only while Earth Grudge Fear is active, and active abilities can be used only then. The
      GM determines Decay costs.</p><p>This is an optional, high-power Art; stolen abilities and permanent heart changes
      require explicit GM confirmation.</p>
