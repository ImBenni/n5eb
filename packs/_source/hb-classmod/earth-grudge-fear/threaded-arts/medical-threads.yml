    value: >-
      <h3>Threaded Art Type: Passive</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Threaded
      Art</dd><dt>Casting Time:</dt><dd>1 Bonus Action or 1
      Action</dd><dt>Range:</dt><dd>Touch</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>M</dd><dt>Cost:</dt><dd>4
      Decay for treatment</dd><dt>Keywords:</dt><dd>Threaded Art, Medical</dd></dl><h3>Description:</h3><p>You may learn
      Medical Release Jutsu regardless of knowing that release. As a bonus action incur 4 Decay and allow a creature to
      spend Hit Dice up to its maximum to heal; you may also reattach a severed limb. As an action, revive a creature
      killed outright if less than one minute has passed and physical remains exist.</p>
