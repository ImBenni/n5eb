  description:
    value: >-
      <h3>Threaded Art Type: Technique</h3><dl
      class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Kinjutsu</dd><dt>Casting Time:</dt><dd>1
      hour</dd><dt>Range:</dt><dd>Touch</dd><dt>Duration:</dt><dd>Permanent</dd><dt>Components:</dt><dd>CM,
      HS</dd><dt>Cost:</dt><dd>1 Heart</dd><dt>Keywords:</dt><dd>Threaded Art</dd></dl><h3>Description:</h3><p>Bury one
      absorbed heart in a safe place. You lose its benefits and it still counts toward your maximum. If you die, reform
      7 days later at the buried heart. It becomes your real heart, provides no benefit beyond the revival, and no
      longer counts toward maximum absorbed hearts. This works even if your body is ash or an effect says you cannot be
      revived.</p><p>Placement, death, reformation, and permanent roster changes require GM confirmation.</p>
