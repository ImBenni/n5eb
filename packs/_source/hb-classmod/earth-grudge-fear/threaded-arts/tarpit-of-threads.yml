system:
  description:
    value: >-
      <h3>Threaded Art Type: Technique</h3><dl
      class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Kinjutsu</dd><dt>Casting Time:</dt><dd>1
      Action</dd><dt>Range:</dt><dd>Self (30-foot-radius sphere)</dd><dt>Duration:</dt><dd>Up to 1
      minute</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>7 Decay</dd><dt>Keywords:</dt><dd>Threaded
      Art</dd></dl><h3>Description:</h3><p>Create chosen-creature difficult terrain in a 30-foot-radius sphere;
      creatures in it may be targeted as if within 5 feet. End it early as a bonus action to force a creature in the
      terrain to make a Strength save, becoming restrained on a failure. It may use an action to make Athletics against
      your DC at disadvantage.</p><p>If Thread Monsters are summoned, each dissolves into its own identical sphere,
      ceases to be a creature and cannot incur Decay, and may cage a different creature; monsters reform when the Art
      ends.</p>
