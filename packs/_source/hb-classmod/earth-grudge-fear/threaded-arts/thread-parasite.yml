  description:
    value: >-
      <h3>Threaded Art Type: Technique</h3><dl
      class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Kinjutsu</dd><dt>Casting Time:</dt><dd>1
      Action</dd><dt>Range:</dt><dd>Touch</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>M,
      CM</dd><dt>Cost:</dt><dd>7 Decay</dd><dt>Keywords:</dt><dd>Threaded Art</dd></dl><h3>Description:</h3><p>Make a
      Threaded Art Attack. On a hit, the target takes 15d8 necrotic damage and makes a Constitution save. On a failure,
      implant a parasite; at the end of each of its turns it gains 5 ranks of Bleeding. Only Medical Ninjutsu of A-rank
      or higher removes the parasite, and the Bleeding cannot stop while it remains.</p>
