system:
  description:
    value: >-
      <h3>Threaded Art Type: Passive</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Threaded
      Art</dd><dt>Casting Time:</dt><dd>1 Bonus Action or 1 Reaction</dd><dt>Range:</dt><dd>Self or
      Melee</dd><dt>Duration:</dt><dd>1 minute</dd><dt>Components:</dt><dd>M</dd><dt>Cost:</dt><dd>4 Decay to run
      wild</dd><dt>Keywords:</dt><dd>Threaded Art, Taijutsu</dd></dl><h3>Description:</h3><p>Your unarmed attacks deal
      an additional 3d6 necrotic damage. As a bonus action incur 4 Decay to let your threads run wild for 1 minute.
      During it, use a bonus action to make a Threaded Art Attack against a creature in melee, dealing 8d10 necrotic on
      a hit. When damaged by Ninjutsu, Taijutsu, or a weapon attack, use your reaction to reduce that damage by
      6d12.</p>
