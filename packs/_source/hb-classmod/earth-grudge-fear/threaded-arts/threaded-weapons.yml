  description:
    value: >-
      <h3>Threaded Art Type: Passive</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Threaded
      Art</dd><dt>Casting Time:</dt><dd>1 Bonus Action</dd><dt>Range:</dt><dd>Self</dd><dt>Duration:</dt><dd>Until
      dismissed</dd><dt>Components:</dt><dd>M</dd><dt>Cost:</dt><dd>None; 3 Decay for Bukijutsu
      conversion</dd><dt>Keywords:</dt><dd>Threaded Art, Bukijutsu</dd></dl><h3>Description:</h3><p>As a bonus action
      create a special Threaded Weapon with the statistics of a weapon of your choice. Its attacks deal an additional
      4d6 necrotic damage. When casting a Bukijutsu, incur 3 Decay to let this weapon fulfill all requirements, use your
      Threaded Art DC or Attack Bonus, and deal 6d8 necrotic damage once per casting.</p>
