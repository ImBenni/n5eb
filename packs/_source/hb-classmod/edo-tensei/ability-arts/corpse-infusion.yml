      CM</dd><dt>Cost:</dt><dd>Special</dd><dt>Keywords:</dt><dd>Kinjutsu</dd></dl><h3>Description:</h3><p>As a bonus
      action, sacrifice an Edo Tensei within 30 feet. Gain each of its ability scores that exceeds yours, its innate
      traits, and temporary hit points equal to its current hit points. Absorb its Jutsu slots as 5 temporary Chakra
      each. The benefits last 1 hour; the Edo Tensei returns to the Realm of Death and is not destroyed.</p>
