  description:
    value: >-
      <h2>Cursed Detonation</h2><h3>Edo Tensei Art Type: Ability</h3><dl class="n5eb-classmod-summary"><dt>Casting
      Time:</dt><dd>Bonus Action</dd><dt>Range:</dt><dd>Controlled Edo Tensei</dd><dt>Duration:</dt><dd>1
      minute</dd><dt>Components:</dt><dd>HS, CS, CM</dd><dt>Cost:</dt><dd>1 Unholy
      Charge</dd><dt>Keywords:</dt><dd>Kinjutsu</dd></dl><h3>Description:</h3><p>As a bonus action, spend 1 Unholy
      Charge to empower a controlled Edo Tensei for 1 minute. At the start of each turn it takes 2d6 unavoidable
      necrotic damage. Its attacks deal extra necrotic damage equal to twice your class-mod level and it resists all
      damage except Fuinjutsu.</p><p>At 0 hit points it detonates; creatures within 60 feet make a Dexterity save,
      taking Xd8 necrotic damage, where X is the Edo Tensei's level, or half on success.</p>
