      <h2>Grave Exchange</h2><h3>Edo Tensei Art Type: Ability</h3><dl class="n5eb-classmod-summary"><dt>Casting
      Time:</dt><dd>Special</dd><dt>Range:</dt><dd>Self</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>HS,
      CS, CM</dd><dt>Cost:</dt><dd>1 Unholy
      Charge</dd><dt>Keywords:</dt><dd>Kinjutsu</dd></dl><h3>Description:</h3><p>Perform a 1-minute ritual and spend 1
      Unholy Charge to swap locations with any controlled Edo Tensei regardless of distance, plane, or dimensional
      barrier. Alternatively, when targeted by an attack, react and spend 1 Unholy Charge to exchange with an Edo Tensei
      within 120 feet. It becomes the target and may unleash one Jutsu against the attacker as part of that
      reaction.</p>
