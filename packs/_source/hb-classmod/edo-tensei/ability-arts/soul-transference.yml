  description:
    value: >-
      <h2>Soul Transference</h2><h3>Edo Tensei Art Type: Ability</h3><dl class="n5eb-classmod-summary"><dt>Casting
      Time:</dt><dd>Special, once per turn</dd><dt>Range:</dt><dd>Ally within 60 feet; Edo Tensei within 120
      feet</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>HS, CS,
      CM</dd><dt>Cost:</dt><dd>Special</dd><dt>Keywords:</dt><dd>Kinjutsu</dd></dl><h3>Description:</h3><p>Once per
      turn, when an ally within 60 feet would be reduced to 0 hit points, transfer up to half the current hit points of
      one controlled Edo Tensei within 120 feet to that ally. Excess healing becomes temporary hit points. The Edo
      Tensei loses the transferred hit points directly.</p>
