system:
  description:
    value: >-
      <h2>Edo Tensei</h2><p>At 1st level, bind the souls of the dead into corpses. Your maximum active Edo Tensei is 1
      at level 1, 2 at level 2, 3 at level 3, 4 at level 4, and 5 at level 5. Your maximum summon rank is D at level 1,
      C at level 2, B at level 3, A at level 4, and S at level 5. Edo Tensei have disadvantage on saves against
      Fuinjutsu of equal or higher rank.</p><p>If reduced to 0 hit points by Fuinjutsu, the summon is sealed and
      requires full-rest reconstruction costing 10 Ryo per maximum hit point.</p>
