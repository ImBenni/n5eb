system:
  description:
    value: |-
      <h2>Mastering Edo Tensei</h2>
          <p>Learning Edo Tensei is a GM-led, four-step ritual. Each step requires four checks in its listed skill, and at
          least three of the four checks must succeed.</p>
          <table><thead><tr><th>Step</th><th>Skill</th><th>DC</th><th>Minimum Downtime</th><th>Base Cost</th></tr></thead><tbody>
          <tr><td>1</td><td>Investigation</td><td>25</td><td>6</td><td>250 Ryo</td></tr>
          <tr><td>2</td><td>Chakra Control</td><td>25</td><td>6</td><td>250 Ryo</td></tr>
          <tr><td>3</td><td>Medicine</td><td>25</td><td>6</td><td>500 Ryo</td></tr>
          <tr><td>4</td><td>Ninshou</td><td>30</td><td>6</td><td>500 Ryo</td></tr>
          </tbody></table>
          <p>At each class-mod level above 1, each step's cost increases by its base amount. With each advancement at
          character levels 13, 15, 17, and 19, the downtime cost of rituals decreases by 1.</p>
          <h3>Failure</h3>
          <ul>
            <li><strong>Step 1:</strong> Gain 2 Exhaustion and spend 2 DT to recover.</li>
            <li><strong>Step 2:</strong> You cannot attempt Edo Tensei again for 2 weeks.</li>
            <li><strong>Step 3:</strong> Lose Mold Chakra and spend 3 DT to recover. If the failure is by 10 or more, Mold
            Chakra remains lost until an A-Rank or higher condition-restoring Ninjutsu targets you.</li>
            <li><strong>Step 4:</strong> Roll 1d10 on the Edo Tensei Corruption table. A second failure permanently loses
            your soul.</li>
          </ul>
          <h3>Edo Tensei Corruption (1d10)</h3>
          <ol><li>Living Tattoo</li><li>Reverse Shadow</li><li>Bone Whispers</li><li>Rotting Reflection</li>
          <li>Extra Heart</li><li>Soul Leak</li><li>Hungering Nails</li><li>Grave Breath</li><li>Phantom Limb</li>
          <li>Death Echo</li></ol>
