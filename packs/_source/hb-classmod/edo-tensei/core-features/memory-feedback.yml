  description:
    value: >-
      <h2>Memory Feedback</h2><p>At 2nd level, once per long rest choose one Edo Tensei as your Assisting Edo Tensei.
      While it exists, summoned or in the Realm of Death, gain all its proficiencies. A proficiency you already possess
      instead grants 1 Mastery. You may also claim a number of its Jutsu equal to your proficiency bonus, including up
      to Hijutsu.</p>
