system:
  description:
    value: >-
      <h2>Reversed Summoning: Edo Tensei</h2><p>Upon death, within 1 minute attempt a Ninshou Check with DC 28 minus
      class-mod level, without bonuses from Jutsu, feats, or external effects. On success, permanently lose 1 maximum
      Unholy Charge, destroy one Edo Tensei forever, and replace it at its location after 1d4 turns with 8d10 hit
      points. On failure, your soul is consumed and you are permanently dead.</p><p>Each later use increases the DC by 2
      per lost maximum Unholy Charge; an effect that prevents resurrection or reanimation increases the DC by 5.</p>
