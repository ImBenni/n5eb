  description:
    value: >-
      <h2>Unholy Charges</h2><p>Your maximum Unholy Charges are 2, 6, 9, 13, and 18 at class-mod levels 1 through 5.
      Twice per long rest, you may recover Unholy Charges on a short rest equal to your class-mod level. Once per full
      rest, you may recover half your maximum Unholy Charges. Recover all Unholy Charges on a full rest.</p>
    chat: ""
  source:
