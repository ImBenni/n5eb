system:
  description:
    value: |-
      <h2>Creating an Edo Tensei</h2>
          <h3>1. Secure a Vessel</h3>
          <p>Use a fresh body, decayed corpse, or living sacrifice. Grave Robbing during a Full Rest uses 1d100: 1–90
          produces a decayed body and 91–100 an intact body. A battlefield body is judged by the GM. A Black Market purchase
          costs 1 Downtime; requesting a specific Clan adds 10,000 Ryo.</p>
          <ul><li><strong>Decayed:</strong> Summoning DC +3.</li><li><strong>Living Host:</strong> An incapacitated or willing
          host reduces the DC by 0 Minion, 1 Standard, 2 Elite, or 5 Solo.</li></ul>
          <h3>2. DNA Acquisition</h3>
          <p>Make an Intelligence DNA Check with DC 15 − class-mod level.</p>
          <ul><li><strong>Combat Harvest:</strong> Elite DC +1; Solo DC +2. On success, choose 3 Traits with the GM and inherit
          the clan.</li><li><strong>Black Market (1 DT):</strong> Standard 1,000 Ryo, Elite 2,000 Ryo and DC +1, Solo 3,000
          Ryo and DC +2. Specify the clan; the GM chooses 3 Traits.</li><li><strong>Research (1 DT):</strong> A living lead
          requires Combat Harvest. Dead remains use Black Market with DNA DC −3; choose the clan and 3 Traits with the GM.</li></ul>
          <h3>3. Essence Transmutation</h3>
          <p>Choose rank, Standard/Elite/Solo class, role, inherited Traits, and Unholy Blessings. Calculate the Actor from
          the rank and class records in this folder.</p>
          <h3>4. Summoning Check</h3>
          <p>Base Ninshou DC 15, +1 per rank above D, +2 Elite, +4 Solo, +1 per Blessing point, +3 for a decayed vessel, and
          −1 to −5 for a living host.</p>
