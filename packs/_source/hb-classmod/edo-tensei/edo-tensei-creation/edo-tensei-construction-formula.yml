  description:
    value: |-
      <h2>Edo Tensei Construction Formula</h2>
          <table><thead><tr><th>Rank</th><th>Level</th><th>Jutsu Slots</th><th>Jutsu</th><th>Speed</th></tr></thead><tbody>
          <tr><td>D</td><td>8</td><td>10</td><td>3 B-Rank or lower</td><td>30 ft.</td></tr>
          <tr><td>C</td><td>11</td><td>14</td><td>+1 B-Rank and +1 A-Rank or lower</td><td>45 ft.</td></tr>
          <tr><td>B</td><td>14</td><td>18</td><td>+2 A-Rank or lower</td><td>60 ft.</td></tr>
          <tr><td>A</td><td>17</td><td>22</td><td>+1 A-Rank and +1 S-Rank or lower</td><td>75 ft.</td></tr>
          <tr><td>S</td><td>20</td><td>26</td><td>+2 S-Rank or lower</td><td>90 ft.</td></tr>
          </tbody></table>
          <p>Start all ability scores at 16. At each rank after D, assign +6 Ability Score Increases, with caps of 20 at C,
          22 at B, 24 at A, and 26 at S.</p>
          <p><strong>AC:</strong> 10 + half level + Defensive Ability modifier. <strong>HP:</strong> (Toughness 10 +
          Constitution modifier) × level. Standard costs 1 Unholy Charge, Elite 2, and Solo 3.</p>
          <h3>Class Modifiers</h3>
          <ul><li><strong>Elite:</strong> Double HP and Jutsu Slots; one Elite Action; three skills or Mastery ranks.</li>
          <li><strong>Solo:</strong> S-Rank only; triple HP and Jutsu Slots; two Elite Actions; five skills or Mastery ranks.</li></ul>
