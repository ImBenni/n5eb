system:
  description:
    value: >-
      <h2>Edo Tensei Recovery and Reconstruction</h2><p><strong>Short Rest:</strong> recover hit points equal to
      Toughness multiplied by half level and Jutsu Slots equal to Intelligence modifier. Long Rest: recover half maximum
      hit points and half maximum Jutsu Slots. Full Rest: recover all hit points and Jutsu Slots. A Fuinjutsu-sealed Edo
      Tensei requires reconstruction during a Long Rest, or any number during a Full Rest, at 10 Ryo per hit point
      restored.</p><p>A summon explicitly made impossible to revive cannot be reconstructed.</p>
