      natural or held-weapon attacks.</li><li><strong>Caster:</strong> Additional Jutsu Slots by rank, +3 at D/C, +5 at
      B/A, +7 at S.</li><li><strong>Controller:</strong> Save DC bonus +1 at D/C, +2 at B/A, +3 at
      S.</li><li><strong>Defender:</strong> AC bonus +1 at D/C, +2 at B/A, +3 at S.</li><li><strong>Lurker:</strong>
      Lethal Attack for extra damage against a surprised creature.</li><li><strong>Supporter:</strong> Healing and
      temporary-hit-point dice increase by +1 at D/C, +2 at B/A, +3 at S.</li></ul>
