system:
  description:
    value: |-
      <h2>Edo Tensei</h2>
        <p>A five-level homebrew class mod for mastering Impure World Reincarnation, building bound summons, choosing
        Unholy Arts, and modifying reincarnated souls with Unholy Blessings.</p>
        <h3>Progression</h3>
        <table><thead><tr><th>Level</th><th>Character Level</th><th>Unholy Charges</th><th>Arts</th>
        <th>Active Edo Tensei</th><th>Features</th></tr></thead><tbody>
        <tr><td>1</td><td>11</td><td>2</td><td>2</td><td>1</td><td>Edo Tensei, Unholy Arts, Unholy Blessings</td></tr>
        <tr><td>2</td><td>13</td><td>6</td><td>2</td><td>2</td><td>Kinjutsu Mastery, Memory Feedback, Forbidden Insight</td></tr>
        <tr><td>3</td><td>15</td><td>9</td><td>3</td><td>3</td><td>Stolen Legacy, Master of the Undying
        (Reversed Summoning: Edo Tensei)</td></tr>
        <tr><td>4</td><td>17</td><td>13</td><td>3</td><td>4</td><td>Echoes of Past Lives, Effortless Summoning,
        Deepened Forbidden Insight</td></tr>
        <tr><td>5</td><td>19</td><td>18</td><td>4</td><td>5</td><td>Absolute Edo Tensei</td></tr>
        </tbody></table>
        <h3>Unholy Art Formulas</h3>
        <p><strong>Save DC:</strong> 12 + proficiency bonus + half character level.</p>
        <p><strong>Attack Bonus:</strong> class-mod level + twice proficiency bonus.</p>
        <h3>Source</h3>
        <p><a href="https://homebrewery.naturalcrit.com/share/RGoMqoH-Bfap">Edo Tensei - Class Mod on Homebrewery</a>.</p>
