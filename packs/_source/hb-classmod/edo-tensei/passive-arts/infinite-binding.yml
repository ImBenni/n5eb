      CS, CM</dd><dt>Cost:</dt><dd>Special</dd><dt>Keywords:</dt><dd>Kinjutsu</dd></dl><h3>Description:</h3><p>Control
      one additional Edo Tensei beyond your class-mod limit. Each summon lasts 1 additional minute in combat or 1
      additional hour outside combat per class-mod level. You may pre-prepare an Edo Tensei with a successful Summoning
      Check to appear on a chosen trigger, act autonomously toward a pre-assigned objective, and return to the Realm of
      Death when complete.</p>
