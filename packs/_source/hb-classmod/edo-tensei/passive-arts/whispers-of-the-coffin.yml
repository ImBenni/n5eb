    value: >-
      <h2>Whispers of the Coffin</h2><h3>Edo Tensei Art Type: Passive</h3><dl class="n5eb-classmod-summary"><dt>Casting
      Time:</dt><dd>Special</dd><dt>Range:</dt><dd>Self</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>HS,
      CS, CM</dd><dt>Cost:</dt><dd>Special</dd><dt>Keywords:</dt><dd>Kinjutsu</dd></dl><h3>Description:</h3><p>Gain
      proficiency in two skills of your choice, reselected after each long rest. Add 1d4 to Strength, Dexterity, and
      Constitution saving throws. Once per short rest, ask bound souls one question as if casting augury; the GM answers
      with a cryptic omen.</p>
