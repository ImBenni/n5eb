    value: >-
      <h2>Bone-Crushing Combination</h2><h3>Edo Tensei Art Type: Technique</h3><dl
      class="n5eb-classmod-summary"><dt>Casting
      Time:</dt><dd>Action</dd><dt>Range:</dt><dd>Touch</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>M</dd><dt>Cost:</dt><dd>1
      Unholy Charge</dd><dt>Keywords:</dt><dd>Taijutsu, Combo, Kinjutsu</dd></dl><h3>Description:</h3><p>Make two Melee
      Unholy Art Attacks. Each hit deals your Unarmed Damage + 12d10 bludgeoning damage and forces a Constitution save;
      if both hit, the saves have disadvantage. Success causes Dazed until the end of the target's next turn; failure
      causes Stunned for that duration. Then throw the target up to 90 feet.</p><p>An ally within 30 feet of the
      trajectory gains a bonus Reaction usable only for a Taijutsu Finisher or Chain X Bukijutsu.</p>
