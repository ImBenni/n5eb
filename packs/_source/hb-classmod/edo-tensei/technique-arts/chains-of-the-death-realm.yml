system:
  description:
    value: >-
      <h2>Chains of the Death Realm</h2><h3>Edo Tensei Art Type: Technique</h3><dl
      class="n5eb-classmod-summary"><dt>Casting Time:</dt><dd>Full Turn Action</dd><dt>Range:</dt><dd>30
      feet</dd><dt>Duration:</dt><dd>Concentration, up to 2 minutes</dd><dt>Components:</dt><dd>HS, CS,
      CM</dd><dt>Cost:</dt><dd>5 Unholy Charges</dd><dt>Keywords:</dt><dd>Ninjutsu, Fuinjutsu,
      Kinjutsu</dd></dl><h3>Description:</h3><p>The target makes a Strength save. On failure it is Restrained, gains 5
      Sealed and 1 Exhaustion, and may use its action to repeat the save. Allies may use an action to grant another
      save; success removes this Art's conditions. Casting while restrained requires a Constitution save or the Jutsu
      fails and spends its Chakra. At each turn start, the target gains 1 Exhaustion and takes 7d10 Chakra and Force
      damage.</p><p>At 11 Exhaustion it is pulled into the Death Realm and becomes your Edo Tensei.</p>
