    value: >-
      <h2>Ritual Severance Strike</h2><h3>Edo Tensei Art Type: Technique</h3><dl
      class="n5eb-classmod-summary"><dt>Casting Time:</dt><dd>Reaction when you see a summoning
      Jutsu</dd><dt>Range:</dt><dd>30 feet</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>HS, CS,
      CM</dd><dt>Cost:</dt><dd>1 Unholy Charge</dd><dt>Keywords:</dt><dd>Ninjutsu, Fuinjutsu,
      Kinjutsu</dd></dl><h3>Description:</h3><p>When a creature in range casts a summoning or binding Jutsu, it makes a
      Constitution save. On failure, the summoned creature comes under your control for the duration. On success, halve
      the summon duration and the summoned creature takes Xd12 psychic damage, where X is its level.</p>
