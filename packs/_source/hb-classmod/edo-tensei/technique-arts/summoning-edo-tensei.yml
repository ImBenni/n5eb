system:
  description:
    value: >-
      <h2>Summoning Edo Tensei</h2><h3>Edo Tensei Art Type: Technique</h3><dl class="n5eb-classmod-summary"><dt>Casting
      Time:</dt><dd>Full Turn Action</dd><dt>Range:</dt><dd>10 feet</dd><dt>Duration:</dt><dd>1 minute in combat or 1
      hour outside combat</dd><dt>Components:</dt><dd>HS, CS, CM</dd><dt>Cost:</dt><dd>1 Standard, 2 Elite, or 3 Solo
      Unholy Charges</dd><dt>Keywords:</dt><dd>Ninjutsu, Fuinjutsu, Kinjutsu</dd></dl><h3>Description:</h3><p>Requires a
      prepared vessel and the deceased warrior's DNA. Make a Ninshou Check against the vessel's Summoning DC. On
      success, summon it in range. On failure, the charges are spent with no summon. On a failure by 5 or more, it
      appears independent for 24 hours; regain control by reducing it to 0 hit points or convincing it to obey.</p><p>A
      summon lasts 1 minute in combat or 1 hour outside combat; spend 1 Unholy Charge to refresh it. Command movement
      freely and spend a bonus action to command its Action and Bonus Action. At level 3 it gains its own Reaction.
      Multiple active summons increase the check DC by +1 per Standard, +2 per Elite, and +3 per Solo.</p>
