system:
  description:
    value: >-
      <h2>Deathmask Performer</h2><p><strong>Cost:</strong> 1 Unholy Blessing. Gain Performance proficiency and +2
      Mastery. A combat Performance check forces enemies within 30 feet that see or hear you to make a Wisdom save or
      suffer disadvantage on their next attack. Once per short rest, use a Macabre Performance; chosen creatures within
      30 feet make a Charisma save or are Charmed or Frightened for 1 minute, repeating the save at the end of each
      turn.</p>
