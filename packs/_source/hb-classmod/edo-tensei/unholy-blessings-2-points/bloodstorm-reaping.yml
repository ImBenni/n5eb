system:
  description:
    value: >-
      <h2>Bloodstorm Reaping</h2><p><strong>Cost:</strong> 2 Unholy Blessings. When you reduce a creature to 0 hit
      points, chosen creatures within 30 feet make a Dexterity save or take 3d8 necrotic damage. Once per encounter,
      trigger Bloodstorm: hostile creatures in a 60-foot radius make a Dexterity save against 20d8 necrotic damage;
      creatures killed by it are obliterated without a corpse.</p>
