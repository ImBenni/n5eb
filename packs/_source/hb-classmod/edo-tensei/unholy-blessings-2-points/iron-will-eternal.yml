system:
  description:
    value: >-
      <h2>Iron Will Eternal</h2><p><strong>Cost:</strong> 2 Unholy Blessings. When you succeed on a Genjutsu save, react
      to reflect it. The original caster saves against the original DC or your Unholy Art DC, whichever is higher,
      suffering the full Genjutsu on failure. Every successful Genjutsu save counts as critical; a natural critical
      success grants immunity to that Genjutsu for 24 hours.</p>
