system:
  description:
    value: >-
      <p>At 2nd level, every Bond knows when you are at or below half your Hit Point maximum. As an action, a Bond may
      roll all of its remaining Chakra Dice and choose before rolling to empower your next attack roll, damage roll, or
      save DC. Attack: add half the result; if the total equals or exceeds the target's AC by 10, the attack is a
      critical hit. Damage: add the full result.</p><p><strong>Save DC:</strong> add one third of the result; a failure
      by 5 doubles the damage, and a failure by 10 maximizes it. The Bond then gains 3 ranks of Exhaustion and is Dazed
      and Weakened for 24 hours; these penalties cannot be recovered by other means.</p>
