  description:
    value: >-
      <p>At 1st level, choose two Light Arts. Choose one additional Light Art at each class-mod level from 2nd through
      5th. The Light Art advancement on the Light Release Item enforces these counts. Your Light Art Save DC equals 8 +
      your Light Release level + your proficiency bonus. Your Light Art Attack Bonus equals twice your proficiency bonus
      + your Light Release level.</p>
