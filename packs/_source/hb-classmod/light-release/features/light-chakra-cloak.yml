system:
  description:
    value: >-
      <p>At 3rd level, while your Light Seal is active, you can use a bonus action and spend 20 Light Chakra to form a
      cloak for the rest of the activation. Guiding Light: chosen creatures within 60 feet reduce Jutsu costs by 3, to a
      minimum of 1, and their Jutsu deal +1 damage die.</p><p><strong>Materialized Hope:</strong> as a reaction when a
      creature you can see within 90 feet falls to 0 Hit Points, spend 10 Light Chakra to leave it at 1 Hit Point and
      grant it 25 temporary Hit Points until the start of its next turn. Each creature can benefit once per Short
      Rest.</p>
