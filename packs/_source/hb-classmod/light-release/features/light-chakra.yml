system:
  description:
    value: >-
      <p>You can access Light Chakra only while your Light Seal is active. Your maximum is 20 + twice your current
      proficiency bonus + 20 for each Light Release level after the first. While the Seal is active, you must spend
      Light Chakra instead of normal Chakra. Jutsu cast with Light Chakra gain a bonus to attack and damage rolls equal
      to twice your Light Release level.</p><p>If a Jutsu has no attack roll, its save DC increases by 1 per Light
      Release level. If it has neither an attack nor a save, reduce its cost by 1 per Light Release level, to a minimum
      of 1.</p><p>As an action, you can spend any amount of Light Chakra on a creature within 10 feet: each point
      restores 2 Hit Points; 5 points end one condition; or 10 points grant advantage on ability checks and saving
      throws until the end of the target's next turn. The draft does not specify a general recovery rule for spent Light
      Chakra, so this tracker does not invent one.</p>
