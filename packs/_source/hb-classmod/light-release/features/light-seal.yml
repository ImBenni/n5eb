system:
  description:
    value: >-
      <p>A pale, dormant mark appears on your body. As a bonus action, activate it for up to 1 minute. When the Seal
      deactivates, every class-mod effect ends. On activation, you and allied creatures within 30 feet recover (2 × your
      Light Release level)d6 + your character level Hit Points. A creature other than you can receive this healing only
      once per Short Rest.</p><p>You can activate the Seal twice per Long Rest and cannot reactivate it for 10 minutes
      after an activation ends. As a bonus action while touching a willing creature, you may create a permanent Bond. A
      pale mark appears on it.</p><p>Each Bond permanently seals one of your Hit Dice and one of your Chakra Dice and
      transfers them to the Bond, which rolls those dice and adds its Constitution modifier to increase its Hit Point
      and Chakra totals. If a Bond dies, its soul is torn asunder and cannot be revived, and the transferred dice do not
      return.</p><p>Bond creation, Bond death, soul loss, and permanent die changes require explicit GM confirmation and
      must be recorded reversibly.</p>
