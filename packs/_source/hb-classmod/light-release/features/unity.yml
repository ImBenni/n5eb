system:
  description:
    value: >-
      <p>At 5th level while your Light Chakra Cloak is active, each Bond within 120 feet gains +1 to every ability
      score. Hit Points and Chakra gained from the resulting Constitution increase instead become temporary Hit Points
      and bonus Light Chakra for you. If no Bonds are within 120 feet, your single-target Light Arts cannot be reacted
      to or reduced.</p>
