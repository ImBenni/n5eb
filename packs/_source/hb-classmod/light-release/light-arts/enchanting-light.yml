  description:
    value: >-
      <h3>Light Art Type: Light Ninjutsu</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Light
      Art</dd><dt>Casting Time:</dt><dd>1 Bonus Action</dd><dt>Range:</dt><dd>30
      feet</dd><dt>Duration:</dt><dd>Concentration, up to 1
      minute</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>10 Light Chakra</dd><dt>Keywords:</dt><dd>Ninjutsu,
      Light Release, Enhancement, Concentration</dd></dl><h3>Description:</h3><p>Choose one creature other than yourself
      within range. For the duration, it gains +2 AC, +2 to attack rolls, +1 damage die, advantage on saving throws
      against Ninjutsu and Genjutsu, immunity to Blindness, +1 to its Ninjutsu and Genjutsu save DCs, and a 2-point
      reduction to its Jutsu costs, to a minimum cost of 1. It sheds bright light for 20 feet and dim light for 20 feet
      beyond that.</p>
