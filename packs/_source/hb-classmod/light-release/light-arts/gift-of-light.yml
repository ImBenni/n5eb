  description:
    value: >-
      <h3>Light Art Type: Light Ninjutsu</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Light
      Art</dd><dt>Casting Time:</dt><dd>1 Action</dd><dt>Range:</dt><dd>120 feet</dd><dt>Duration:</dt><dd>1
      minute</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>50 Light Chakra</dd><dt>Keywords:</dt><dd>Ninjutsu,
      Light Release, Enhancement</dd></dl><h3>Description:</h3><p>Choose one willing creature within range. It gains
      your Light Chakra Cloak, Light Arts, and Bane of the Dark features for the duration, but can use only Light Arts
      that you know. It can convert 2 normal Chakra into 1 Light Chakra. You can have only one creature empowered this
      way and can end the gift as a bonus action.</p><p>When the effect ends, the creature is Dazed and Weakened and
      gains 2 ranks of Exhaustion for 1 hour or until it rests.</p>
