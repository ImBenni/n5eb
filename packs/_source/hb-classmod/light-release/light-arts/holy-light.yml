  description:
    value: >-
      <h3>Light Art Type: Light Ninjutsu</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Light
      Art</dd><dt>Casting Time:</dt><dd>1 Full Turn</dd><dt>Range:</dt><dd>Self (120-foot
      sphere)</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>1 Light
      Chakra</dd><dt>Keywords:</dt><dd>Ninjutsu, Light Release, Force, Medical, Sealing,
      Area</dd></dl><h3>Description:</h3><p>All allies in a 120-foot sphere centered on you recover all Hit Points and
      are cleansed of every condition. Hostile creatures make a Wisdom saving throw, taking 35d4 force damage on a
      failed save or half as much on a successful save. A creature reduced to 0 Hit Points is destroyed and
      sealed.</p><p>Your maximum Hit Points become 0, every non-Bond forgets you, and your body is sealed to be passed
      to a successor after 20d20 years. The destruction, memory loss, retirement, and succession clauses require
      explicit GM confirmation and must be represented reversibly rather than by deleting an Actor or Item.</p>
