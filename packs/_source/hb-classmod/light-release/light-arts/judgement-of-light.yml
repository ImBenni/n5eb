    value: >-
      <h3>Light Art Type: Light Ninjutsu</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Light
      Art</dd><dt>Casting Time:</dt><dd>1 Action</dd><dt>Range:</dt><dd>90 feet</dd><dt>Duration:</dt><dd>Instant;
      special sealing up to 1 minute</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>20 Light
      Chakra</dd><dt>Keywords:</dt><dd>Ninjutsu, Light Release, Force, Sealing</dd></dl><h3>Description:</h3><p>Make a
      ranged Light Art attack against a creature within range. On a hit, it takes 11d6 force damage, then makes a
      Constitution saving throw. On a failed save, the last Jutsu it used is sealed for 1 minute. If it fails by 10 or
      more, the last Feature it used is also sealed for 1 minute. A successful save causes no additional effect.</p>
