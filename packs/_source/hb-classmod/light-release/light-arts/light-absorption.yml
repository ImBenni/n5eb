    value: >-
      <h3>Light Art Type: Light Ninjutsu</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Light
      Art</dd><dt>Casting Time:</dt><dd>1 Reaction</dd><dt>Range:</dt><dd>30
      feet</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>Special — spent Chakra
      Dice</dd><dt>Keywords:</dt><dd>Ninjutsu, Light Release, Reaction, Counter</dd></dl><h3>Description:</h3><p>When
      you see a creature within range cast a chakra-using Feature, spend and roll any number of your Chakra Dice. If the
      result equals or exceeds the Feature's chakra cost, negate that Feature and gain Light Chakra equal to half its
      chakra cost. Spending Chakra Dice and awarding Light Chakra require confirmation because Chakra Dice are stored on
      the actor rather than this Art.</p>
