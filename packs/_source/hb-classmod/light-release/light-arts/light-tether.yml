  description:
    value: >-
      <h3>Light Art Type: Light Ninjutsu</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Light
      Art</dd><dt>Casting Time:</dt><dd>1 Action</dd><dt>Range:</dt><dd>60 feet</dd><dt>Duration:</dt><dd>Concentration,
      up to 1 minute</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>20 Light
      Chakra</dd><dt>Keywords:</dt><dd>Ninjutsu, Light Release, Link,
      Concentration</dd></dl><h3>Description:</h3><p>Link yourself to one willing creature within range. The tether does
      not count against the number of effects on which you can concentrate, but it still requires concentration and its
      Light Chakra upkeep. The linked creature gains the same effects that affect you and benefits from your
      self-targeting Jutsu and Light Arts. The link breaks if the target leaves range, is concealed from you, or becomes
      unconscious.</p>
