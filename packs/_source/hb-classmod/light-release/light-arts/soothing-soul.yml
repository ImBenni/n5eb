      Light Chakra</dd><dt>Keywords:</dt><dd>Ninjutsu, Light Release, Medical,
      Revival</dd></dl><h3>Description:</h3><p>Touch a creature that has been dead no longer than 10 minutes and make a
      Ninshou check at advantage against DC 15. On a success, the creature returns to life with 1 Hit Point. Missing
      body parts and internal organs are restored. Poisons, normal and unnatural diseases, special poisons, seals, and
      curses affecting it when it died are neutralized. This Art does not remove Exhaustion accumulated before
      death.</p>
