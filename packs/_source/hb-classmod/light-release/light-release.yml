system:
  description:
    value: |2-

        <h2>Light Release</h2>
        <p>Light Release embodies protection, giving, support, and sacrifice. It is a heroic class mod whose power is
        strengthened by the living people to whom its user binds fragments of their spirit, soul, or consciousness.</p>
        <h3>Unlocking Light Release</h3>
        <p>Light Release is obtained through a unique narrative or mechanical event approved by the GM. The draft presents
        multiple example unlock paths; the event itself does not alter the mechanics below.</p>
        <h3>Leveling the Class Mod</h3>
        <p>You must meet the character-level requirement and maintain the required number of living Bonds. A Bond that dies
        no longer satisfies this requirement.</p>
        <table>
          <thead><tr><th>Class-Mod Level</th><th>Minimum Character Level</th><th>Living Bonds</th><th>Light Arts Known</th></tr></thead>
          <tbody>
            <tr><td>1</td><td>4</td><td>—</td><td>2</td></tr>
            <tr><td>2</td><td>—</td><td>2</td><td>3</td></tr>
            <tr><td>3</td><td>12</td><td>4</td><td>4</td></tr>
            <tr><td>4</td><td>—</td><td>6</td><td>5</td></tr>
            <tr><td>5</td><td>—</td><td>10</td><td>6</td></tr>
          </tbody>
        </table>
        <h3>Light Art Formulas</h3>
        <p><strong>Light Art Save DC:</strong> 8 + your Light Release class-mod level + your proficiency bonus.</p>
        <p><strong>Light Art Attack Bonus:</strong> twice your proficiency bonus + your Light Release class-mod level.</p>
