system:
  description:
    value: >-
      <h3>Malefic Ninjutsu</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Malefic Art</dd><dt>Casting
      Time:</dt><dd>When casting Uchiha Ember Bullet or Uchiha Flame Ball</dd><dt>Range:</dt><dd>As the empowered
      Jutsu</dd><dt>Duration:</dt><dd>1 minute</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>9 Chakra and 3 Burn;
      Mastered: 7 Chakra and 2 Burn</dd><dt>Keywords:</dt><dd>Ninjutsu, Clash, Malefic,
      Fire</dd></dl><h3>Description:</h3><p>Empower @UUID[Compendium.n5eb.clan.Item.ZtcNZR7IbdJrtGpQ]{Uchiha Ember
      Bullet} or @UUID[Compendium.n5eb.clan.Item.1sLLXmqc5FJ3rLzv]{Uchiha Flame Ball} and add the Malefic keyword. A
      creature damaged by the Jutsu or that fails its saving throw gains Burned for 1 minute. The Jutsu always deals
      maximum damage, its flames cannot be extinguished, and it ignores resistance, immunity, and the Burned rank
      limit.</p><p>If you do not know the two named Jutsu, you may learn them, but may cast them only as Malefic
      Arts.</p>
