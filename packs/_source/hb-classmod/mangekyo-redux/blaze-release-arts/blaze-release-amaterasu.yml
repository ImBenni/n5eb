system:
  description:
    value: >-
      <h3>Blaze Release Ninjutsu</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Blaze Release
      Art</dd><dt>Casting Time:</dt><dd>1 Action</dd><dt>Range:</dt><dd>60
      feet</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>D-rank 4 Chakra, +3
      Chakra per rank; Malefic casting also pays Amaterasu (9 Chakra and 3 Burn)</dd><dt>Keywords:</dt><dd>Ninjutsu,
      Blaze Release, Fire, Malefic</dd></dl><h3>Description:</h3><p>Choose a creature within 60 feet. It makes a
      Dexterity save. On failure, it takes 3d10 + 3 Fire damage and gains 1 rank of Burned; on success, it takes half
      damage and gains no Burned. A target without Chakra Sight takes a -2 penalty to the save. Each rank above D adds 3
      Chakra, 3d10 + 3 damage, and 1 Burned rank.</p>
