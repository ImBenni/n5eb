system:
  description:
    value: >-
      <h3>Blaze Release Ninjutsu</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Blaze Release
      Art</dd><dt>Casting Time:</dt><dd>1 Action</dd><dt>Range:</dt><dd>30 feet; 60-foot
      line</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>D-rank 4 Chakra, +3
      Chakra per rank; Malefic casting also pays Amaterasu (9 Chakra and 3 Burn)</dd><dt>Keywords:</dt><dd>Ninjutsu,
      Blaze Release, Fire, Malefic</dd></dl><h3>Description:</h3><p>Choose a point on a solid surface within 30 feet and
      draw a continuous 60-foot line through visible spaces that remain in contact with a solid surface. Creatures in
      the line, that start there, or that move into it make a Constitution save, taking 4d12 Fire damage and 2 Burned
      ranks on failure, or half damage and no Burned on success. Duration is Instant.</p><p>Each rank above D adds 3
      Chakra and reduces damage by 2d12: C-rank 2d12; B-, A-, and S-rank 0 damage.</p>
