  description:
    value: >-
      <h3>Blaze Release Ninjutsu</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Blaze Release
      Art</dd><dt>Casting Time:</dt><dd>1 Action</dd><dt>Range:</dt><dd>Self; 20-foot by 10-foot
      line</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>D-rank 4 Chakra, +3
      Chakra per rank; Malefic casting also pays Amaterasu (9 Chakra and 3 Burn)</dd><dt>Keywords:</dt><dd>Ninjutsu,
      Blaze Release, Fire, Malefic</dd></dl><h3>Description:</h3><p>Make one Malefic attack against each creature in a
      20-foot-long, 10-foot-wide line originating from you. On a hit, deal 2d10 Fire damage and inflict 1 Burned rank.
      Each rank above D adds 3 Chakra, 2d10 damage, and 1 Burned rank.</p>
