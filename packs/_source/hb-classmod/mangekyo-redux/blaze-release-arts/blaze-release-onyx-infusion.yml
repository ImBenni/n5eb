    value: >-
      <h3>Blaze Release Ninjutsu</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Blaze Release
      Art</dd><dt>Casting Time:</dt><dd>1 Bonus Action</dd><dt>Range:</dt><dd>Self</dd><dt>Duration:</dt><dd>Until the
      start/end of your next turn</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>D-rank 4 Chakra, +3 Chakra per
      rank; Malefic casting also pays Amaterasu (9 Chakra and 3 Burn)</dd><dt>Keywords:</dt><dd>Ninjutsu, Blaze Release,
      Fire, Malefic</dd></dl><h3>Description:</h3><p>As a bonus action, empower the next Fire Jutsu you cast before the
      end of your turn. It deals 2d8 additional Fire damage once. Each rank above D adds 3 Chakra and another 2d8
