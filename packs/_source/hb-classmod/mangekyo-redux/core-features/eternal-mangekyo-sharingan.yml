system:
  description:
    value: >-
      <p>At class-mod level 3, implant the eyes of a deceased Mangekyo Sharingan bearer. Set Darkness to 0 and do not
      gain Darkness again. You may remove Burn at every rest instead of only once between rest types. If Burn exceeds
      twice your threshold, Mangekyo Sharingan automatically deactivates and cannot activate until Burn is below twice
      the threshold.</p><p>The level-3 Awakening increase is already included in the Awakening tracker progression.</p>
