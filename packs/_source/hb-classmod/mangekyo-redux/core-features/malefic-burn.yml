img: systems/n5eb/assets/content/classmod-icons/mangekyo-redux/mangekyo-redux-eye.webp
system:
  description:
    value: >-
      <p>Malefic Arts and Talents add their listed Burn by consuming this tracker; Foundry records current Burn as spent
      uses. Your Burn threshold is 10/15/20/25/30 at class-mod levels 1–5, increased by Malefic Prodigy. After a Short
      Rest, reduce Burn by your Constitution as written in the source. Once between Long Rests, a Long Rest can halve
      current Burn; a Full Rest removes all Burn.</p><p>If Burn exceeds the threshold, it cannot be reduced until a Full
      Rest. At that Full Rest, subtract the threshold, add half the remaining Burn to Darkness (round down), then remove
      all remaining Burn. Before Eternal Mangekyo, the extra 200 points on this tracker permit overflow to be recorded
      without truncation; the threshold, not this display maximum, is the rules limit.</p>
    chat: ""
  source:
    custom: Mangekyo Redux
    book: Homebrew
    page: Homebrewery 2
    license: ""
    rules: n5eb
  uses:
    max: >-
      (5 + 5 * @classmods.mangekyo-redux.levels) + 200 * (1 - min(1, max(0, @classmods.mangekyo-redux.levels - 2))) + (5
      + 5 * @classmods.mangekyo-redux.levels) * min(1, max(0, @classmods.mangekyo-redux.levels - 2))
