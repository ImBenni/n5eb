system:
  description:
    value: >-
      <p>As a bonus action, activate your Mangekyo Sharingan for up to 10 minutes. You retain the benefits of the
      Sharingan clan feature and can maintain this feature for a total of 1 hour per Long Rest. Your Malefic Arts and
      Talents require it to be active. When gained, choose one additional Sharingan ability from each of the 1-Tomoe,
      2-Tomoe, and 3-Tomoe lists. Every Sharingan ability you possess gains 2 additional uses.</p>
