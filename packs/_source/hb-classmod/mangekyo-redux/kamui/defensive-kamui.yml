    value: >-
      <p>As a reaction when targeted, damaged, or forced to save by an effect other than Genjutsu, pay Kamui's cost and
      make a Malefic attack against the triggering attack roll or save DC. On success you are unharmed. Pay again for
      each damage instance or continue the defense on your next turn. Attacks made from inside Kamui can still affect
      you.</p>
