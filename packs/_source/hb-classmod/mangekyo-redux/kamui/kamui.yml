    value: >-
      <h3>Malefic Ninjutsu</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Malefic Art</dd><dt>Casting
      Time:</dt><dd>1
      Action</dd><dt>Range:</dt><dd>Self</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>15
      Chakra and 2 Burn; Mastered: 13 Chakra and 1 Burn</dd><dt>Keywords:</dt><dd>Ninjutsu, Space-Time,
      Malefic</dd></dl><h3>Description:</h3><p>Create a personal pocket dimension that is a sphere 500 feet in diameter.
