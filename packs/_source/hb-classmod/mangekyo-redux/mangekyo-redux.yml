system:
  description:
    value: |2-

        <h2>Mangekyo Redux</h2>
        <p>This homebrew class mod represents the Mangekyo Sharingan as a five-level Awakening-driven progression. It is
        imported from Kuma1562's Mangekyo Redux Homebrewery document. The optional Six Tomoe Rinnegan section is intentionally
        not part of this tree.</p>
        <h3>Progression</h3>
        <table>
          <thead><tr><th>Class-Mod Level</th><th>Minimum Character Level</th><th>Awakening</th><th>Burn Threshold</th></tr></thead>
          <tbody>
            <tr><td>1</td><td>8</td><td>40</td><td>10</td></tr>
            <tr><td>2</td><td>10</td><td>80</td><td>15</td></tr>
            <tr><td>3</td><td>13</td><td>110</td><td>20</td></tr>
            <tr><td>4</td><td>15</td><td>140</td><td>25</td></tr>
            <tr><td>5</td><td>18</td><td>170</td><td>30</td></tr>
          </tbody>
        </table>
        <h3>Malefic Formulas</h3>
        <p><strong>Malefic Save DC:</strong> 12 + your Mangekyo Redux class-mod level + your proficiency bonus.</p>
        <p><strong>Malefic Attack Bonus:</strong> twice your proficiency bonus + your Mangekyo Redux class-mod level.</p>
        <h3>Source</h3>
        <p><a href="https://homebrewery.naturalcrit.com/share/xm4qei8Gm6lD">Mangekyo Redux on Homebrewery</a>.</p>
