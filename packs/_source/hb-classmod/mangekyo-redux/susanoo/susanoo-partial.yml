system:
  description:
    value: >-
      <h3>Malefic Ninjutsu</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Susanoo Art</dd><dt>Casting
      Time:</dt><dd>1 Bonus Action</dd><dt>Range:</dt><dd>Self</dd><dt>Duration:</dt><dd>1
      minute</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>16 Chakra and 4
      Burn</dd><dt>Keywords:</dt><dd>Ninjutsu, Malefic, Susanoo</dd></dl><h3>Description:</h3><p>Manifest this Susanoo
      form for 1 minute. It has 80 Hit Points, Damage Reduction 15, and Damage Threshold 15, and increases you by 2 size
      categories. Its Hit Points coexist with temporary Hit Points, and damage dealt to them does not count as damage to
      you. Apply its Damage Threshold after Damage Reduction and resistance; condition damage ignores the
      threshold.</p><p>As a bonus action, restore half its maximum Hit Points for half the activation Chakra and Burn
      costs, rounding each cost down.</p>
