system:
  description:
    value: >-
      <h3>Malefic Ninshou</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Malefic Art</dd><dt>Casting
      Time:</dt><dd>1 Bonus Action</dd><dt>Range:</dt><dd>5 feet</dd><dt>Duration:</dt><dd>1
      minute</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>9 Chakra and 3 Burn; Mastered: 7 Chakra and 2
      Burn</dd><dt>Keywords:</dt><dd>Ninshou, Weapon, Malefic</dd></dl><h3>Description:</h3><p>Bond any number of
      unattended weapons within 5 feet. As an action for 1 minute, make a Malefic Assault with the cluster: it deals 1d6
      plus 1d6 per bonded weapon, to a maximum of 10d6, using the majority damage type among Bludgeoning, Piercing, and
      Slashing. It is a Heavy, Reach 5 weapon attack made with your Malefic attack bonus and is not a Jutsu
      component.</p>
