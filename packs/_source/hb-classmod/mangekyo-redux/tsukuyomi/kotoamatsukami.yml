system:
  description:
    value: >-
      <h3>Malefic Genjutsu</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Tsukuyomi
      Talent</dd><dt>Casting Time:</dt><dd>1 Action</dd><dt>Range:</dt><dd>30 feet; eye
      contact</dd><dt>Duration:</dt><dd>Until changed by a successful weekly
      save</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>30 Chakra and 10
      Burn</dd><dt>Keywords:</dt><dd>Genjutsu, Visual, Unaware, Malefic</dd></dl><h3>Description:</h3><p>A creature that
      makes eye contact makes a Wisdom save against your Malefic Save DC plus your class-mod level. On failure,
      permanently rewrite one fact or memory in no more than 50 words. If confronted with evidence that contradicts it,
      the target receives one new save each week. Otherwise the effect is undetectable and unending.</p>
