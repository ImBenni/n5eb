system:
  description:
    value: >-
      <h3>Malefic Genjutsu</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Malefic Art</dd><dt>Casting
      Time:</dt><dd>1 Action</dd><dt>Range:</dt><dd>60 feet; eye contact</dd><dt>Duration:</dt><dd>Until the end of your
      turn</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>14 Chakra and 3 Burn; Mastered: 12 Chakra and 2
      Burn</dd><dt>Keywords:</dt><dd>Genjutsu, Visual, Malefic</dd></dl><h3>Description:</h3><p>A creature within range
      that makes eye contact makes a Wisdom save with disadvantage unless it has Chakra Sight. On failure, trap it
      within an illusion for 4d12 perceived mental years, ending at the end of your turn. You may torture it for 1d8
      Psychic damage per perceived year; it is Weakened until a Long Rest, and doing so doubles this Art's Burn
      cost.</p>
