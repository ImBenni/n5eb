system:
  description:
    value: >-
      <h2>Back Up Bodies</h2><p>At 3rd level, create a one-to-one duplicate body and tether it to yourself. The process
      takes 15 weeks of downtime and successful DC 25 Medicine and Craft checks, followed by a special Fuinjutsu. The
      empty body requires a containment device costing 100 Ryo per week.</p><h3>Body Transfer</h3><p>One minute after
      you die, the seal begins transferring your mind and soul. After 24 hours, you revive in the body with 3 ranks of
      Exhaustion and half your Genetic Degradation, but otherwise full health and chakra.</p>
