system:
  description:
    value: >-
      <h2>DNA Manipulation</h2><p>Starting at 1st level, your DNA Points enable modifications to your cellular structure
      and power Genetic Arts. You begin with at most 2 Modification Slots and 1 Genetic Art Slot; you do not have to
      fill every slot. The class-mod progression grants more slots.</p><h3>Unallocated DNA Points</h3><ul><li>Spend 1
      DNA Point to regain 1 point of a point-based clan resource.</li><li>Spend 2 DNA Points to regain 1 die of a
      die-based clan resource.</li><li>Spend 3 DNA Points to regain one use of a limited-use clan
      feature.</li></ul><p>DNA Points spent on these refreshes return at the conclusion of a Long Rest.</p>
