system:
  description:
    value: >-
      <h2>DNA Points</h2><p>You have DNA Points equal to 10 times your Master Geneticist level. They fund Genetic
      Modifications and Genetic Arts, and any unallocated points can refresh clan resources or limited-use clan
      features.</p><p>The tracker records both permanent allocation and temporary spending. After a Long Rest, restore
      only DNA Points spent on refreshes or Hijutsu Genius; keep the costs of installed Modifications and learned
      Genetic Arts spent.</p>
