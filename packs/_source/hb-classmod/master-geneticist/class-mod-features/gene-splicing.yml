system:
  description:
    value: >-
      <h2>Gene Splicing</h2><p>Beginning at 2nd level, spend 10 minutes obtaining DNA from a willing or incapacitated
      creature and store it in a vial. If its clan is unknown, learn it over a Short Rest.</p><h3>Create a
      Serum</h3><p>Spend one week of downtime researching and preparing the DNA. Make DC 15 Investigation, Medicine, and
      Craft checks. Succeeding all three creates a one-use injectable serum and destroys the stored DNA.</p><h3>Inject
      the Serum</h3><p>As an Action, make a DC 25 Constitution ability check. Reduce the DC by 5 for each serum-creation
      check that succeeded by 5 or more. On success, gain 10 points to distribute as though you gained that clan's
      Latent Bloodline feat. On failure, gain 10 Genetic Degradation.</p><p>You may splice a clan already present to
      gain another 6 points in its latent abilities, at most a number of times equal to your class-mod level. A serum is
      inert in another creature. After successfully using one creature's DNA, you must find another member of that clan
      for a future splice.</p>
