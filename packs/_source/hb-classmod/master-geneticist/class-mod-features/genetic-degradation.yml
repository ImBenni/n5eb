system:
  description:
    value: >-
      <h2>Genetic Degradation</h2><p>Your DNA tampering has led to potential issues as your body rejects itself.
      Installed Genetic Modifications increase your minimum Degradation; you can never reduce the tracker below that
      minimum.</p><h3>Recovery</h3><p>At the end of a Long Rest, make a DC 20 Constitution ability check. On a success,
      reduce Degradation by 1d4 + 1. If you fail by 10 or more, increase it by 3. If you have non-passive Degradation
      and choose not to attempt this check, it increases by 1. A week of downtime reduces it by 1d6 +
      5.</p><h3>Thresholds</h3><table><thead><tr><th>Amount</th><th>Effect</th></tr></thead><tbody><tr><td>10</td><td>Hijutsu
      costs increase by rank: D 1, C 2, B 3, A 4, S 5.</td></tr><tr><td>20</td><td>Whenever you gain Degradation, add 2;
      this becomes 5 at 50. Passive Modifications are exempt.</td></tr><tr><td>30</td><td>Lose Genetic Superiority's
      speed bonus and damage reduction.</td></tr><tr><td>40</td><td>Perception and Investigation rolls have
      disadvantage.</td></tr><tr><td>50</td><td>Hijutsu costs are doubled instead of the 10-point increase; DNA Points
      cannot refresh clan resources or features.</td></tr><tr><td>60</td><td>Gain the Monstrosity type; automatically
      fail Persuasion and Deception checks and gain advantage on Intimidation.</td></tr><tr><td>70</td><td>Lose all
      Genetic Superiority benefits.</td></tr><tr><td>80</td><td>Lose half maximum DNA Points; unfunded Modifications
      become inert until this threshold is healed.</td></tr><tr><td>90</td><td>Take 1d8 irreducible necrotic damage
      every turn you physically push yourself, such as in combat, and may spend downtime only on
      Degradation.</td></tr><tr><td>100</td><td>Resolve the source's DC 25 Constitution check and permanent outcome with
      the GM.</td></tr></tbody></table>
