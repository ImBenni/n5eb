system:
  description:
    value: >-
      <h2>Genetic Superiority</h2><p>Also at 1st level, you have artificially made yourself the peak of
      physicality.</p><ul><li>While not wearing armor, your AC becomes 10 + your Dexterity or Intelligence modifier +
      your Master Geneticist level + your proficiency bonus.</li><li>Your movement speed increases by 10 feet for each
      class-mod level.</li><li>You reduce all incoming damage by your class-mod level.</li><li>Your unarmed damage
      becomes 1d6 if it was not already higher, increasing one step after each level: d6, d8, d10, d12, 2d8.</li></ul>
