system:
  description:
    value: >-
      <h2>Hijutsu Genius</h2><p>Starting at 4th level, a Gene Splice may instead become a Jutsu Splice that does not
      count against your normal limit. It teaches that clan's Hijutsu rather than granting normal Gene Splice benefits.
      Clans with branch families require one Jutsu Splice for each branch.</p><h3>Supplementing
      Requirements</h3><p>Spend 1 DNA Point to fulfill a required feature for one casting. If the requirement is a
      resource pool, each DNA Point counts as two units. This cannot supplement a feature whose duration is required.
      These temporarily spent DNA Points return after a Long Rest.</p>
