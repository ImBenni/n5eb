  description:
    value: >-
      <h2>Implanted Knowledge</h2><p>Also at 3rd level, when creating a Splice you may instead make an Information
      Splice. On use, it grants one Jutsu and one skill proficiency known by the DNA donor. You must meet all
      prerequisites for the Jutsu.</p><p>You can have active Information Splices equal to your Master Geneticist level.
      If you exceed the maximum, choose a previous Information Splice whose benefits are lost.</p>
