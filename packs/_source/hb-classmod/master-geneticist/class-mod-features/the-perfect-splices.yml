    value: >-
      <h2>The Perfect Splices</h2><p>At 5th level, choose two clans. If they are already among your Gene Splices, you
      immediately gain this feature's benefits. Otherwise, create two more Splices using the normal rules. You gain the
      full benefits of both clans as if naturally part of them, permanently. They do not count against your maximum Gene
      Splices.</p>
