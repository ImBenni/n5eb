    value: >-
      <h2>Hijutsu Breaker</h2><p><strong>DNA Point Cost:</strong> 5<br><strong>Genetic Degradation:</strong>
      1<br><strong>Casting Time:</strong> 1 Reaction, when targeted or forced to save by a
      Hijutsu<br><strong>Range:</strong> Self<br><strong>Duration:</strong> Instant</p><p>Make an Intelligence or
      Constitution ability check against DC 13 + the Jutsu's rank. On success, negate the Hijutsu's effects and absorb
      its chakra into a prepared container. The container counts as DNA for creating a Jutsu Splice.</p>
