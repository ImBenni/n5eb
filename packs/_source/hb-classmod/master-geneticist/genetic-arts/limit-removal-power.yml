  description:
    value: >-
      <h2>Limit Removal: Power</h2><p><strong>DNA Point Cost:</strong> 4<br><strong>Genetic Degradation:</strong>
      2<br><strong>Casting Time:</strong> 1 Bonus Action<br><strong>Range:</strong> Self<br><strong>Duration:</strong> 1
      Round</p><p>The next melee attack you make before the end of your next turn deals maximum damage. After the
      attack, gain 3 ranks of Weakened until completing a Long Rest. A non-chakra-enhanced weapon used in the attack
      shatters.</p><p><strong>Limit Breaker:</strong> Incur 3 additional Degradation to activate as part of the same
      action used to attack.</p>
