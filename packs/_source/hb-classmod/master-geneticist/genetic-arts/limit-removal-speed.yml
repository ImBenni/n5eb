system:
  description:
    value: >-
      <h2>Limit Removal: Speed</h2><p><strong>DNA Point Cost:</strong> 4<br><strong>Genetic Degradation:</strong>
      2<br><strong>Casting Time:</strong> 1 Bonus Action<br><strong>Range:</strong> Self<br><strong>Duration:</strong> 1
      Minute</p><p>At the end of each turn, roll 1d20. On 10 or higher, you cannot be targeted by effects or attacks
      until the start of your next turn. When you move on your turn, you may teleport to the destination
      instead.</p><p><strong>Limit Breaker:</strong> Once per turn, incur 3 additional Degradation to teleport anywhere
      within your movement speed without using movement.</p>
