system:
  description:
    value: >-
      <h2>Limit Removal: Spliced Vision</h2><p><strong>DNA Point Cost:</strong> 6<br><strong>Genetic
      Degradation:</strong> 2<br><strong>Casting Time:</strong> 1 Bonus Action<br><strong>Range:</strong>
      Self<br><strong>Duration:</strong> 1 Minute</p><p>While active, automatically know the Clan or Species of any
      creature within 60 feet and whether it has cellular modifications. This does not work on
      Constructs.</p><p><strong>Limit Breaker:</strong> Alternatively incur 4 Degradation to also see a creature's Clan,
      Class, Role, and Hit or Chakra Points.</p>
