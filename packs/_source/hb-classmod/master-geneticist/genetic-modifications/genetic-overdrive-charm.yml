    value: >-
      <h2>Genetic Overdrive: Charm</h2><p><strong>DNA Point Cost:</strong> 6<br><strong>Base Genetic
      Degradation:</strong> 3</p><p>Your personal magnetism is enhanced beyond normal human limitations.</p><ul><li>You
      and allies within 10 feet have advantage against Charmed, Fear, Berserk, and Maddened; the range becomes 30 feet
      at level 3.</li><li>Any creature within 30 feet gains Genetic Superiority's speed increase and damage
      reduction.</li><li>Your Charisma score increases by 2, becoming 4 at class-mod level 4.</li></ul>
