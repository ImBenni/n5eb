    value: >-
      <h2>Genetic Overdrive: Cunning</h2><p><strong>DNA Point Cost:</strong> 6<br><strong>Base Genetic
      Degradation:</strong> 3</p><p>Your mental processing is enhanced beyond normal human limitations.</p><ul><li>Twice
      per Long Rest, force a creature that passes a save against your Jutsu or Art to reroll and take the new
      result.</li><li>You can concentrate on one additional Jutsu.</li><li>Your Intelligence score increases by 2,
      becoming 4 at level 4.</li></ul>
