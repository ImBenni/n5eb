    value: >-
      <h2>Genetic Overdrive: Endurance</h2><p><strong>DNA Point Cost:</strong> 6<br><strong>Base Genetic
      Degradation:</strong> 3</p><p>Your endurance is enhanced beyond normal human limitations.</p><ul><li>Reduce all
      incoming damage by 5.</li><li>Once per Long Rest, when reduced to 0 Hit Points, stop at 1 and cannot fall below 1
      until the start of your next turn.</li><li>Your Constitution score increases by 2, becoming 4 at level
      4.</li></ul>
