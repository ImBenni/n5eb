    value: >-
      <h2>Genetic Overdrive: Grace</h2><p><strong>DNA Point Cost:</strong> 6<br><strong>Base Genetic
      Degradation:</strong> 3</p><p>Your speed and agility are enhanced beyond normal human limitations.</p><ul><li>Your
      speed is doubled, becoming tripled at class-mod level 3. This stacks with other multipliers.</li><li>As a Bonus
