      Degradation:</strong> 3</p><p>Your physical strength is enhanced beyond normal human
      limitations.</p><ul><li>Double maximum bulk and lifting capacity; triple them at class-mod level
      3.</li><li>Increase unarmed damage by one die and use unarmed damage instead of weapon damage for weapon attacks
      and Bukijutsu.</li><li>Your Strength score increases by 2, becoming 4 at level 4.</li></ul>
