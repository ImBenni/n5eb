  description:
    value: >-
      <h2>Genetic Overdrive: Splendor</h2><p><strong>DNA Point Cost:</strong> 6<br><strong>Base Genetic
      Degradation:</strong> 3</p><p>Your senses are enhanced beyond normal human limitations.</p><ul><li>Gain 200 feet
      of Chakra Sight, becoming 500 feet at level 3 and 1,000 feet at level 5.</li><li>Gain expertise in Perception and
      Insight; if already expert, add 1d6 to checks with that skill instead.</li><li>Your Wisdom score increases by 2,
      becoming 4 at level 4.</li></ul>
