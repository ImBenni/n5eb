    value: >-
      <h2>Monstrous Splices</h2><p><strong>DNA Point Cost:</strong> 6<br><strong>Base Genetic Degradation:</strong>
      4</p><p>You may create a Creature Splice from a non-clan creature. It occupies a Gene Splice Slot. When injected,
      gain one Species Adversary Trait the donor possessed, chosen by the GM. You cannot create a Creature Splice from
      an adversary that has a clan.</p>
