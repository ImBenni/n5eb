system:
  description:
    value: >-
      <h2>Gene Splices (Legacy Latent)</h2><p>This optional rule replaces the current Gene Splicing reward. Follow the
      same DNA collection, one-week preparation, three DC 15 checks, and DC 25 Constitution injection check.</p><p>On
      success, gain the benefits of that clan's Bloodline, Latent feat. You may have 2 Gene Splices at level 2, 4 at
      level 3, and 5 at levels 4 and 5. A second splice of the same clan grants no immediate benefit; the third grants
      the Bloodline, Realized benefits. Serum remains inert in another creature, and a successful donor cannot be
      reused.</p>
