system:
  description:
    value: >-
      <h2>Master Geneticist</h2><p>Geneticists seek to enhance their physical form until body and mind become a perfect
      specimen.</p><h3>Becoming a Master Geneticist</h3><ul><li><strong>Genetic Study:</strong> Spend one week of
      downtime and succeed on a DC 25 Intelligence ability check. Each additional week grants
      +1.</li><li><strong>Physical Training:</strong> Spend one week of downtime and succeed on a DC 25 Constitution
      ability check. Each additional week grants +1.</li><li><strong>Genetic Makeup Modification:</strong> During a Full
      Rest, succeed on a DC 30 Medicine check. Performing it on yourself imposes disadvantage and prevents benefits from
      Jutsu or features.</li></ul><p>Completing all three tasks grants level 1.</p><h3>Leveling
      Up</h3><ul><li><strong>DNA Research:</strong> Spend one week and make a DC 25 Intelligence (Investigation) or
      Intelligence (Craft) check.</li><li><strong>Extreme Conditioning:</strong> Spend one week and make a DC 25
      Dexterity (Acrobatics) or Strength (Athletics) check. Training in extreme conditions grants
      +5.</li><li><strong>Genetic Integration:</strong> During a Long Rest, make a DC 25 Medicine check. Failure
      requires repeating the other two tasks and gives 10 + five times the attempted class-mod level in Degradation.
      Success grants the next level and reduces Degradation to its minimum.</li></ul><p>Level 3 requires a special Sage
      Beast splice. Level 5 requires a special Celestial or Demon
      splice.</p><h3>Progression</h3><table><thead><tr><th>Level</th><th>Minimum Character Level</th><th>Gene
      Splices</th><th>Modifications</th><th>Arts</th><th>DNA
      Points</th><th>Features</th></tr></thead><tbody><tr><td>1</td><td>11</td><td>-</td><td>2</td><td>1</td><td>10</td><td>DNA
      Manipulation, Genetic Superiority, Genetic
      Degradation</td></tr><tr><td>2</td><td>13</td><td>2</td><td>2</td><td>2</td><td>20</td><td>Gene Splicing, Genetic
      Refresh</td></tr><tr><td>3</td><td>15</td><td>4</td><td>3</td><td>2</td><td>30</td><td>Back Up Bodies, Implanted
      Knowledge</td></tr><tr><td>4</td><td>17</td><td>5</td><td>3</td><td>3</td><td>40</td><td>Hijutsu
      Genius</td></tr><tr><td>5</td><td>19</td><td>5</td><td>4</td><td>4</td><td>50</td><td>The Perfect
      Splices</td></tr></tbody></table>
