system:
  description:
    value: >-
      <h2>Black Receiver Tanto</h2><p>This Chakra-enhanced tanto is a summoned Black Receiver. You are proficient with
      it; it is unbreakable and cannot be used by a creature without the Rinnegan. On a damage hit you may impale the
      target. It makes a Constitution save against Divine Art DC; on failure it cannot Mold Chakra until another
      creature removes the receiver with a Strength (Athletics) check against that DC.</p>
