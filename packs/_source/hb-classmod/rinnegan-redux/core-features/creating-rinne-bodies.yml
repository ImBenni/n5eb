system:
  description:
    value: >-
      <h2>Creating Rinne Bodies</h2><p>Spend 6 Divine Awakening and permanently reduce maximum Hit Points by 10 to make
      a Tier 1 Rinne Body during a Full Rest. You may have at most six. Invest another 6 Divine Awakening per tier;
      bodies may be no more than one rank apart and all bodies must reach Tier 2 before any reaches Tier 3. Invested
      Divine Awakening is doubled for that body's own-Path Talents.</p><p>During a Full Rest create or repair bodies,
      reclaim invested power, or downrank within the constraints. Unmade bodies crumble and restored investment returns
      maximum Hit Points and Awakening.</p>
