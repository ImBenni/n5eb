system:
  description:
    value: >-
      <h2>Rinne Bodies</h2><p>At 2nd level, during a Full Rest convert a dead humanoid into a Rinne Body. Assign
      physical scores 18, 16, and 14; it shares your mental scores. A body has one unique six-Path assignment, gains one
      Art from that Path without cost, can use only Arts of its Path, and has a Black Receiver and linked
      vision.</p><p>Its level is twice your class-mod level plus body rank; it has d10 Hit Dice, one Chakra Die, 10 +
      Constitution modifier Hit Points and one Chakra Die per body level, and 30-foot speed. Command up to two bodies
      with your Action and Bonus Action together. Otherwise they only move toward you or a preassigned lead.</p>
