system:
  description:
    value: >-
      <h2>Rinne Body Construction</h2><p>Use this reference to build each corpse-dependent Rinne Body: body level =
      twice Rinnegan class-mod level + body rank; d10 Hit Dice; 10 + Constitution modifier Hit Points and one Chakra Die
      per body level; speed 30 feet; physical scores 18, 16, 14 assigned as desired; mental scores copied from the
      creator; one unique Path and one free Art of that Path; only its Path's Arts and Talents;</p><p>Black Receiver and
      linked vision. The source defines no single fixed corpse, Path, tier, or talent loadout, so the GM creates an
      isolated helper Actor for each body.</p>
