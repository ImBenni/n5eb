  description:
    value: >-
      <h2>Almighty Charge</h2><p>When activating Almighty Push, enhance it by paying an additional Chakra Die, stepping
      d4, d6, d8, d10, then d12 for successive enhancements. Each enhancement doubles radius and knockback and adds one
      turn to the cooldown; the doubling compounds. After d12, further enhancements can only increase radius and
      knockback. Radius and failed-save knockback cap at 1 mile; successful-save knockback caps at 500 feet.</p>
