system:
  description:
    value: >-
      <h2>Chibaku Tensei I</h2><p><strong>Prerequisite:</strong> Universal Pull. As an alternate Universal Pull
      unaffected by other talents unless specified, use an Action and spend 20 Chakra or 2 Chakra Dice to form a black
      sphere 50 feet overhead for 1 minute. Chosen creatures within 100 feet make a Strength save. Failure pulls them
      onto the growing structure and makes them Restrained, Grappled, and Prone.</p><p>At each turn's end, creatures
      that have not failed save again or are pulled in. Starting a turn on the structure deals 12d12 bludgeoning damage
      and permits a Strength save to escape. Starting three consecutive turns Restrained by it causes permanent
      death.</p>
