system:
  description:
    value: >-
      <h2>Demonic Statue</h2><p>When casting Demonic Chains, summon the Gedo Statue for the duration. It is immobile and
      invulnerable. Chakra damage dealt by the chains is stored in it, to a maximum of 200. As an Action withdraw any
      amount up to the stored maximum as temporary Chakra for 1 minute. At 200 stored Chakra its jaws shut and chain
      attacks cease.</p><p>It persists for the Art's duration or until emptied, and cannot be summoned again for 24
      hours.</p>
