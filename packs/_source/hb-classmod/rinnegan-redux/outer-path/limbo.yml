    value: >-
      <h2>Limbo</h2><h3>Divine Art</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Divine
      Art</dd><dt>Casting Time:</dt><dd>Action</dd><dt>Range:</dt><dd>Self</dd><dt>Duration:</dt><dd>Not
      specified</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>20 Chakra or 2 Chakra
      Dice</dd><dt>Keywords:</dt><dd>Divine</dd></dl><h3>Description:</h3><p>As an Action, create two Limbo clones, to a
      maximum of four. They are invisible except to Truesight or the Rinnegan, have one-quarter your maximum Hit Points,
      share your ability scores, proficiencies, Divine attack bonus, and Divine save DC, make two unarmed attacks
      dealing 2d8 + your modifier, and act only when commanded. As a Bonus Action command each clone.</p>
