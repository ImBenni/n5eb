    value: >-
      <h2>Rinne-Rebirth</h2><h3>Divine Art</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Divine
      Art</dd><dt>Casting
      Time:</dt><dd>Action</dd><dt>Range:</dt><dd>Special</dd><dt>Duration:</dt><dd>Instantaneous</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>Special
      maximum-Hit-Point sacrifice</dd><dt>Keywords:</dt><dd>Divine</dd></dl><h3>Description:</h3><p>As an Action, choose
      creatures that died within the last hour and reduce your maximum Hit Points by 10 per target. Each returns with 1
      Hit Point, ignoring effects that prevent revival if its body is present. If this reduces your maximum Hit Points
      to 0, revive every valid creature that died within the last hour within 1 mile and has a body. A target whose
      maximum Hit Points are 0 cannot be revived.</p>
