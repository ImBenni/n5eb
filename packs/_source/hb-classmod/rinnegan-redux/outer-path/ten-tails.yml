system:
  description:
    value: >-
      <h2>Ten Tails</h2><p><strong>Prerequisites:</strong> Demonic Statue and class-mod level 4. Demonic Chains gains +5
      to hit Tailed Beasts and Jinchuriki and treats them as vulnerable. On hit make an unmodified Charisma contest
      against the beast's Charisma - 10; a Jinchuriki adds its Charisma. Failure grants that target 1-minute immunity.
      Success stores the beast in the statue and permanently raises capacity by 100; chains may still attack stored
      beasts.</p><p>A Jinchuriki falls to 0 current Hit Points and 10 maximum Hit Points, cannot heal, and loses 1
      maximum Hit Point per turn until death; A-rank or higher Medical healing stalls the loss and 1 minute restores it.
      Storing nine Tailed Beasts creates the Ten Tails as an ally. Absorbing it removes the Rinnegan class mod and
      grants level 1 Ten Tails Jinchuriki.</p><p>All captures, permanent capacity changes, character loss, and class-mod
      replacement require explicit player and GM confirmation and are never automated.</p>
