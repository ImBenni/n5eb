  description:
    value: >-
      <h2>True Rebirth</h2><p>Before casting Rinne-Rebirth, you may irreversibly sacrifice one Rinnegan eye and treat
      the casting as the zero-maximum-Hit-Point mass revival. You become permanently blind in that eye and your total
      Divine Awakening is halved. Sacrificing both eyes permanently removes this class mod. Each irreversible
      consequence requires explicit player and GM confirmation and is never applied automatically.</p>
