  description:
    value: >-
      <h2>Chakra Barrier</h2><h3>Divine Art</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Divine
      Art</dd><dt>Casting Time:</dt><dd>Bonus Action</dd><dt>Range:</dt><dd>Self</dd><dt>Duration:</dt><dd>1 minute or
      until the first qualifying hit</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>15 Chakra or 2 Chakra
      Dice</dd><dt>Keywords:</dt><dd>Divine</dd></dl><h3>Description:</h3><p>As a Bonus Action for 1 minute, absorb the
      next Ninjutsu or Divine Art that affects you, negate it, and end the barrier. Gain temporary Chakra equal to half
      its cost, usable only for Divine Arts, for 1 minute. If the absorbed Chakra is cursed or sage Chakra, make a
      Constitution save against DC 8 + amount absorbed or become Petrified.</p>
