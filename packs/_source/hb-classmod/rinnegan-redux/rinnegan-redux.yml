system:
  description:
    value: |-
      <h2>Rinnegan Redux</h2>
        <p>A five-level homebrew class mod focused on the six Paths of the Rinnegan, Divine Arts, constructed Rinne Bodies,
        and the forbidden Outer Path.</p>
        <h3>Progression</h3>
        <table><thead><tr><th>Level</th><th>Minimum Character Level</th><th>Divine Awakening</th><th>Features</th></tr></thead><tbody>
          <tr><td>1</td><td>8</td><td>40</td><td>Rinnegan, Divine Arts, Gods Authority, Black Receiver</td></tr>
          <tr><td>2</td><td>10</td><td>60</td><td>Outer Path, Rinne Bodies</td></tr>
          <tr><td>3</td><td>13</td><td>80 + 30 specialized</td><td>Permanent Rinnegan, Path specialization</td></tr>
          <tr><td>4</td><td>15</td><td>100 + 30 specialized</td><td>Rinne Bodies Mastery</td></tr>
          <tr><td>5</td><td>18</td><td>120 + 30 specialized</td><td>Additional Divine Arts</td></tr>
        </tbody></table>
        <h3>Divine Art Formulas</h3>
        <p><strong>Save DC:</strong> 12 + class-mod level + proficiency bonus.</p>
        <p><strong>Attack Bonus:</strong> twice proficiency bonus + class-mod level.</p>
        <h3>Source</h3>
        <p><a href="https://homebrewery.naturalcrit.com/share/xiVnlhppwCCq">Rinnegan Redux on Homebrewery</a>.</p>
