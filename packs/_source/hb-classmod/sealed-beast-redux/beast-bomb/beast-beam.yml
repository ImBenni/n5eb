    value: >-
      <h2>Beast Beam</h2><h3>Vermillion Art</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Vermillion
      Art</dd><dt>Casting Time:</dt><dd>1 Action</dd><dt>Range:</dt><dd>Self; 120-foot-long, 15-foot-wide
      line</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>30 Twisted
      Chakra</dd><dt>Keywords:</dt><dd>Ninjutsu, Vermillion</dd></dl><h3>Description:</h3><p>Requires any Transformation
      Art unless in Desperate Rage. Creatures in a 15-foot-wide, 120-foot-long line make a Dexterity save, taking 16d12
      Force damage on failure or half on success. A creature failing by 5 or more has all non-Chakra-enhanced weapons
      and equipment destroyed. This Art deals four times damage to constructs and structures.</p>
