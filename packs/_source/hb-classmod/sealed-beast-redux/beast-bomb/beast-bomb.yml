  description:
    value: >-
      <h2>Beast Bomb</h2><h3>Vermillion Art</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Vermillion
      Art</dd><dt>Casting Time:</dt><dd>1 Action</dd><dt>Range:</dt><dd>120 feet; 30-foot
      burst</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>30 Twisted
      Chakra</dd><dt>Keywords:</dt><dd>Ninjutsu, Vermillion</dd></dl><h3>Description:</h3><p>Requires a Stage 2 or
      higher Transformation Art unless in Desperate Rage. Make a ranged Vermillion attack against a target within 120
      feet. On hit, deal 20d12 Force damage. Hit or miss, every creature including the target within 30 feet makes a
      Dexterity save, taking 12d12 Force damage on failure or half on success. Constructs and structures take four times
      the damage.</p>
