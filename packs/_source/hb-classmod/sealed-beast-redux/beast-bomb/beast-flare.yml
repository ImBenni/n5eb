    value: >-
      <h2>Beast Flare</h2><h3>Vermillion Art</h3><dl
      class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Vermillion Art</dd><dt>Casting Time:</dt><dd>1
      Action</dd><dt>Range:</dt><dd>Self; 30-foot
      radius</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>20 Twisted
      Chakra</dd><dt>Keywords:</dt><dd>Ninjutsu, Vermillion</dd></dl><h3>Description:</h3><p>Requires any Transformation
      Art unless in Desperate Rage. Creatures within 30 feet make a Constitution save. On failure, a creature takes
      10d12 Force damage, is Blinded and Dazed until the end of its next turn, and is Weakened for 1 minute. The source
      states no successful-save result.</p>
