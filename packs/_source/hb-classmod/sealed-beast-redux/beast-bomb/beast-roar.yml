    value: >-
      <h2>Beast Roar</h2><h3>Vermillion Art</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Vermillion
      Art</dd><dt>Casting Time:</dt><dd>1 Action</dd><dt>Range:</dt><dd>Self; 60-foot
      cone</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>10 Twisted
      Chakra</dd><dt>Keywords:</dt><dd>Ninjutsu, Vermillion</dd></dl><h3>Description:</h3><p>Requires any Transformation
      Art unless in Desperate Rage. Creatures in a 60-foot cone make a Strength save. On failure, they are thrown 90
      feet, fall Prone, and are Dazed until the end of your next turn. If impact with a structure or creature stops that
      movement, both take quadruple falling damage as though falling that distance.</p>
