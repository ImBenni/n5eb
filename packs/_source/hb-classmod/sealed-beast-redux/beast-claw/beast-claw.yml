      <h2>Beast Claw</h2><h3>Vermillion Art</h3><dl class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Vermillion
      Art</dd><dt>Casting Time:</dt><dd>1 Action</dd><dt>Range:</dt><dd>30
      feet</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>10 Twisted
      Chakra</dd><dt>Keywords:</dt><dd>Taijutsu, Vermillion</dd></dl><h3>Description:</h3><p>Requires a Transformation
      Art unless in Desperate Rage. Make a melee Vermillion attack against a creature within 30 feet. On hit, deal 8d12
      Force damage. Until the end of your next turn, either gain advantage on the first attack against it or make its
      first save against your Vermillion Art at disadvantage.</p>
