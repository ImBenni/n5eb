      <h2>Beast Crash</h2><h3>Vermillion Art</h3><dl
      class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Vermillion Art</dd><dt>Casting Time:</dt><dd>1
      Action</dd><dt>Range:</dt><dd>120
