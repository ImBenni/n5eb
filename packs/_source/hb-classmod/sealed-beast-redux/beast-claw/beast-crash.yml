      Chakra</dd><dt>Keywords:</dt><dd>Taijutsu, Vermillion</dd></dl><h3>Description:</h3><p>Requires a Transformation
      Art unless in Desperate Rage. Move up to 120 feet and make a melee Vermillion attack. On hit, deal 30d4 Force
      damage, then the target makes a Strength save; on failure it falls Prone and is Dazed until the end of your next
      turn.</p>
