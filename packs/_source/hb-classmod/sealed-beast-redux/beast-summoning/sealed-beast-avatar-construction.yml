system:
  description:
    value: |-
      <h2>Sealed Beast Avatar Construction</h2>
          <p>Build the summoned avatar with the source's variable choices. It is a Sealed Beast summon with Toughness 18,
          Constitution or Charisma as its defensive ability at GM choice, any three Saving Throws, any four skills, and
          Darkvision 120 feet. Choose Bludgeoning, Piercing, or Slashing for its Chakra-Enhanced natural weapon. Its Chakra
          pool equals its Hit Points; the source does not supply a Hit Point formula.</p>
          <h3>Role</h3>
          <ul>
            <li><strong>Striker:</strong> Multiattack with two natural or held-weapon attacks.</li>
            <li><strong>Caster:</strong> Additional jutsu slots by rank: D/C +1, B/A +2, S +3.</li>
            <li><strong>Controller:</strong> Save DC bonus by rank: D/C +1, B/A +2, S +3.</li>
            <li><strong>Defender:</strong> AC bonus by rank: D/C +1, B/A +2, S +3.</li>
            <li><strong>Lurker:</strong> once per turn, add Xd8 on a hit when another enemy is within 5 feet; X is half level.</li>
            <li><strong>Supporter:</strong> healing and temporary Hit Points gain dice by rank: D/C +1, B/A +2, S +3.</li>
          </ul>
          <h3>Rank Statistics</h3>
          <table><thead><tr><th>Rank</th><th>Level</th><th>Size</th><th>Jutsu</th><th>Speed</th></tr></thead><tbody>
            <tr><td>D</td><td>4</td><td>Medium</td><td>2 D-rank</td><td>50 ft.</td></tr>
            <tr><td>C</td><td>8</td><td>Medium–Large</td><td>2 D or lower, 2 C</td><td>65 ft.</td></tr>
            <tr><td>B</td><td>12</td><td>Medium–Huge</td><td>2 C or lower, 2 B</td><td>80 ft.</td></tr>
            <tr><td>A</td><td>16</td><td>Medium–Gargantuan</td><td>3 B or lower, 1 A</td><td>95 ft.</td></tr>
            <tr><td>S</td><td>20</td><td>Medium–Gargantuan</td><td>3 A or lower, 1 S</td><td>110 ft.</td></tr>
          </tbody></table>
          <p>Base ability scores are all 18. At class-mod levels 1–5, distribute 8 more ability-score points. The listed
          maximums are 24 at level 2, 26 at level 3, 28 at level 4, and 30 at level 5. The avatar can learn non-Hijutsu
          Bukijutsu compatible with its natural-weapon damage type and Taijutsu without nature-release or medical keywords.
          At GM discretion it can use suitable summon traits from Jiraiya's Jutsu Compendium, paying 10 Chakra per required
          jutsu slot.</p>
          <p>The source's rank-specific special-feature names are blank placeholders and therefore grant no additional rule.</p>
