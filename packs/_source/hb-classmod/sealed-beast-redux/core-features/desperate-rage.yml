system:
  description:
    value: >-
      <h2>Desperate Rage</h2><p>When intense emotional trauma occurs, such as an ally dying or falling to 0 Hit Points,
      or when you fall to 0 Hit Points, make a Charisma ability check against DC 12 + your class-mod level. On a failed
      check, enter Frenzy, lose Chakra equal to twice your character level, and gain the same Twisted Chakra.</p><p>You
      can be required to make this check against Frenzy only once per rest and cannot benefit from jutsu, features, or
      traits on it.</p>
