system:
  description:
    value: |-
      <h2>Disposition</h2>
          <p>Disposition measures your relationship with the sealed beast. Features can require a threshold. Actions named by
          the class mod and roleplaying interactions can change it at the GM's discretion: arguing or forcibly withdrawing
          power can lower it, while requesting shared power can raise it.</p>
          <table><thead><tr><th>Score</th><th>Effect</th></tr></thead><tbody>
            <tr><td>100</td><td>You may activate Dormant Beast as a Bonus Action.</td></tr>
            <tr><td>75+</td><td>Add your class-mod level to Desperate Rage checks.</td></tr>
            <tr><td>50+</td><td>You may communicate telepathically with the sealed beast at any time.</td></tr>
            <tr><td>25 or lower</td><td>Subtract your class-mod level from Desperate Rage checks.</td></tr>
            <tr><td>10 or lower</td><td>The sealed beast is unwilling to communicate.</td></tr>
          </tbody></table>
