system:
  description:
    value: >-
      <h2>Dormant Beast</h2><p>As a Bonus Action, activate Dormant Beast for 1 minute. On activation and at the start of
      each turn, lose Chakra equal to your proficiency bonus and gain the same Twisted Chakra. While
      active:</p><ul><li>Increase Strength and Dexterity by 2.</li><li>Your unarmed damage die becomes d8 unless already
      greater.</li><li>Unarmed and weapon attacks count as Chakra enhanced.</li><li>Whenever you deal damage, increase
      its damage die by one step.</li><li>Gain +2 on any save against a jutsu cast by a hostile creature.</li></ul>
