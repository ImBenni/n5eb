system:
  description:
    value: >-
      <h2>Frenzied Drawbacks</h2><p>At the beginning of each turn while Frenzied, make a Wisdom ability check against
      your Desperate Rage DC. On failure, you cannot perceive allies and focus only on the Desperate Rage target; area
      effects affect all creatures in range. Make a free unarmed or natural weapon attack against each creature in the
      most direct path to the target while moving past them; a hit knocks it 20 feet in any direction.</p><p>If
      Desperate Rage did not trigger the Frenzy, the closest creature at the start of the turn is your target.</p>
