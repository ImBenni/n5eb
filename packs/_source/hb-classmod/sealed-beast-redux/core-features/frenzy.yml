system:
  description:
    value: >-
      <h2>Frenzy</h2><p>When you Frenzy, immediately increase current Hit Points by 25; overflow becomes temporary Hit
      Points, and activate Dormant Beast if needed. Chakra lost to gain Twisted Chakra is doubled. If Desperate Rage
      triggered the Frenzy, you must take every possible hostile action against its triggering creature; otherwise, you
      are hostile to every creature.</p><p>If Chakra reaches 0 in Frenzy, the beast consumes you, you die, and it is
      unleashed. Every Twisted Chakra spent during Frenzy also requires the same amount of normal Chakra. At each turn's
      end, make a Charisma check against the Desperate Rage DC. On success halve Twisted Chakra; Frenzy ends if it falls
      below normal Chakra. Frenzied Assault:</p><ul><li>Strength and Dexterity below 18 become 18.</li><li>Gain
      Multiattack (2), making three unarmed attacks instead of the normal attack action.</li><li>Unarmed damage gains
      1d8, increasing by 1d8 at class-mod levels 3 and 5.</li><li>Gain one additional action that must cast a Vermillion
      Art at a hostile creature.</li><li>Movement speed doubles.</li><li>Unarmed critical threat increases by 1, by 2 at
      level 3; at level 4, critical hits deal maximum damage. When Frenzy ends, take irreducible Necrotic damage equal
      to Twisted Chakra removed by the successful check, halved from level 3, and gain 1 + class-mod level ranks of
      Weakened for 1d6 rounds.</li></ul>
