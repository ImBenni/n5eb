system:
  description:
    value: >-
      <h2>Twisted Chakra</h2><p>Twisted Chakra is this class mod's main resource. One Twisted Chakra counts as two
      Chakra for anything you spend Chakra on, and a jutsu cast using Twisted Chakra becomes a Vermillion Art. If your
      current Twisted Chakra is ever higher than your current normal Chakra, you enter Frenzy. The 500-point tracker
      also supports the explicit Path of the Beast pact pool; the source gives no normal recovery or universal
      maximum.</p>
