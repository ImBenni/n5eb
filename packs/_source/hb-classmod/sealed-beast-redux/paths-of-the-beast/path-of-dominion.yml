system:
  description:
    value: >-
      <h2>Path of Dominion</h2><p>At level 2, Dormant Beast gains two Twisted Chakra per Chakra lost, but Twisted Chakra
      counts as only one Chakra and exceeding normal Chakra no longer causes Frenzy. At level 3, do not add class-mod
      level to the Desperate Rage DC. At level 4, lower that DC by class-mod level. At level 5, Dormant Beast instead
      gains four Twisted Chakra per Chakra lost.</p>
