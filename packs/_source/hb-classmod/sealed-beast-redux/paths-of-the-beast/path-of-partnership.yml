system:
  description:
    value: >-
      <h2>Path of Partnership</h2><p>At level 2, at the start of a Dormant Beast turn make a Charisma check against the
      Desperate Rage DC. On success, choose up to 10 times class-mod level normal Chakra for the beast; it grants equal
      Twisted Chakra. On failure, lose the normal Dormant Beast amount. Frenzy no longer requires matching normal Chakra
      when spending Twisted Chakra. At level 3 the beast grants twice as much Twisted Chakra on success.</p><p>At level
      4, do not add sealed-beast level to the Desperate Rage DC. At level 5 no check is required to share Chakra.</p>
