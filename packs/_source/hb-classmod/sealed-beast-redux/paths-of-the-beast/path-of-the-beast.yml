system:
  description:
    value: >-
      <h2>Path of the Beast</h2><p>At level 2, as a Bonus Action make a Constitution check against the Desperate Rage
      DC. On success, gain Twisted Chakra equal to ten times class-mod level, remove effects preventing Chakra molding,
      and heal by the Twisted Chakra gained; failure causes Frenzy. At level 3 failure no longer causes Frenzy. At level
      4, you may fight the beast alone in your inner world.</p><p>Reducing it to half Hit Points or forcing surrender
      makes Dormant Beast gain four Twisted Chakra per Chakra lost; failure kills you. At level 5, after defeating it,
      you may offer a pact of trust. If accepted at GM discretion, you cannot Frenzy, Dormant Beast stops draining
      Chakra, and grants access to a pool of 500 Twisted Chakra. You may offer again after refusal.</p>
