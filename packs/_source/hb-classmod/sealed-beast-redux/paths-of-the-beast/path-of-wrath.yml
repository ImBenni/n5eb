    value: >-
      <h2>Path of Wrath</h2><p>At level 2, Dormant Beast gains two Twisted Chakra per Chakra lost. Reaching 0 Chakra
      during Frenzy no longer kills you, but reaching 0 Hit Points during Frenzy releases the beast and kills you. The
      exchange multiplier becomes three at level 3, four at level 4, and five at level 5.</p>
