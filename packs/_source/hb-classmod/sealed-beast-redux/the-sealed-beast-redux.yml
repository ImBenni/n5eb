system:
  description:
    value: |-
      <h2>The Sealed Beast Redux</h2>
        <p>A five-level homebrew class mod about drawing power from a sealed Chakra beast, risking Frenzy, choosing a path
        of Dominion, Wrath, Partnership, or the Beast, and buying Vermillion Arts and passives with Twisted Awakening.</p>
        <h3>Progression</h3>
        <table><thead><tr><th>Level</th><th>Character Level</th><th>Twisted Awakening</th><th>Features</th></tr></thead><tbody>
          <tr><td>1</td><td>4</td><td>45</td><td>Sealed Beast, Vermillion Arts, Twisted Chakra, Dormant Beast, Desperate Rage, Frenzy</td></tr>
          <tr><td>2</td><td>7</td><td>110</td><td>Frenzied Drawbacks, choose Path of the Beast</td></tr>
          <tr><td>3</td><td>10</td><td>175</td><td>Chosen Path advances</td></tr>
          <tr><td>4</td><td>15</td><td>220</td><td>Chosen Path advances</td></tr>
          <tr><td>5</td><td>17</td><td>275</td><td>Chosen Path advances</td></tr>
        </tbody></table>
        <h3>Vermillion Formulas</h3>
        <p><strong>Save DC:</strong> 12 + class-mod level + proficiency bonus.</p>
        <p><strong>Attack Bonus:</strong> twice proficiency bonus + class-mod level.</p>
        <h3>Source</h3>
        <p><a href="https://homebrewery.naturalcrit.com/share/JVm5FLmyWZ2r">Sealed Beast Redux - Beta on Homebrewery</a>.</p>
