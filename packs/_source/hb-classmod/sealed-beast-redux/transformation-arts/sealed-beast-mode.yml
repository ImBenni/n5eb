  description:
    value: >-
      <h2>Sealed Beast Mode</h2><h3>Vermillion Art</h3><dl
      class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Transformation Art</dd><dt>Casting Time:</dt><dd>1 Bonus
      Action</dd><dt>Range:</dt><dd>Self</dd><dt>Duration:</dt><dd>1
      minute</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>50 Twisted
      Chakra</dd><dt>Keywords:</dt><dd>Transformation, Vermillion</dd></dl><h3>Description:</h3><p>Tier Five. For 1
      minute you switch places with the sealed beast and fully transform into it.</p><ul><li>Your size becomes its
      size.</li><li>Gain Twisted Hit Points equal to its Hit Points; damage to these also lowers its Hit
      Points.</li><li>Gain Twisted Chakra equal to its Chakra, and form spending lowers its Chakra.</li><li>Use its
      physical ability scores.</li><li>Dormant Beast provides no benefits during this transformation.</li></ul>
