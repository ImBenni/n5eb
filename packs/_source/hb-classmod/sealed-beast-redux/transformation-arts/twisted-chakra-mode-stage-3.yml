  description:
    value: >-
      <h2>Twisted Chakra Mode, Stage 3</h2><h3>Vermillion Art</h3><dl
      class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Transformation Art</dd><dt>Casting Time:</dt><dd>1 Bonus
      Action</dd><dt>Range:</dt><dd>Self</dd><dt>Duration:</dt><dd>1
      minute</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>30 Twisted
      Chakra</dd><dt>Keywords:</dt><dd>Transformation, Vermillion</dd></dl><h3>Description:</h3><p>Tier Three. Your
      cloak assumes the beast's shape and manifests skeletal bones. For 1 minute:</p><ul><li>Speed increases by 60
      feet.</li><li>Strength and Dexterity increase by 4.</li><li>Gain +3 to all Saving Throws.</li><li>Become
      Large.</li><li>Melee weapons gain Reach 2.</li><li>Add twice class-mod level to attack rolls.</li><li>Gain 100
      temporary Hit Points and 35 Twisted Hit Points.</li><li>At the start of a turn below 35 Twisted Hit Points, regain
      them up to 35.</li></ul>
