    value: >-
      <h2>Twisted Chakra Mode</h2><h3>Vermillion Art</h3><dl
      class="n5eb-classmod-summary"><dt>Classification:</dt><dd>Transformation Art</dd><dt>Casting Time:</dt><dd>1 Bonus
      Action</dd><dt>Range:</dt><dd>Self</dd><dt>Duration:</dt><dd>1
      minute</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>10 Twisted
      Chakra</dd><dt>Keywords:</dt><dd>Transformation, Vermillion</dd></dl><h3>Description:</h3><p>Tier One. Twisted
      Chakra forms a bubbling cloak around you. For 1 minute:</p><ul><li>Speed increases by 15 feet.</li><li>Strength
      and Dexterity increase by 2.</li><li>Gain +1 to all Saving Throws.</li><li>Gain 50 temporary Hit
      Points.</li><li>Gain 15 Twisted Hit Points.</li><li>At the start of a turn below 15 Twisted Hit Points, regain
      them up to 15.</li></ul>
