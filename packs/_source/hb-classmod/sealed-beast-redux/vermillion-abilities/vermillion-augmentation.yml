system:
  description:
    value: >-
      <h2>Vermillion Augmentation</h2><p>As a Bonus Action when casting a jutsu using Twisted Chakra, choose
      one:</p><ul><li>A damaging jutsu gains damage dice equal to class-mod level; for multiple attacks, add proficiency
      bonus to each damage roll instead.</li><li>Healing gains dice equal to class-mod level.</li><li>A summoned
      structure, creature, or construct gains Hit Points equal to proficiency bonus times jutsu rank, once per casting
      (D/C/B/A/S = 1/2/3/4/5).</li><li>A save DC increases by class-mod level.</li></ul>
