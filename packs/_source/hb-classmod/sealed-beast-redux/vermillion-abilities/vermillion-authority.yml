system:
  description:
    value: >-
      <h2>Vermillion Authority</h2><p>As a Reaction when a hostile creature attempts a targeted jutsu, attack, ability,
      feature, or trait, spend 25 Twisted Chakra. For 1 minute, a hostile creature within 120 feet that does not target
      you rolls 2d20 on attacks and takes the lower result. If its effect has no attack roll, it must succeed a Wisdom
      save or double the effect's cost, if any.</p>
