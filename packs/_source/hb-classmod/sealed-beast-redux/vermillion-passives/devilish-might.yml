    value: >-
      <h2>Devilish Might</h2><p>Strength increases by 1, plus 2 more during a Transformation Art; maximum bulk increases
      by 10 and you cannot be moved against your will. During Frenzy or a Transformation Art, melee Vermillion Art
      damage dice step up once, melee attacks cannot have disadvantage, and as a Reaction reduce melee-attack damage by
      your Strength modifier.</p>
