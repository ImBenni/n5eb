  description:
    value: >-
      <h2>Devilish Mobility</h2><p>Dexterity increases by 1, plus 2 more during a Transformation Art. Speed increases by
      5 feet per class-mod level. During Frenzy or a Transformation Art, Dexterity checks have advantage; gain Dexterity
      save proficiency or add class-mod level if already proficient; AC cannot be lowered by hostile effects; attacks
      against you cannot gain advantage.</p>
