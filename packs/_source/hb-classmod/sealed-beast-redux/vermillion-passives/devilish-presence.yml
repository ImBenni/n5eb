system:
  description:
    value: >-
      <h2>Devilish Presence</h2><p>Gain Intimidation proficiency; if already proficient, add sealed-beast level to
      Intimidation checks. As a Reaction when viewed with Chakra Sight, force a Charisma save against Vermillion DC;
      failure gives five Demoralized ranks, and failure by 5 also Stuns until the next turn ends, once per creature per
      day.</p><p>During Frenzy or a Transformation Art, an Intimidate Action can force chosen creatures within 90 feet
      to make a Wisdom save, gaining three Demoralized ranks against you for 1 hour on failure; each creature is immune
      for 24 hours afterward and this use recovers on a Short Rest. You automatically succeed saves against banishment,
      teleportation, or forced movement.</p>
