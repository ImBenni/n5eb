system:
  description:
    value: >-
      <h2>Celestial Palm of Peace</h2><dl class="n5eb-classmod-summary"><dt>Origin:</dt><dd>Gentle
      Counter</dd><dt>Classification:</dt><dd>Celestial Art</dd><dt>Casting Time:</dt><dd>1 Reaction, when targeted with
      or damaged by a melee
      attack</dd><dt>Range:</dt><dd>Self</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>M</dd><dt>Cost:</dt><dd>8
      Celestial Chakra</dd><dt>Celestial Strain:</dt><dd>+1</dd><dt>Keywords:</dt><dd>Hijutsu,
      Taijutsu</dd></dl><h3>Description</h3><p>You gently counter an enemy mid-attack, preventing it and attempting to
      prevent further attacks.
          Make a melee Celestial Art attack. If your result is higher than the triggering creature’s attack, nullify and
          cancel its attack, then immediately make a number of Unarmed attacks equal to your character level divided by 4,
          rounded up, minimum 1.</p><h3>Art Magnification</h3><p>Increase the cost by 2 to make 1 additional Unarmed attack.
          Celestial Chakra Mode doubles this benefit.</p>
