folder: 10a1a7fb0f5d333c
name: Celestial Perfect Revolution
type: spell
_id: 99651d161927a2da
img: systems/n5eb/assets/content/classmod-icons/tenseigan/tenseigan.webp
system:
  description:
    value: >-
      <h2>Celestial Perfect Revolution</h2><dl class="n5eb-classmod-summary"><dt>Origin:</dt><dd>Palm
      Rotation</dd><dt>Classification:</dt><dd>Celestial Art</dd><dt>Casting Time:</dt><dd>1 Action; or 1 Reaction when
      targeted by an attack or when you would take damage</dd><dt>Range:</dt><dd>Self (30-foot-radius
      sphere)</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>M, CM</dd><dt>Cost:</dt><dd>11 Celestial
      Chakra</dd><dt>Celestial Strain:</dt><dd>+3</dd><dt>Keywords:</dt><dd>Hijutsu, Taijutsu,
      Clash</dd></dl><h3>Description</h3><p>You spiral Celestial Chakra around your body, creating a vortex like Palm
      Rotation. The vortex
          pulls in surrounding creatures and forms spiraling blades around its edge.</p><h3>Action</h3><p>Select up to 5
          creatures unaffected by the Art. Every other creature and structure in range makes a Strength saving throw. On a
          failure, it is pulled toward you, takes 8d8 force damage, is knocked back 30 feet in a straight line, and falls
          prone. There is no effect on a success. If a structure blocks the push, that structure is destroyed and the
          creature takes an additional 4d8 bludgeoning damage for every 5 feet it is pushed through.</p>
          <h3>Reaction</h3><p>Reduce the triggering damage by 12d8 + three times your Tenseigan level.</p>
          <h3>Art Magnification</h3><p>Increase the cost by 2 to increase action damage by 4d8 or reaction damage reduction by
          3d8. Celestial Chakra Mode doubles the selected benefit.</p>
