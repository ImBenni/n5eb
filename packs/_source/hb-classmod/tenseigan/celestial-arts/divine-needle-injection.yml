system:
  description:
    value: >-
      <h2>Divine Needle Injection</h2><dl class="n5eb-classmod-summary"><dt>Origin:</dt><dd>Tenketsu
      Needle</dd><dt>Classification:</dt><dd>Celestial Art</dd><dt>Casting Time:</dt><dd>1
      Action</dd><dt>Range:</dt><dd>5 feet</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>M,
      CM</dd><dt>Cost:</dt><dd>7 Celestial Chakra</dd><dt>Celestial
      Strain:</dt><dd>+1</dd><dt>Keywords:</dt><dd>Hijutsu, Taijutsu</dd></dl><h3>Description</h3><p>Create Celestial
      Chakra needles on your fingertips and jab them into chakra networks, causing them
          to detonate. Make 3 melee Celestial Art attacks, targeting up to 3 creatures in range with the attacks. On a hit,
          reduce the target’s Chakra by 4d8 + your Taijutsu ability modifier.</p><p>If you strike a creature more than once,
          at the start of its next turn it makes a Constitution saving throw, taking 4d8 + your Taijutsu ability modifier
          force damage for each successful hit on a failure, or half as much on a success.</p>
          <h3>Art Magnification</h3><p>Increase the cost by 2 to make 1 additional attack. Celestial Chakra Mode doubles this
          benefit.</p>
