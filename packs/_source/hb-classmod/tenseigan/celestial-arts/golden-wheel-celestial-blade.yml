system:
  description:
    value: >-
      <h2>Golden Wheel Celestial Blade</h2><dl class="n5eb-classmod-summary"><dt>Origin:</dt><dd>Mountain
      Crusher</dd><dt>Classification:</dt><dd>Celestial Art</dd><dt>Casting Time:</dt><dd>1
      Action</dd><dt>Range:</dt><dd>Self (60-foot cone)</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>M,
      CM</dd><dt>Cost:</dt><dd>14 Celestial Chakra</dd><dt>Celestial
      Strain:</dt><dd>+2</dd><dt>Keywords:</dt><dd>Hijutsu, Taijutsu</dd></dl><h3>Description</h3><p>Create a golden
      blade of Celestial Chakra from your hand and swing it through creatures in a
          60-foot cone. Each creature makes a Constitution saving throw. On a failure, it takes 12d10 force damage and loses
          Chakra equal to half the result.</p><p>A creature whose Chakra reaches 0 from this Art is Weakened for 1 hour. If a
          creature has 0 Chakra before the Art, deal triple damage to its Hit Points and no Chakra damage.</p>
          <h3>Art Magnification</h3><p>Increase the cost by 2 to deal 2d8 additional damage. Celestial Chakra Mode doubles
          this benefit.</p>
