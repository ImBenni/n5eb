system:
  description:
    value: >-
      <h2>Golden Wheel Reincarnation Unlife</h2><dl class="n5eb-classmod-summary"><dt>Origin:</dt><dd>8-Trigrams 64
      Palms</dd><dt>Classification:</dt><dd>Celestial Art</dd><dt>Casting Time:</dt><dd>1
      Action</dd><dt>Range:</dt><dd>Self (30-foot
      sphere)</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>M, CM</dd><dt>Cost:</dt><dd>15 Celestial
      Chakra</dd><dt>Celestial Strain:</dt><dd>+4</dd><dt>Keywords:</dt><dd>Hijutsu, Taijutsu,
      Clash</dd></dl><h3>Description</h3><p>Line your hands in golden Celestial Chakra and strike the spiritual centers
      of nearby creatures.
          Make 2 melee Celestial Art attacks against each creature of your choice in a 30-foot sphere centered on you. On
          each hit, deal 16d8 force damage and reduce the target’s Chakra by half the result.</p><p>A creature affected by
          this Art cannot mold Chakra until after a Long Rest.</p><h3>Art Magnification</h3><p>Increase the cost by 2 to make
          one additional attack against each creature. Celestial Chakra Mode doubles this benefit.</p>
