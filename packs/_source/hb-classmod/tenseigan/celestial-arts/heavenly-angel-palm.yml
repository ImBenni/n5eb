system:
  description:
    value: >-
      <h2>Heavenly Angel Palm</h2><dl class="n5eb-classmod-summary"><dt>Origin:</dt><dd>Lion
      Palm</dd><dt>Classification:</dt><dd>Celestial Art</dd><dt>Casting Time:</dt><dd>1 Bonus
      Action</dd><dt>Range:</dt><dd>Self</dd><dt>Duration:</dt><dd>Concentration, up to 1
      minute</dd><dt>Components:</dt><dd>M, CM</dd><dt>Cost:</dt><dd>15 Celestial Chakra</dd><dt>Celestial
      Strain:</dt><dd>+3</dd><dt>Keywords:</dt><dd>Hijutsu, Taijutsu</dd></dl><h3>Description</h3><p>Celestial Chakra
      coats your palms and forearms in a fiery emerald shape of your choice. You do not
          spend additional Celestial Chakra to maintain concentration.</p><p>While in the Gentle Fist stance, all Unarmed
          attacks deal 4d12 + your Taijutsu ability modifier to Hit Points and reduce Chakra by the same result. Hyūga Clan
          Jutsu you cast have their damage die become d12 and ignore damage reduction, resistance, and immunity.</p>
          <p>When you deal damage with an Unarmed attack, if the creature is not benefiting from a Jutsu, Feature, or Art
          that grants an AC bonus or temporary Hit Points, treat it as vulnerable to your Unarmed attacks.</p>
