system:
  description:
    value: >-
      <h2>Heavenly Palm of Unbirth</h2><dl class="n5eb-classmod-summary"><dt>Origin:</dt><dd>Palm
      Strike</dd><dt>Classification:</dt><dd>Celestial Art</dd><dt>Casting Time:</dt><dd>1
      Action</dd><dt>Range:</dt><dd>5
      feet</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>M</dd><dt>Cost:</dt><dd>9 Celestial
      Chakra</dd><dt>Celestial Strain:</dt><dd>+2</dd><dt>Keywords:</dt><dd>Hijutsu, Taijutsu,
      Clash</dd></dl><h3>Description</h3><p>Collect Celestial Chakra over your hand and strike the spiritual center of a
      target. Make a melee
          Celestial Art attack that scores a critical hit on 18–20. On a hit, deal 7d10 force damage and reduce the target’s
          Chakra by half the result.</p><p>On a critical hit, triple the damage dice and treat every roll of 2 or lower as 3.
          A creature hit by this Art cannot regain Hit Points or Chakra Points until the end of your next turn.</p>
          <h3>Art Magnification</h3><p>Increase the cost by 2 to deal 3d10 additional damage. Celestial Chakra Mode doubles
          this benefit.</p>
