system:
  description:
    value: >-
      <h2>Silver Wheel Blade of Judgement</h2><dl class="n5eb-classmod-summary"><dt>Origin:</dt><dd>Vacuum
      Palm</dd><dt>Classification:</dt><dd>Celestial Art</dd><dt>Casting Time:</dt><dd>1
      Action</dd><dt>Range:</dt><dd>60 feet</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>M,
      CM</dd><dt>Cost:</dt><dd>8 Celestial Chakra</dd><dt>Celestial
      Strain:</dt><dd>+1</dd><dt>Keywords:</dt><dd>Hijutsu, Taijutsu, Clash</dd></dl><h3>Description</h3><p>Fire
      Celestial Chakra beams through creatures’ bodies and spirits. Make 2 ranged Celestial Art
          attacks, targeting up to 2 creatures in range. On a hit, deal 8d8 force damage and reduce Chakra by half the
          result.</p><p>Each creature in a 5-foot-wide, 30-foot-long line directly behind a hit target makes a Dexterity save,
          taking 8d8 force damage on a failure or half as much on a success.</p><h3>Art Magnification</h3><p>Increase the cost
          by 2 to fire 1 additional beam. Celestial Chakra Mode doubles this benefit.</p>
