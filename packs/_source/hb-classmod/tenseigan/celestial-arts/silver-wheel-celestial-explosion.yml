system:
  description:
    value: >-
      <h2>Silver Wheel Celestial Explosion</h2><dl class="n5eb-classmod-summary"><dt>Origin:</dt><dd>Vacuum Wall
      Palm</dd><dt>Classification:</dt><dd>Celestial Art</dd><dt>Casting Time:</dt><dd>1 Action</dd><dt>Range:</dt><dd>5
      feet</dd><dt>Duration:</dt><dd>Instant</dd><dt>Components:</dt><dd>M, CM</dd><dt>Cost:</dt><dd>14 Celestial
      Chakra</dd><dt>Celestial Strain:</dt><dd>+3</dd><dt>Keywords:</dt><dd>Hijutsu, Taijutsu,
      Clash</dd></dl><h3>Description</h3><p>Create 8 Celestial Chakra spheres around your palm and inject them into a
      creature. Make a melee
          Celestial Art attack. On a hit, reduce the target’s Chakra by three times your Unarmed damage plus 10d6.</p>
          <p>The Chakra loss explodes outward, dealing force damage to the target equal to the Chakra lost. Every other
          creature in a 30-foot sphere centered on it makes a Dexterity save, taking that amount as force damage on a failure
          or half as much on a success.</p><h3>Art Magnification</h3><p>Increase the cost by 2 to increase the Chakra
          reduction by 3d6. Celestial Chakra Mode doubles this benefit.</p>
