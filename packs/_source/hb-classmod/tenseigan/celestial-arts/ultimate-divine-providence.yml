system:
  description:
    value: >-
      <h2>Ultimate Divine Providence</h2><dl
      class="n5eb-classmod-summary"><dt>Origin:</dt><dd>—</dd><dt>Classification:</dt><dd>Celestial Art</dd><dt>Casting
      Time:</dt><dd>1 Full Turn Action</dd><dt>Range:</dt><dd>Self</dd><dt>Duration:</dt><dd>Concentration, up to 1
      minute</dd><dt>Components:</dt><dd>CM</dd><dt>Cost:</dt><dd>30 Celestial Chakra</dd><dt>Celestial
      Strain:</dt><dd>+10</dd><dt>Keywords:</dt><dd>Hijutsu, Ninjutsu, Fuinjutsu</dd></dl><h3>Description</h3><p>Use
      Celestial Chakra and Fūinjutsu to conjure a giant construct made of Celestial Chakra and the
          most abundant inorganic substance nearby. Its design is your choice and its size makes mountains look small. You
          may unsummon it as a bonus action.</p><p>The seven-headed construct acts in your place on your turn, using your
          Action, Bonus Action, movement, and reaction as you decide. You cannot act while it is active. You are inside it,
          hidden from all other creatures and unable to be targeted.</p><p>Use the source-linked Ultimate Divine Providence
          helper Actor for its complete statistics, traits, head tracking, attacks, Sacrificial Defense, and Celestial Art:
          Subjugate.</p>
