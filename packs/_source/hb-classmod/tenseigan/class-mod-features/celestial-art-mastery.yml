system:
  description:
    value: |-
      <h2>Celestial Art Mastery</h2><p>When you gain the Tenseigan, you or the GM rolls 2d6 and adds 5.
          Record the result for each Celestial Art. You must use each known Celestial Art that many times in life-threatening
          combat against Standard- or higher-rank adversaries before that Art is mastered.</p><p>The progression table
          requires 1 mastered Celestial Art for class-mod level 2, 2 for level 3, 3 for level 4, and 4 for level 5.</p>
