system:
  description:
    value: |-
      <h2>Celestial Arts</h2><p>While your Tenseigan is active, you gain a pool of Celestial Chakra. It can
          only power Hyūga Clan Jutsu and Celestial Arts.</p><p>If you use Celestial Chakra to cast a Hyūga Clan Jutsu, each
          1 Celestial Chakra spent counts as 2 Chakra Points and the Jutsu is also treated as a Celestial Art in addition to
          a Hyūga Clan Jutsu.</p><p>Celestial Arts are extremely powerful amplified versions of existing Hyūga Clan Jutsu.
          You do not need to know the originating Hyūga Clan Jutsu to use one.</p><p>You learn 2 Celestial Arts at 1st level
          of this class mod and one additional Celestial Art at each later level.</p>
          <h3>Celestial Art Formulas</h3><p><strong>Save DC:</strong> 12 + your class-mod level + your proficiency bonus.</p>
          <p><strong>Attack Bonus:</strong> twice your proficiency bonus + your class-mod level.</p>
