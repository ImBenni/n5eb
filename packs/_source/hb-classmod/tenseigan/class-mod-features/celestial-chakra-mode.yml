system:
  description:
    value: |-
      <h2>Celestial Chakra Mode</h2><p>At 3rd level, as a bonus action, coat your body in an emerald green,
          golden yellow, or ashy white cloak of Chakra. It lasts for 1 minute and can be ended as a bonus action.</p>
          <h3>Class-Mod Levels 3–4</h3><ul><li>Your Taijutsu Ability Score becomes 24.</li><li>Your Speed is doubled.</li>
          <li>Celestial Art costs are reduced by 3.</li><li>Celestial Art Strain is reduced by 1, minimum 1.</li>
          <li>Each Celestial Chakra spent on a Hyūga Clan Jutsu counts as 3 Chakra Points.</li><li>Those Hyūga Clan Jutsu are
          treated as one rank higher.</li><li>When you benefit from a single Art Magnification, double its benefits.</li>
          <li>Increase your Celestial Art Save DC by 2 and Attack Bonus by 4.</li></ul>
          <h3>Class-Mod Level 5</h3><ul><li>Your Taijutsu Ability Score becomes 28.</li><li>You gain a flying speed equal to
          your movement speed.</li><li>Celestial Art costs are reduced by a total of 4.</li><li>Celestial Art Strain is
          reduced by 2, minimum 1.</li><li>Each Celestial Chakra spent on a Hyūga Clan Jutsu counts as 5 Chakra Points.</li>
          <li>Increase your Celestial Art Save DC by 3 and Attack Bonus by 6.</li></ul>
