system:
  description:
    value: |-
      <h2>Celestial Chakra</h2><p>Your maximum Celestial Chakra is 30 at class-mod level 1, 45 at level 2,
          60 at level 3, 75 at level 4, and 100 at level 5. It can only power Hyūga Clan Jutsu and Celestial Arts.</p>
          <p>Spent Celestial Chakra only recovers when you rest. A Short Rest recovers half your maximum Celestial Chakra,
          and you can recover it this way twice per Long Rest. A Long Rest recovers all spent Celestial Chakra, and you can
          recover it this way once per Full Rest.</p>
