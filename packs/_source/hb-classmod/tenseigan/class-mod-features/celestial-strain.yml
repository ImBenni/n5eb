system:
  description:
    value: |-
      <h2>Celestial Strain</h2><p>For every 3 Celestial Chakra you spend casting a single Hyūga Clan Jutsu,
          gain 1 rank of Celestial Strain. Celestial Arts impose the Strain listed in their text. A Full Rest reduces Strain
          by 2. One week of downtime spent recuperating reduces it by 5.</p>
          <table><thead><tr><th>Ranks</th><th>Effect</th></tr></thead><tbody>
          <tr><td>1+</td><td>Reduce your maximum Hit Die by 1 for every 4 ranks.</td></tr>
          <tr><td>5+</td><td>−2 to Wisdom ability checks and saving throws.</td></tr>
          <tr><td>8+</td><td>−2 to Charisma ability checks and saving throws.</td></tr>
          <tr><td>11+</td><td>−2 to Constitution ability checks and saving throws.</td></tr>
          <tr><td>15+</td><td>While Tenseigan is active, take 1d6 + 1 irreducible necrotic damage at the start of each turn.</td></tr>
          <tr><td>20+</td><td>You must maintain concentration on Tenseigan; it does not count against your concentration limit.</td></tr>
          <tr><td>25+</td><td>Reduce your maximum Hit Die by 1 for every 2 ranks instead.</td></tr>
          <tr><td>30+</td><td>You can only concentrate on one Jutsu or Art and have disadvantage on Constitution (Chakra
          Control) checks to maintain concentration.</td></tr></tbody></table>
    chat: ""
