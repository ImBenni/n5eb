system:
  description:
    value: |-
      <h2>Celestial Truth Orbs</h2><p>At 4th level, when you enter Celestial Chakra Mode, create 6
          crystallized Celestial Chakra orbs that orbit you and obey your mental commands. Spent orbs cannot be recreated
          until after a Long Rest.</p><h3>Actions</h3><ul><li><strong>1 Orb:</strong> make a ranged Celestial Art attack
          against a creature within 90 feet. On a hit, it takes 10d6 force damage, loses Chakra equal to half the result, and
          makes a Strength save or is knocked back 45 feet.</li><li><strong>2 Orbs:</strong> a target gains 45 temporary Hit
          Points for 1 minute.</li><li><strong>3 Orbs:</strong> launch a sphere within 120 feet that fills a 90-foot sphere.
          Creatures make a Dexterity save, taking 16d8 force damage and becoming unable to mold Chakra until after a Short
          Rest on a failure, or half damage on a success. A creature reduced to 0 Hit Points is turned into Celestial Chakra;
          you gain temporary Celestial Chakra equal to its level, which can stack.</li></ul>
          <h3>Bonus Actions</h3><ul><li><strong>1 Orb:</strong> pay the cost of one Art Magnification or Celestial Art upcast
          instead of Chakra Dice.</li><li><strong>2+ Orbs:</strong> spend any number of remaining orbs; the next time you
          would take damage, one orb intercepts it and shatters.</li></ul><h3>Reactions</h3><ul>
          <li><strong>2 Orbs:</strong> negate a Ninjutsu, Genjutsu, or Taijutsu that targets or affects you.</li>
          <li><strong>3 Orbs:</strong> absorb a Ninjutsu or Genjutsu that targets or affects you and release it at the
          triggering creature using your Celestial Attack Bonus or Save DC.</li><li><strong>4 Orbs:</strong> when you clash,
          add your class-mod level to the check. On a success, the loser suffers Golden Wheel Reincarnation Unlife as if both
          attacks hit it.</li></ul>
