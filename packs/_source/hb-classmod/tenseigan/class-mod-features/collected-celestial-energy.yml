system:
  description:
    value: |-
      <h2>Collected Celestial Energy</h2><p>While Reincarnation Eye is collecting energy, the spent value
          of this tracker is the amount collected. At the end of each turn after activation, add 1d10 + four times your
          class-mod level, up to your maximum Celestial Chakra.</p><p>Consume the stored energy to grant chosen allies within
          60 feet temporary Hit Points equal to half the total, to reform yourself with Hit Points equal to the total when
          the source trigger is met, or to reincarnate a creature dead no longer than 10 minutes.</p>
    chat: ""
  source:
