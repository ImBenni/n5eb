folder: ccc5494764162de4
name: Reincarnation Eye
type: feat
_id: a83189a126d1b4d0
img: systems/n5eb/assets/content/classmod-icons/tenseigan/tenseigan.webp
system:
  description:
    value: |-
      <h2>Reincarnation Eye</h2><p>At 2nd level, for the duration of Tenseigan you can see a person’s name
          as if floating above their head, whether they belong on this plane or dimension, and whether they lie to you. You
          can see whether a creature’s spirit has been reincarnated, who it was in different lives, and when the weave of
          reality is damaged or bent out of shape.</p><h3>Collect Celestial Energy</h3><p>As an action, begin collecting
          Celestial Energy into a single point within you. Your body glows with a soft golden hue. For the next minute, at the
          end of each turn after activation, roll 1d10 + four times your Tenseigan level and add it to your previous total,
          up to your maximum Celestial Chakra.</p><p>As an action, consume the energy to grant yourself and chosen allies
          within 60 feet temporary Hit Points equal to half the total. The feature ends and cannot be used again until after
          a Long Rest.</p><h3>Reincarnation</h3><p>If your Hit Points fall to 0 while collecting, the feature immediately
          activates and prevents further damage. You are destroyed and reformed simultaneously, regaining Hit Points equal
          to the stored total. This ignores decapitation, disintegration, soul theft, or removal. If a Jutsu, ability, or
          feature uses your soul as part of its cost or effect, it immediately ends and is negated.</p><p>Alternatively, you
          may imbue a creature dead no longer than 10 minutes with the collected energy, reincarnating it as though it gained
          these benefits. After either alternative effect, no effect of this feature can be used for 4d4 weeks.</p>
