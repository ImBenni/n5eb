system:
  description:
    value: |-
      <h2>Tenseigan</h2><p>Beginning at 1st level of this class mod, you have unlocked the power of the
          Tenseigan. When the Tenseigan is activated, the ordinarily featureless Byakugan gains blue eyes filled with what
          resemble overlapping white flower patterns. One of your Byakugan transforms into the Tenseigan.</p>
          <h3>Activation</h3><p>As a bonus action, you can spend 10 Chakra to activate the Tenseigan. The Tenseigan remains
          active for 1 minute, or until your Chakra Points or Celestial Chakra reach 0. While active, your Tenseigan counts as
          your Byakugan for any features or Jutsu that require it. You may deactivate the Tenseigan as a bonus action on your
          turn.</p><h3>Perfect Vision</h3><p>You gain 120 feet of Truesight, your vision can never be obscured, and you are
          immune to the Blinded condition.</p><h3>Otherworldly Sight</h3><p>You can see the world between life and death. You
          can see pocket dimensions, spatial distortions, and the souls of living and dead creatures.</p>
          <h3>Celestial Oversight</h3><p>You have 1,000 feet of Chakra Sight and can see through up to 50 feet of material
          within your Chakra Sight range.</p><h3>Second Level</h3><p>Beginning at 2nd level of this class mod, your Tenseigan
          envelops your second Byakugan and can remain active for up to 10 minutes.</p>
