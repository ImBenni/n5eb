system:
  description:
    value: |-
      <h2>Tenseigan</h2><p>Unlocking the Tenseigan is a total anomaly. Considered significantly
        rarer than even the Rinnegan and called the Reincarnation Eye or Eye of the Heavens, it is said that in times of
        chaos one who wields it appears to wash away the sins of humanity and usher in a prosperous age under the wielder’s
        watchful eye.</p><p>The Tenseigan is an early- to late-game class mod that should be used with moderation and
        consideration for the rest of the group. Its introductory text says it can only be gained by a character who has
        reached character level 5 and received exceptional training. The mechanical progression table instead lists
        character level 4 as the 1st-level minimum; the source does not reconcile this difference.</p>
        <h3>Celestial Chakra</h3><p>Celestial Chakra is a powerful subtype of Nature Chakra drawn from the lifeforce of the
        celestial body on which the user resides. Access is exceptionally rare and tied to blood close to the Ōtsutsuki
        source of the Tenseigan. Activating the Tenseigan marks the bearer as the reincarnation of a long-dead member of the
        lunar Ōtsutsuki branch who escaped to Earth and joined humans or the Hyūga clan.</p>
        <h3>Gaining the Tenseigan</h3><p>Only a Hyūga—or, more specifically, someone born with a Byakugan—can access the
        Tenseigan. Celestial Chakra magnifies the bearer’s visual prowess and teaches conscious access to that Chakra. It
        should arise as a surprise through a major traumatic event, struggle, trial, or GM-led story development rather than
        as an automatically planned advancement.</p>
        <table><thead><tr><th>Condition 1</th><th>Condition 2</th><th>Condition 3</th></tr></thead><tbody>
        <tr><td>Reach 0 Hit Points</td><td>Experience blinding, irrational anger</td><td>Lose a Jutsu Clash that would reduce
        you to 0 Hit Points</td></tr><tr><td>Watch an ally reach 0 Hit Points</td><td>Watch an ally die</td><td>Be infused
        with Celestial Chakra by an adversary</td></tr><tr><td>Unlock a Secret Seal</td><td>Fail 2 death saving throws</td>
        <td>Have your Hyūga Curse Mark forcibly removed</td></tr><tr><td>Be marked by a Cursed Seal with Celestial Chakra</td>
        <td>Perform a secret ritual to access Celestial Chakra</td><td>Experience unrivaled failure</td></tr>
        <tr><td>Experience serious mental trauma</td><td>Experience serious physical trauma</td><td>Experience serious
        emotional trauma</td></tr></tbody></table>
        <h3>Leveling the Tenseigan</h3><p>Rather than earning XP for this class mod, master its abilities while confronting
        the strain they place on a human body. Roll 5 + 2d6 when the Tenseigan is gained. Each known Celestial Art must be
        used that many times in life-threatening combat against Standard- or higher-rank adversaries to be mastered.</p>
        <table><thead><tr><th>Level</th><th>Minimum Requirement</th><th>Celestial Arts Mastered</th>
        <th>Arts Known</th><th>Celestial Chakra</th><th>Features</th></tr></thead><tbody>
        <tr><td>1</td><td>Character Level 4</td><td>—</td><td>2</td><td>30</td><td>Tenseigan, Celestial Arts, Celestial
        Strain</td></tr><tr><td>2</td><td>Character Level 8</td><td>1</td><td>3</td><td>45</td><td>Tenseigan (2),
        Reincarnation Eye</td></tr><tr><td>3</td><td>Character Level 12</td><td>2</td><td>4</td><td>60</td><td>Celestial
        Chakra Mode</td></tr><tr><td>4</td><td>Character Level 14</td><td>3</td><td>5</td><td>75</td><td>Tenseigan (3),
        Celestial Truth Orbs</td></tr><tr><td>5</td><td>Character Level 16</td><td>4</td><td>6</td><td>100</td><td>Celestial
        Chakra Mode (2)</td></tr></tbody></table><p>The table names “Tenseigan (3)” at 4th level but provides no accompanying
        rule text or stated mechanical benefit.</p>
