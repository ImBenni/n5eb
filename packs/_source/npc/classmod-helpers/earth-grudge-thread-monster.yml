    biography:
      value: >-
        <h2>Thread Monster Template</h2><p>Set this Actor's CR to the summoner's Earth Grudge Fear level. After
        summoning, set AC to the full Threaded Art Save DC, maximum HP and temporary Chakra to four times that DC, and
        add the heart's stolen Jutsu. The native summon profile matches attacks, saves, and proficiency from the
        owner.</p><p>Its natural weapon deals 3d6 plus class-mod level necrotic damage at 15-foot reach. It has no bonus
        action unless Puppeteer's Monsters is known.</p>
