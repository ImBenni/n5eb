  details:
    biography:
      value: >-
        <h2>Threaded Chimera</h2><p>Set this Actor's CR to the summoner's Earth Grudge Fear level and its Chakra to the
        combined Chakra of the component monsters. Its source has no Hit Points: Absorption converts every damage event
        into Decay instead. The 1 HP on this helper only keeps its token operable.</p><p>It acts immediately after the
        summoner, knows the component monsters' Jutsu, and can be dismissed as a bonus action.</p>
