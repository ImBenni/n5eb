    img: systems/n5eb/assets/content/classmod-icons/earth-grudge-fear/final-shot.webp
    system:
      description:
        value: >-
          <h2>Threaded Chimera Traits</h2><h3>Absorption</h3><p>Instead of taking damage, the Chimera incurs Decay. The
          first event costs 30 minus five times the summoner's class-mod level; every later event adds 10 minus that
          level to the prior cost.</p><h3>Terror of the Threads</h3><p>It knows every component monster's Jutsu.
          Increase each Jutsu damage die one step, change its damage to necrotic, and use the summoner's Threaded Art DC
          and Attack Bonus.</p><h3>Hardened Threads</h3><p>It has damage reduction against all damage equal to three
          times the summoner's class-mod level; at level 5 use Mastered Earth Grudge Fear instead.</p><h3>Deflecting
          Threads</h3><p>It uses the summoner's saving throws.</p><h3>Multiattack</h3><p>It attacks a number of times
          equal to its component Thread Monsters.</p><h3>Casting Jutsu</h3><p>Per Action it may cast a number of Jutsu
          equal to component monsters minus two, minimum one.</p>
